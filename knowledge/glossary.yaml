stages:
  draft: Черновик
  on_review: На проверке
  needs_rework: На доработке
  awaiting_invoice: Ожидает счёта
  awaiting_payment: Ожидает оплаты
  awaiting_issue: Ожидает выдачи
  books_out: Книги у клиента
  closed: Закрыта
  archived: Архив
  closed_duplicate: Закрыта как дубль

kinds:
  paid: платная
  debt: в долг
  social: социальная

# Роли: русское название и имена параметров, по которым код определяет исполнителя.
roles:
  operator: {ru: Оператор, params: [operator_id]}
  reviewer_lead: {ru: Руководитель проверяющих, params: []}
  reviewer: {ru: Проверяющий, params: [reviewer_id]}
  accountant: {ru: Бухгалтер, params: [accountant_id]}
  chief_accountant: {ru: Главный бухгалтер, params: [chief_id]}
  site_checker: {ru: Проверяющий оператор, params: [site_checker_id]}
  admin: {ru: Администратор, params: []}
  client: {ru: Клиент, params: [token]}
  representative: {ru: Представитель клиента, params: []}
  system: {ru: Система (события и фоновые задачи), params: []}

services:
  applications: Заявки, клиенты, площадки (админка), процесс заявки, архив, дедупликация
  billing: Счета, платежи, штрафы, закрепление бухгалтера
  scheduling: Расписание площадок, ссылки и запись на визит, выдача и возврат книг
  notifications: Письма клиенту и представителю по шаблонам
  chat: Чат заявки и лента событий
