- id: R-HALLS-TIMER-01
  title: Черновик без предоплаты автоматически отменяется через 30 дней после создания
  text: >
    Задача cancel_unpaid отменяет с причиной unpaid брони в статусе draft, у которых created_at ≤ now
    − UNPAID_CANCEL_DAYS (30). Строки берутся с блокировкой FOR UPDATE SKIP LOCKED. Срок отсчитывается
    от создания брони, а не от даты мероприятия: если мероприятие ближе 30 дней, неоплаченный черновик
    доживёт до него и останется draft. Предоплаченные (prepaid) брони задача не трогает.
  kind: timer
