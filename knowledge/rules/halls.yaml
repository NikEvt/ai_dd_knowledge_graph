  text: >
    BEFORE UPDATE OF venue_id на hall_bookings выбрасывает check_violation («бронь … подтверждена, площадку
    сменить нельзя»), если старый статус confirmed или held и venue_id меняется. Триггер дублирует проверку
    в change_venue. Смену hall_id внутри той же площадки он не ловит.
