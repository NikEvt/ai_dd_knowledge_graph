- id: R-HALLS-CANCEL-01
  title: Отменить можно любую бронь, кроме уже отменённой и проведённой
  text: >
    cancel_booking отклоняет повторную отмену («бронь уже отменена») и отмену проведённого мероприятия
    («мероприятие уже прошло»). Отменить можно бронь в статусе draft, prepaid и даже confirmed (полностью
    оплаченную). Отмена ставит cancelled, cancelled_at и cancel_reason (по умолчанию client_request) и
    публикует halls.booking_cancelled. Отменённая бронь освобождает зал.
