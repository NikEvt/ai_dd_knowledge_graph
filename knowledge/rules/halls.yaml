  title: Статусы брони и согласованность дат отмены и подтверждения
  text: >
    Статус брони — draft, prepaid, confirmed, held или cancelled (CHECK). По CHECK cancelled_at задан
    тогда и только тогда, когда статус cancelled. Для confirmed и held обязателен confirmed_at. Код ставит
    эти поля вместе со статусом: в _cancel и в apply_payments.
