- id: R-HALLS-VENUE-CHANGE-03
  title: Смена площадки перевыставляет счёт по ставке нового зала с переносом платежей
  text: >
    На halls.venue_changed подписчик вызывает reissue_invoice (только для draft и prepaid). Код аннулирует
    действующий счёт и выставляет новый по ставке нового зала, после чего уходит письмо со счётом. Все
    платежи старого счёта перепривязываются к новому. Если их хватает на новую сумму, счёт сразу закрывается
    как paid. Затем публикуется halls.payment_received, и apply_payments пересчитывает статус: бронь может
    стать confirmed, остаться prepaid или откатиться в draft. Если внесено больше суммы нового (более
    дешёвого) счёта, переплата не возвращается.
  kind: effect
  applies_to:
  - table:halls.hall_bookings
  trigger: event:halls.venue_changed
  effects:
  - 'invalidates: table:halls.hall_invoices'
  - 'writes: table:halls.hall_payments'
  - event:halls.invoice_issued
  - event:halls.payment_received
  roles:
  - system
  related:
  - R-HALLS-VENUE-CHANGE-01
  - R-HALLS-STATUS-03
