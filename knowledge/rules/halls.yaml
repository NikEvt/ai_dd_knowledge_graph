- id: R-HALLS-STATUS-03
  title: Предоплаченная бронь возвращается в черновик, если после перевыставления не хватает предоплаты
  text: >
    Если по действующему счёту внесено меньше PREPAY_SHARE его суммы (например, после переноса в более
    дорогой зал), apply_payments молча возвращает бронь из prepaid в draft: без события и без письма клиенту.
    created_at не меняется. Поэтому задача cancel_unpaid может сразу отменить такую бронь, если с её создания
    прошло больше UNPAID_CANCEL_DAYS.
