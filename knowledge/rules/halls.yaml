  text: >
    apply_payments переводит бронь в статусе draft или prepaid в confirmed, если внесённое покрывает действующий
    счёт, ставит confirmed_at и публикует halls.booking_confirmed. Подписчик записывает письмо типа confirmed.
    Полная оплата черновика подтверждает его сразу, минуя prepaid и письмо о предоплате. CHECK требует
    confirmed_at для статусов confirmed и held.
  kind: effect
  applies_to:
