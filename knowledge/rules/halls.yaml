- id: R-HALLS-STATUS-02
  title: Оплата половины счёта делает черновик предоплаченным
  text: >
    Если внесено не меньше PREPAY_SHARE (0.5) суммы действующего счёта, но не всё, apply_payments переводит
    бронь из draft в prepaid и публикует halls.booking_prepaid с внесённой суммой. Подписчик записывает
    письмо типа prepaid. Повторные частичные платежи по предоплаченной брони статус не меняют и писем
    не дают.
  kind: effect
  applies_to:
