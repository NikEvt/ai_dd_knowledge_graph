  text: >
    На halls.booking_cancelled подписчик аннулирует действующий счёт, если тот open, и записывает письмо
    типа cancel с причиной отмены. Счёт со статусом paid (отмена подтверждённой брони) остаётся paid.
    Платежи по аннулированному или оплаченному счёту не возвращаются: возврата в модуле нет.
  kind: effect
