  title: Полная оплата закрывает счёт, любой платёж пересчитывает статус брони
  text: >
    После записи платежа счёт, оплаченный полностью, получает статус paid и closed_at. В любом случае
    публикуется halls.payment_received. Его подписчик on_payment_received вызывает apply_payments и пересчитывает
