- id: R-HALLS-VENUE-CHANGE-01
  title: Бронь переносится на другую площадку только до подтверждения
  text: >
    change_venue разрешён только для броней в статусе draft или prepaid («площадку можно сменить только
    до подтверждения брони»). Новый зал должен быть на другой площадке («зал находится на той же площадке»),
    сдаваться, вмещать гостей и быть свободным в то же время. Время брони не меняется, сроки MIN_LEAD_DAYS
    и BOOKING_HORIZON_DAYS не перепроверяются. Перенос в другой зал той же площадки не поддерживается.
  kind: guard
