- id: R-REPORTS-RUN-01
  title: При запуске можно переопределить только период, дату и разрез
  text: >
    Параметры ручного запуска ограничены RUN_OVERRIDABLE (days, as_of, dimension); остальные отклоняются
    («при запуске нельзя менять параметры»). Затем параметры проверяются по правилам типа отчёта, поэтому
    для run_audit dimension тоже отклоняется как лишний параметр. В запуске сохраняются только переопределения:
    параметры определения подмешиваются при построении, так что правка определения до начала построения
    меняет результат уже запрошенного запуска.
  kind: guard
  applies_to:
  - table:reports.report_runs
  trigger: symbol:services/reports/api.py::request_run
  related:
  - R-REPORTS-DEF-04
  - R-REPORTS-CALC-01
  implemented_by:
