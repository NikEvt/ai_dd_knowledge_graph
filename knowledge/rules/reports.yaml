# Правила модуля reports: извлечены LLM (tools/knowledge/bootstrap_rules.sh) из кода и среза графа.
# Статус verified ставит только человек. Хэши обновляет tools/knowledge/drift.py --write.
rules:
- id: R-REPORTS-DEF-01
  title: Настройки отчёта меняет только его владелец
  text: >
    Изменять определение отчёта, отключать его и ставить на расписание может только сотрудник, чей id
    совпадает с owner_id определения; иначе AccessDenied «настройки отчёта меняет только его владелец».
    Проверка в _owned_definition, её вызывают update_definition, deactivate_definition и create_schedule.
    Идентификатор действующего лица (`by`, `owner_id`) API берёт из параметров запроса без аутентификации.
  kind: permission
  applies_to:
  - table:reports.report_definitions
  trigger: symbol:services/reports/service.py::_owned_definition
  related:
  - R-REPORTS-DEF-08
  - R-REPORTS-SCHED-01
  implemented_by:
  - symbol: services/reports/service.py::_owned_definition
    lines: 84-88
    hash: dfe58c966989
  - symbol: services/reports/service.py::update_definition
    lines: 146-146
    hash: e26646217409
  - symbol: services/reports/service.py::deactivate_definition
    lines: 167-167
    hash: d66ea9383399
  tested_by:
  - tests/test_reports_definitions.py::test_only_owner_changes_definition
  status: draft
- id: R-REPORTS-DEF-02
  title: Название отчёта обязательно и уникально среди действующих отчётов владельца
  text: >
    Название обрезается по краям и не может быть пустым. У одного владельца не может быть двух действующих
    (is_active) отчётов с одинаковым названием без учёта регистра; отключённые отчёты название не занимают.
    Код проверяет это при создании и при переименовании (кроме самого отчёта), БД дублирует проверку частичным
    уникальным индексом по (owner_id, lower(title)) WHERE is_active и CHECK на непустое название.
  kind: invariant
  applies_to:
  - table:reports.report_definitions
  trigger: symbol:services/reports/service.py::create_definition
  related:
  - R-REPORTS-DEF-08
  implemented_by:
  - symbol: services/reports/service.py::create_definition
    lines: 114-121
    hash: 27db94574c00
  - symbol: services/reports/service.py::update_definition
    lines: 149-154
    hash: e26646217409
  - symbol: services/reports/service.py::_check_title_free
    lines: 91-102
    hash: 8ac6d3b73274
  enforced_by_db:
  - constraint: report_definitions_owner_title_active
    hash: c3ada976e00d
  - constraint: report_definitions_title_not_blank
    hash: f0956aa1b20e
  tested_by:
  - tests/test_reports_definitions.py::test_code_unique_and_title_unique_per_owner
  - tests/test_reports_definitions.py::test_title_released_after_deactivation
  status: draft
- id: R-REPORTS-DEF-03
  title: Код отчёта уникален навсегда, его формат проверяет только БД
  text: >
    Код отчёта уникален среди всех определений, включая отключённые: занятый код нельзя использовать повторно
    («код отчёта … уже занят»). Формат кода (^[a-z][a-z0-9_-]{2,63}$) код не проверяет — неверный код
    отклоняет только CHECK в БД, и это приходит ошибкой БД, а не DomainError.
  kind: invariant
  applies_to:
  - table:reports.report_definitions
  trigger: symbol:services/reports/service.py::create_definition
  implemented_by:
  - symbol: services/reports/service.py::create_definition
    lines: 119-120
    hash: 27db94574c00
  enforced_by_db:
