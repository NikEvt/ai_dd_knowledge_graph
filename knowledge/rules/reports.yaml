- id: R-REPORTS-RUN-05
  title: Итог построения — completed с телом отчёта или failed с текстом ошибки
  text: >
    Если построитель бросает DomainError (например, за период нет данных), запуск становится failed, ошибка
    сохраняется в error и публикуется reports.run_failed. При успехе тело отчёта сохраняется в body, запуск
    становится completed и публикуется reports.run_completed с code отчёта, schedule_id и датой finished_on.
  kind: effect
  applies_to:
  - table:reports.report_runs
  trigger: event:reports.run_requested
  effects:
  - 'publishes: event:reports.run_failed'
  - 'publishes: event:reports.run_completed'
  roles:
  - system
  related:
