  - services/reports/models.py::FINISHED
  tested_by:
  - tests/test_reports_db.py::test_run_status_rules_enforced_in_db
  status: draft
- id: R-REPORTS-RUN-08
  title: Завершённый запуск неизменяем, его можно только удалить
  text: >
    Триггер trg_report_runs_immutable запрещает любое UPDATE строки запуска в статусе completed, failed
    или cancelled. Удалять такие строки можно — это делает purge_old_runs по сроку хранения. CHECK требуют,
    чтобы finished_at был заполнен ровно у завершённых запусков; _finish ставит status, body, error и
    finished_at одновременно.
  kind: invariant
  applies_to:
  - table:reports.report_runs
  trigger: table:reports.report_runs
  related:
  - R-REPORTS-RUN-07
  - R-REPORTS-TIMER-02
  implemented_by:
  - symbol: services/reports/service.py::_finish
    lines: 261-267
    hash: 36f3e526ffa9
  enforced_by_db:
