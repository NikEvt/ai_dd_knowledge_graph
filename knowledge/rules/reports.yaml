- id: R-REPORTS-RUN-02
  title: Лимит незавершённых ручных запусков на сотрудника
  text: >
    У сотрудника может быть не больше одного незавершённого (requested/running) ручного запуска одного
    отчёта и не больше MAX_PENDING_RUNS_PER_USER (3) таких запусков всего. Запуски по расписанию в лимит
    не входят и не проверяются. Первое ограничение дублирует частичный уникальный индекс report_runs_one_in_flight
    (definition_id, requested_by) WHERE schedule_id IS NULL AND status IN (requested, running).
  kind: guard
  applies_to:
  - table:reports.report_runs
  trigger: symbol:services/reports/service.py::request_run
  related:
  - R-REPORTS-SCHED-06
  implemented_by:
