- id: R-REPORTS-TIMER-01
  title: Запуск, который строится дольше 30 минут, помечается неуспешным
  text: >
    fail_stuck_runs переводит запуски running со started_at раньше now − RUN_TIMEOUT_MINUTES (30) в failed
    с ошибкой-литералом «превышено время построения отчёта» и публикует reports.run_failed. Запуски, застрявшие
    в requested (событие так и не обработано), эта задача не трогает.
  kind: timer
  applies_to:
