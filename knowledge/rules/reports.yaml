    hash: aa26c8e239e6
  - constraint: report_definitions_code_format
    hash: cdf979e8aafa
  tested_by:
  - tests/test_reports_definitions.py::test_code_unique_and_title_unique_per_owner
  status: draft
- id: R-REPORTS-DEF-04
  title: Тип отчёта — один из трёх, у каждого типа свой набор параметров
  text: >
    Допустимые типы — metric_summary, metric_trend, run_audit (константа KINDS и CHECK в БД). Для каждого
    типа задан набор допустимых параметров (_ALLOWED): сводка — metrics, days, dimension, as_of; динамика
    — metric, days, dimension, as_of; аудит запусков — только days и as_of. Неизвестный тип и лишние параметры
    отклоняются в normalize_params. params в БД обязан быть JSON-объектом.
  kind: invariant
  applies_to:
  - table:reports.report_definitions
  trigger: symbol:services/reports/builders.py::normalize_params
  related:
  - R-REPORTS-DEF-05
  - R-REPORTS-DEF-06
  - R-REPORTS-RUN-01
  implemented_by:
