- id: R-REPORTS-DEF-09
  title: Отключение отчёта гасит его расписания и публикует reports.definition_deactivated
  text: >
    DELETE /reports/definitions/{id} — мягкое удаление: владелец ставит is_active = false (повторный вызов
    ничего не делает), в той же транзакции отключаются все действующие расписания выгрузки отчёта и публикуется
    reports.definition_deactivated. Название освобождается для нового отчёта.
  kind: effect
  applies_to:
  - table:reports.report_definitions
  trigger: symbol:services/reports/api.py::deactivate_definition
  effects:
