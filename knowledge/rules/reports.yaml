- id: R-REPORTS-RUN-06
  title: Отменить запуск может только запросивший и только до начала построения
  text: >
    POST /reports/runs/{id}/cancel: при requested_by ≠ by — AccessDenied, при статусе не requested — DomainError.
    Запуск переходит в cancelled и публикуется reports.run_cancelled с reason=by_user. У запусков по расписанию
