    lines: 166-182
    hash: d66ea9383399
  tested_by:
  - tests/test_reports_runs.py::test_deactivation_cancels_pending_runs_and_schedules
  - tests/test_reports_definitions.py::test_title_released_after_deactivation
  status: draft
- id: R-REPORTS-DEF-10
  title: После отключения отчёта ожидающие запуски отменяются
  text: >
    Подписчик reports.definition_deactivated отменяет все запуски отчёта в статусе requested (строки,
    заблокированные другой транзакцией, пропускаются: skip_locked) и на каждый публикует reports.run_cancelled
    с reason=definition_deactivated. Запуски в статусе running достраиваются как обычно.
  kind: effect
  applies_to:
  - table:reports.report_runs
  trigger: event:reports.definition_deactivated
  effects:
  - 'writes: table:reports.report_runs'
  - 'publishes: event:reports.run_cancelled'
  roles:
  - system
  related:
  - R-REPORTS-DEF-09
  - R-REPORTS-RUN-04
  - R-REPORTS-NOTIFY-03
  implemented_by:
  - symbol: services/reports/consumers.py::on_definition_deactivated
    lines: 44-45
    hash: 86169d642a36
  - symbol: services/reports/service.py::cancel_pending_for_definition
    lines: 331-342
    hash: 39b6df46cefa
  tested_by:
  - tests/test_reports_runs.py::test_deactivation_cancels_pending_runs_and_schedules
