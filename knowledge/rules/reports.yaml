  - tests/test_reports_runs.py::test_summary_run_is_built_and_requester_notified
  status: draft
- id: R-REPORTS-RUN-04
  title: Запуск отключённого к моменту построения отчёта отменяется
  text: >
    Если на момент построения определение уже отключено, build_run переводит запуск requested → cancelled
    и публикует reports.run_cancelled с reason=definition_deactivated. Это закрывает гонку с cancel_pending_for_definition,
    который пропускает заблокированные строки.
  kind: guard
  applies_to:
  - table:reports.report_runs
  trigger: event:reports.run_requested
  effects:
  - 'publishes: event:reports.run_cancelled'
  roles:
