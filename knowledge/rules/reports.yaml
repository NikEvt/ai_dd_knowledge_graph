    lines: 242-257
    hash: e02debd85373
  - symbol: services/reports/consumers.py::on_run_requested
    lines: 11-12
    hash: 54b1a70731fc
  - symbol: services/reports/service.py::build_run
    lines: 280-291
    hash: 1ea23aa6dab6
  tested_by:
