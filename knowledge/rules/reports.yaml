- id: R-REPORTS-TIMER-02
  title: Завершённые запуски удаляются через 30 дней вместе с уведомлениями
  text: >
    purge_old_runs удаляет запуски в статусах FINISHED с finished_at раньше now − RETENTION_DAYS (30);
    незавершённые запуски остаются. Уведомления удаляются каскадом по внешнему ключу ON DELETE CASCADE.
    Побочные эффекты: аудит запусков теряет историю, а после удаления всех запусков отчёта снова можно
    менять его тип.
  kind: timer
  applies_to:
  - table:reports.report_runs
  - table:reports.run_notifications
  trigger: symbol:services/reports/jobs.py::purge_old_runs
  effects:
  - 'deletes: table:reports.report_runs'
  - 'deletes: table:reports.run_notifications'
  roles:
  - system
  related:
  - R-REPORTS-CALC-05
  - R-REPORTS-DEF-07
  - R-REPORTS-RUN-08
