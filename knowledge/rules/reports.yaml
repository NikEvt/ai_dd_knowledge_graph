- id: R-REPORTS-RUN-07
  title: Допустимые переходы статуса запуска задаёт триггер БД
  text: >
    Статусы запуска — requested, running, completed, failed, cancelled. Триггер trg_report_runs_transition
    разрешает только requested → running/failed/cancelled и running → completed/failed. Код использует
    requested → running/cancelled (build_run, cancel_run, отмена по отключению) и running → completed/failed
    (build_run, fail_stuck_runs). Переход requested → failed БД разрешает, но код его не выполняет.
  kind: invariant
  applies_to:
  - table:reports.report_runs
  trigger: table:reports.report_runs
  related:
  - R-REPORTS-RUN-08
  implemented_by:
  - symbol: services/reports/service.py::build_run
    lines: 289-304
    hash: 1ea23aa6dab6
  - symbol: services/reports/service.py::cancel_run
    lines: 324-326
    hash: a8b6cd2f7124
  enforced_by_db:
