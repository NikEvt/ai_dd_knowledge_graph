- id: R-REPORTS-RUN-03
  title: Отчёт строится асинхронно по событию reports.run_requested, повторная доставка безопасна
  text: >
    request_run создаёт запуск в статусе requested и публикует reports.run_requested (API отвечает 202).
    Подписчик вызывает build_run: он блокирует строку запуска (FOR UPDATE) и ничего не делает, если запуск
    уже не в requested, поэтому повторная доставка события отчёт не перестраивает. Иначе статус меняется
    на running и фиксируется started_at.
  kind: effect
  applies_to:
  - table:reports.report_runs
  trigger: event:reports.run_requested
  effects:
  - 'writes: table:reports.report_runs'
  roles:
  - system
  related:
  - R-REPORTS-RUN-04
  - R-REPORTS-RUN-05
  implemented_by:
