    lines: 57-61
    hash: 76ab07bfecde
  enforced_by_db:
  - constraint: report_definitions_kind
    hash: dfaeb069f79f
  - constraint: report_definitions_params_object
    hash: 04dbbe23d1ac
  config:
  - services/reports/builders.py::KINDS
  - services/reports/builders.py::_ALLOWED
  tested_by:
  - tests/test_reports_definitions.py::test_definition_params_are_validated
  status: draft
- id: R-REPORTS-DEF-05
  title: Сводный отчёт — от 1 до 20 уникальных метрик, динамика — ровно одна метрика
  text: >
    В сводном отчёте metrics — непустой список не длиннее MAX_METRICS_PER_REPORT (20) корректных имён
    метрик; дубли убираются с сохранением порядка. Определение сводки без metrics и динамики без metric
    отклоняется (require_complete) при создании и изменении.
  kind: invariant
  applies_to:
  - report.kind=metric_summary
  - report.kind=metric_trend
  trigger: symbol:services/reports/service.py::create_definition
  related:
  - R-REPORTS-DEF-04
  - R-REPORTS-SNAP-02
  implemented_by:
  - symbol: services/reports/builders.py::normalize_params
    lines: 63-71
    hash: 76ab07bfecde
  - symbol: services/reports/builders.py::require_complete
    lines: 83-87
    hash: ad732d54a6be
  config:
  - services/reports/settings.py::MAX_METRICS_PER_REPORT
  tested_by:
  - tests/test_reports_definitions.py::test_summary_definition_keeps_metrics_unique_and_ordered
  - tests/test_reports_definitions.py::test_definition_params_are_validated
  status: draft
- id: R-REPORTS-DEF-06
  title: Период отчёта — целое число от 1 до 90 дней; разрез до 64 символов; дата в формате ГГГГ-ММ-ДД
  text: >
    Параметр days — целое (не bool) от 1 до MAX_PERIOD_DAYS (90). dimension — строка до 64 символов (литерал
    64 в коде, совпадает с CHECK на metric_snapshots.dimension). as_of — дата ISO, приводится к каноническому
    виду. Проверки одинаково применяются к определению и к параметрам запуска.
  kind: invariant
  applies_to:
  - table:reports.report_definitions
  - table:reports.report_runs
  trigger: symbol:services/reports/builders.py::normalize_params
  related:
  - R-REPORTS-CALC-01
  implemented_by:
  - symbol: services/reports/builders.py::_days
    lines: 42-45
    hash: 74d547ba35d3
  - symbol: services/reports/builders.py::_as_of
    lines: 48-52
    hash: 70d7567fc36a
  - symbol: services/reports/builders.py::normalize_params
    lines: 72-79
    hash: 76ab07bfecde
  config:
  - services/reports/settings.py::MAX_PERIOD_DAYS
  tested_by:
  - tests/test_reports_definitions.py::test_definition_params_are_validated
  status: draft
- id: R-REPORTS-DEF-07
  title: Тип отчёта нельзя менять, если у него уже есть запуски
  text: >
    Триггер БД trg_report_definitions_kind_locked запрещает менять kind, если в report_runs есть хоть
    один запуск этого определения. В update_definition такой проверки нет — смена типа падает ошибкой
    БД. update_definition не выведен в API. После того как purge_old_runs удалит все запуски отчёта, тип
    снова можно менять.
  kind: invariant
  applies_to:
  - table:reports.report_definitions
  trigger: symbol:services/reports/service.py::update_definition
  related:
  - R-REPORTS-TIMER-02
  implemented_by:
