    lines: 114-118
    hash: d91d2fd8823a
  - symbol: services/lectures/consumers.py::on_capacity_increased
    lines: 21-22
    hash: 4027a1856cb7
  tested_by:
  - tests/test_lectures_events.py::test_limit_increase_gives_new_seats_to_waitlist
  status: draft
- id: R-LECTURES-LIMIT-05
  title: Снижение лимита не проверяет регистрации и ручные мероприятия
  text: >
    Когда лимит снижается, мероприятия, которые следуют за лимитом, получают меньше мест без сверки с
    числом подтверждённых регистраций и без отмены лишних, то есть может возникнуть перебор. Мероприятия
    с ручным числом мест, превышающим новый лимит, не меняются и остаются выше лимита: триггер trg_lecture_capacity_limit
    срабатывает только при UPDATE полей capacity и venue_id. В списке будущих мероприятий (upcoming) число
    свободных мест при переборе показывается как 0.
  kind: effect
  applies_to:
  - table:lectures.events
  trigger: event:lectures.venue_limit_changed
  effects:
  - 'writes: table:lectures.events'
  roles:
  - system
  related:
  - R-LECTURES-LIMIT-03
  - R-LECTURES-CAPACITY-01
  - R-LECTURES-EVENT-05
  implemented_by:
  - symbol: services/lectures/service.py::apply_venue_limit
    lines: 101-116
    hash: d91d2fd8823a
  - symbol: services/lectures/service.py::upcoming
    lines: 254-262
    hash: c08aa4545346
  enforced_by_db:
  - constraint: trg_lecture_capacity_limit
    hash: cdabaa4b71b6
  status: draft
- id: R-LECTURES-MOVE-01
  title: Переносят только на другую свободную площадку
  text: >
    move_event отклоняет перенос на ту же площадку («мероприятие уже проходит на этой площадке»), на площадку
    без лимита и на площадку, где в это же время уже запланировано другое мероприятие. Время начала при
    переносе не меняется, срок MIN_LEAD_TIME не проверяется.
  kind: guard
  applies_to:
  - actor=organizer
  trigger: symbol:services/lectures/service.py::move_event
  related:
  - R-LECTURES-EVENT-07
  - R-LECTURES-MANAGE-01
  - R-LECTURES-MOVE-02
  implemented_by:
  - symbol: services/lectures/service.py::move_event
    lines: 203-215
    hash: 4248800ecf7b
  enforced_by_db:
  - constraint: events_venue_slot_uq
    hash: 8e0502c7284e
  tested_by:
  - tests/test_lectures_registrations.py::test_move_to_other_venue_cancels_registrations_and_notifies
  status: draft
- id: R-LECTURES-MOVE-02
  title: Перенос аннулирует все регистрации и лист ожидания
  text: >
    При переносе _drop_audience отменяет все подтверждённые регистрации (cancel_reason = venue_changed,
    на каждую публикуется lectures.registration_cancelled) и переводит записи листа ожидания в cancelled.
    После этого мероприятие получает новую площадку, число мест (указанное или лимит новой площадки) и
    пересчитанный capacity_manual. Публикуется lectures.event_moved со списком слушателей из листа ожидания.
    Освобождённые места листу ожидания не отдаются: venue_changed не входит в SEAT_RELEASING_REASONS,
    и площадка в событии старая.
