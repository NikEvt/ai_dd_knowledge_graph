  status: draft
- id: R-LECTURES-LIMIT-02
  title: Реплика лимита пишется подписчиком lectures.venue_limit_changed
  text: >
    on_venue_limit_changed вызывает apply_venue_limit. Если реплики для площадки нет, она создаётся, и
    мероприятия не трогаются. Если лимит не изменился, ничего не происходит. Иначе обновляются max_capacity
    и updated_at. Строка реплики блокируется FOR UPDATE.
  kind: effect
  applies_to:
  - table:lectures.venue_capacity_limits
  trigger: event:lectures.venue_limit_changed
  effects:
  - 'writes: table:lectures.venue_capacity_limits'
  roles:
  - system
  related:
  - R-LECTURES-LIMIT-01
  - R-LECTURES-LIMIT-03
  implemented_by:
