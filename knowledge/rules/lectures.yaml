- id: R-LECTURES-REMIND-01
  title: Напоминание о мероприятии — один раз за REMINDER_AHEAD до начала
  text: >
    Фоновая задача send_reminders ставит уведомление reminder каждой подтверждённой регистрации на запланированное
    мероприятие, которое начнётся в течение settings.REMINDER_AHEAD (24 часа). Ключ дедупликации reminder:<registration_id>
    гарантирует одно напоминание на регистрацию при любом числе запусков. Регистрация задачи в планировщике
    в репозитории не найдена.
