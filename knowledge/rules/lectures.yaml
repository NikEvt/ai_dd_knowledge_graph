    lines: 89-99
    hash: d91d2fd8823a
  enforced_by_db:
  - constraint: venue_capacity_limits_max_capacity_check
    hash: 3a9484826b99
  tested_by:
  - tests/test_lectures_events.py::test_limit_change_updates_replica_and_untouched_events
  status: draft
- id: R-LECTURES-LIMIT-03
  title: Число мест будущих мероприятий без ручной настройки следует за лимитом
  text: >
    При смене лимита apply_venue_limit приравнивает число мест к новому лимиту только у мероприятий этой
    площадки, которые запланированы (scheduled), ещё не начались, у которых число мест равнялось старому
    лимиту и capacity_manual = false. Прошедшие, отменённые и настроенные вручную мероприятия не меняются,
    даже если их число мест совпадало со старым лимитом.
  kind: effect
  applies_to:
  - table:lectures.events
  trigger: event:lectures.venue_limit_changed
  effects:
  - 'writes: table:lectures.events'
  roles:
  - system
  related:
  - R-LECTURES-EVENT-04
  - R-LECTURES-CAPACITY-02
  - R-LECTURES-LIMIT-05
  implemented_by:
  - symbol: services/lectures/service.py::apply_venue_limit
    lines: 101-116
