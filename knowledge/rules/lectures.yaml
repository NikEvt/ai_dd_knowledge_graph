  trigger: symbol:services/lectures/service.py::change_capacity
  effects:
  - event:lectures.capacity_increased
  - symbol:services/lectures/service.py::fill_from_waitlist
  related:
  - R-LECTURES-WAITLIST-06
  - R-LECTURES-LIMIT-04
  implemented_by:
  - symbol: services/lectures/service.py::change_capacity
    lines: 170-176
    hash: 52954e044aa3
  - symbol: services/lectures/consumers.py::on_capacity_increased
    lines: 21-22
    hash: 4027a1856cb7
  tested_by:
  - tests/test_lectures_registrations.py::test_organizer_adds_seats_for_waitlist
  status: draft
- id: R-LECTURES-LIMIT-01
  title: Лимит мест площадки меняется асинхронно через событие, права не проверяются
  text: >
    PUT /venues/{venue_id}/capacity-limit (set_venue_capacity_limit) только проверяет, что лимит положительный,
    и публикует lectures.venue_limit_changed (ответ 202). Сама реплика пишется подписчиком. Роль вызывающего
    и существование площадки не проверяются.
  kind: effect
  applies_to:
  - table:lectures.venue_capacity_limits
  trigger: symbol:services/lectures/service.py::set_venue_capacity_limit
