# Правила модуля lectures: извлечены LLM (tools/knowledge/bootstrap_rules.sh) из кода и среза графа.
# Статус verified ставит только человек. Хэши обновляет tools/knowledge/drift.py --write.
rules:
- id: R-LECTURES-EVENT-01
  title: Мероприятие объявляют не позднее чем за MIN_LEAD_TIME до начала
  text: >
    create_event отклоняет мероприятие, если до начала осталось меньше settings.MIN_LEAD_TIME (24 часа):
    «мероприятие нужно объявить хотя бы за сутки до начала». При переносе на другую площадку (move_event)
    этот срок не проверяется.
  kind: guard
  applies_to:
  - actor=organizer
  trigger: symbol:services/lectures/service.py::create_event
  related:
  - R-LECTURES-MOVE-01
  implemented_by:
  - symbol: services/lectures/service.py::create_event
    lines: 135-137
    hash: d8a742b3a4d2
  config:
  - services/lectures/settings.py::MIN_LEAD_TIME
  tested_by:
  - tests/test_lectures_events.py::test_event_announced_at_least_a_day_ahead
  discrepancy: >
    В тексте ошибки срок записан литералом («за сутки»), а проверка берёт его из настройки MIN_LEAD_TIME.
    Если настройку поменять, сообщение станет неверным.
  status: draft
- id: R-LECTURES-EVENT-02
  title: Тема мероприятия обязательна
  text: >
    create_event отклоняет пустую тему или тему из одних пробелов («укажите тему мероприятия»), а перед
    сохранением обрезает пробелы по краям. В БД то же самое требует CHECK events_title_check (length(btrim(title))
    > 0).
  kind: invariant
  applies_to:
  - table:lectures.events
  trigger: symbol:services/lectures/service.py::create_event
  implemented_by:
  - symbol: services/lectures/service.py::create_event
    lines: 138-151
    hash: d8a742b3a4d2
  enforced_by_db:
  - constraint: events_title_check
    hash: 5fdd61929d34
  status: draft
- id: R-LECTURES-EVENT-03
  title: Мероприятие возможно только на площадке с заданным лимитом мест
  text: >
    Мероприятие нельзя создать или перенести на площадку без записи в реплике lectures.venue_capacity_limits:
    _venue_limit выдаёт ошибку «для площадки не задан лимит мест». Триггер trg_lecture_capacity_limit
    (функция check_capacity) делает ту же проверку на INSERT и на UPDATE полей capacity и venue_id.
  kind: guard
  applies_to:
  - table:lectures.events
  trigger: symbol:services/lectures/service.py::create_event
  related:
  - R-LECTURES-EVENT-05
  - R-LECTURES-LIMIT-02
  implemented_by:
  - symbol: services/lectures/service.py::_venue_limit
    lines: 37-41
    hash: d9e8c078f8f1
  - symbol: services/lectures/service.py::create_event
    lines: 140-140
    hash: d8a742b3a4d2
  - symbol: services/lectures/service.py::move_event
    lines: 206-206
    hash: 4248800ecf7b
  enforced_by_db:
  - constraint: trg_lecture_capacity_limit
    hash: cdabaa4b71b6
  - constraint: check_capacity
    hash: 6cce64c71dd2
  tested_by:
  - tests/test_lectures_events.py::test_event_on_venue_without_limit_rejected
  status: draft
- id: R-LECTURES-EVENT-04
  title: По умолчанию мест столько, сколько позволяет лимит площадки
  text: >
    Если организатор не указал число мест, create_event берёт лимит площадки. Флаг capacity_manual ставится
    только когда мест меньше лимита. Флаг решает, будет ли число мест следовать за последующими изменениями
    лимита.
  kind: calculation
  applies_to:
  - table:lectures.events
  trigger: symbol:services/lectures/service.py::create_event
  effects:
  - 'writes: table:lectures.events'
  related:
  - R-LECTURES-LIMIT-03
  - R-LECTURES-CAPACITY-02
  implemented_by:
  - symbol: services/lectures/service.py::create_event
    lines: 140-161
    hash: d8a742b3a4d2
  tested_by:
  - tests/test_lectures_events.py::test_event_takes_venue_limit_by_default
  status: draft
- id: R-LECTURES-EVENT-05
  title: Мест на мероприятии не больше лимита площадки — проверяет только БД
  text: >
    Ни create_event, ни change_capacity, ни move_event не сравнивают заданное число мест с лимитом площадки.
    Превышение отклоняет только триггер trg_lecture_capacity_limit («event capacity … exceeds venue …
    limit …»), и клиент получает ошибку БД, а не DomainError. Если перенос отклонён, его транзакция откатывается,
    и регистрации на старой площадке остаются.
  kind: invariant
  applies_to:
  - table:lectures.events
  trigger: table:lectures.events
  related:
  - R-LECTURES-EVENT-03
  - R-LECTURES-LIMIT-05
  enforced_by_db:
  - constraint: trg_lecture_capacity_limit
    hash: cdabaa4b71b6
  - constraint: check_capacity
    hash: 6cce64c71dd2
  tested_by:
  - tests/test_lectures_events.py::test_capacity_above_venue_limit_rejected_by_db
  - tests/test_lectures_registrations.py::test_move_capacity_above_new_limit_rejected
  status: draft
- id: R-LECTURES-EVENT-06
  title: Число мест и лимит площадки положительны
  text: >
    Число мест мероприятия и лимит площадки должны быть больше нуля. API проверяет это через Field(gt=0)
    в EventIn, CapacityIn, MoveIn и VenueLimitIn. set_venue_capacity_limit отклоняет лимит <= 0. В БД
    это обеспечивают CHECK events_capacity_check и venue_capacity_limits_max_capacity_check.
  kind: invariant
  applies_to:
  - table:lectures.events
  - table:lectures.venue_capacity_limits
  trigger: table:lectures.events
  related:
  - R-LECTURES-LIMIT-01
  implemented_by:
  - symbol: services/lectures/api.py::EventIn
    lines: 24-24
    hash: 118346399c93
  - symbol: services/lectures/api.py::CapacityIn
    lines: 38-38
    hash: 4e3f5537a79f
  - symbol: services/lectures/api.py::MoveIn
    lines: 44-44
    hash: 9a9a21a8a12b
  - symbol: services/lectures/api.py::VenueLimitIn
    lines: 16-16
    hash: eb3d1b7b5ce2
  - symbol: services/lectures/service.py::set_venue_capacity_limit
    lines: 76-77
    hash: 13eaca043a78
  enforced_by_db:
  - constraint: events_capacity_check
    hash: f197e4338295
  - constraint: venue_capacity_limits_max_capacity_check
    hash: 3a9484826b99
  status: draft
- id: R-LECTURES-EVENT-07
  title: Площадка не принимает два мероприятия с одним временем начала
  text: >
    create_event и move_event отклоняют мероприятие, если на площадке уже есть запланированное (scheduled)
    мероприятие с тем же starts_at. Сравнивается только точное время начала: мероприятия с перекрывающимися
    интервалами допускаются, потому что длительность не хранится. В БД то же правило задаёт частичный
    уникальный индекс events_venue_slot_uq (venue_id, starts_at) WHERE status = 'scheduled'.
  kind: guard
  applies_to:
  - table:lectures.events
  trigger: symbol:services/lectures/service.py::create_event
  related:
  - R-LECTURES-MOVE-01
  implemented_by:
  - symbol: services/lectures/service.py::create_event
    lines: 143-149
    hash: d8a742b3a4d2
  - symbol: services/lectures/service.py::move_event
    lines: 207-215
    hash: 4248800ecf7b
  enforced_by_db:
  - constraint: events_venue_slot_uq
    hash: 8e0502c7284e
  tested_by:
  - tests/test_lectures_events.py::test_venue_cannot_host_two_events_at_once
  status: draft
- id: R-LECTURES-EVENT-08
  title: Жизненный цикл мероприятия — scheduled, cancelled, finished
  text: >
    Мероприятие создаётся в статусе scheduled. Отмена организатором (cancel_event) переводит его в cancelled,
    фоновая задача finish_past_events — в finished. Других статусов нет: это закреплено CHECK events_status_check.
    Триггер trg_lecture_touch (touch_updated_at) обновляет updated_at при любом UPDATE, если код не задал
    его сам.
  kind: invariant
  applies_to:
  - table:lectures.events
  trigger: table:lectures.events
  related:
  - R-LECTURES-CANCEL-01
  - R-LECTURES-FINISH-01
  implemented_by:
  - symbol: services/lectures/service.py::cancel_event
    lines: 240-241
    hash: 544dd002b9fc
  - symbol: services/lectures/jobs.py::finish_past_events
    lines: 70-72
    hash: 2adda58dcb25
  enforced_by_db:
  - constraint: events_status_check
    hash: 4d5c03c2bbce
  - constraint: trg_lecture_touch
    hash: 50817d95b70e
  - constraint: touch_updated_at
    hash: 4678aa517c6b
  tested_by:
  - tests/test_lectures_registrations.py::test_cancel_event_notifies_registered_and_waitlisted
  - tests/test_lectures_jobs.py::test_past_events_finished
  status: draft
- id: R-LECTURES-MANAGE-01
  title: Мероприятием управляет только организатор и только пока оно запланировано
  text: >
    Изменить число мест, перенести, отменить мероприятие или снять слушателя может только организатор
    этого мероприятия. Для остальных _own_lecture выдаёт AccessDenied «мероприятием управляет только его
    организатор». Если мероприятие не в статусе scheduled, возвращается DomainError «мероприятие уже отменено
    или прошло». Время начала не проверяется: мероприятие, которое уже началось, но ещё не стало finished
    (FINISH_AFTER), можно отменить, перенести или изменить. organizer_id приходит в теле запроса, аутентификации
    нет.
  kind: permission
  applies_to:
  - actor=organizer
  trigger: symbol:services/lectures/service.py::_own_lecture
  related:
  - R-LECTURES-CANCEL-REG-02
  implemented_by:
  - symbol: services/lectures/service.py::_own_lecture
    lines: 28-34
    hash: 52d57370768a
  tested_by:
  - tests/test_lectures_events.py::test_only_organizer_changes_capacity
  - tests/test_lectures_registrations.py::test_only_listener_cancels_own_registration
  status: draft
- id: R-LECTURES-CAPACITY-01
  title: Нельзя сократить места ниже числа подтверждённых регистраций
  text: >
    change_capacity отклоняет новое число мест, если оно меньше числа регистраций в статусе confirmed:
    «на мероприятие уже зарегистрировано больше слушателей».
  kind: guard
  applies_to:
  - actor=organizer
  trigger: symbol:services/lectures/service.py::change_capacity
  related:
  - R-LECTURES-LIMIT-05
  implemented_by:
  - symbol: services/lectures/service.py::change_capacity
    lines: 167-168
    hash: 52954e044aa3
  tested_by:
  - tests/test_lectures_events.py::test_capacity_cannot_drop_below_registered
  status: draft
- id: R-LECTURES-CAPACITY-02
  title: Число мест, равное лимиту, снова следует за лимитом площадки
  text: >
    При изменении числа мест флаг capacity_manual пересчитывается как «мест меньше текущего лимита». Если
    организатор вернул число мест к лимиту, флаг снимается, и мероприятие снова подтягивается к будущим
    изменениям лимита (R-LECTURES-LIMIT-03).
  kind: calculation
  applies_to:
  - actor=organizer
  trigger: symbol:services/lectures/service.py::change_capacity
  effects:
  - 'writes: table:lectures.events'
  related:
  - R-LECTURES-EVENT-04
  - R-LECTURES-LIMIT-03
  implemented_by:
  - symbol: services/lectures/service.py::change_capacity
    lines: 169-174
    hash: 52954e044aa3
  tested_by:
  - tests/test_lectures_events.py::test_restoring_full_capacity_follows_limit_again
  - tests/test_lectures_events.py::test_manual_capacity_kept_even_when_it_matches_old_limit
  - tests/test_lectures_events.py::test_capacity_cannot_drop_below_registered
  status: draft
- id: R-LECTURES-CAPACITY-03
  title: Новые места отдаются листу ожидания
  text: >
    Если change_capacity увеличил число мест, публикуется lectures.capacity_increased. Подписчик on_capacity_increased
    вызывает fill_from_waitlist, и свободные места получают первые в листе ожидания.
  kind: effect
  applies_to:
