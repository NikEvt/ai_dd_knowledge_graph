- id: R-LECTURES-LIMIT-04
  title: Рост лимита площадки отдаёт новые места листу ожидания
  text: >
    Если новый лимит больше старого, apply_venue_limit публикует lectures.capacity_increased для каждого
    мероприятия, где число мест подтянулось к лимиту. Подписчик on_capacity_increased продвигает слушателей
    из листа ожидания.
  kind: effect
  applies_to:
  - table:lectures.events
  trigger: event:lectures.venue_limit_changed
  effects:
  - event:lectures.capacity_increased
  - symbol:services/lectures/service.py::fill_from_waitlist
  roles:
  - system
  related:
