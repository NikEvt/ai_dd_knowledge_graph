# Правила модуля partners: извлечены LLM (tools/knowledge/bootstrap_rules.sh) из кода и среза графа.
# Статус verified ставит только человек. Хэши обновляет tools/knowledge/drift.py --write.
rules:
- id: R-PARTNERS-REQUEST-01
  title: Заявку на подключение принимают только с корректным ИНН
  text: >
    Заявка на подключение агентства отклоняется с ошибкой «некорректный ИНН», если ИНН не состоит из 10
    цифр или не сходится контрольная цифра (веса _INN_WEIGHTS, сумма mod 11 mod 10). В БД формат ИНН дополнительно
    ограничен CHECK на 10 цифр (контрольную сумму БД не проверяет).
  kind: guard
  applies_to:
  - partners.onboarding_request
  trigger: symbol:services/partners/service.py::submit_request
  related:
  - R-PARTNERS-REQUEST-02
  implemented_by:
  - symbol: services/partners/service.py::inn_valid
    lines: 30-35
    hash: 1ab8f79d39b5
  - symbol: services/partners/service.py::submit_request
    lines: 86-87
    hash: 3d6b55420bff
  enforced_by_db:
  - constraint: onboarding_requests_inn_check
    hash: 28a050e76626
  - constraint: partners_inn_check
    hash: 28a050e76626
  config:
  - services/partners/service.py::_INN_WEIGHTS
  tested_by:
  - tests/test_partners_onboarding.py::test_request_with_bad_inn_is_refused
  status: draft
- id: R-PARTNERS-REQUEST-02
  title: КПП, если указан, должен состоять из 9 цифр
  text: >
    При подаче заявки и при правке реквизитов партнёра непустой КПП проверяется на 9 цифр (ошибка «КПП
    должен состоять из 9 цифр»). Пустой КПП (None) допускается. Это же ограничение продублировано CHECK
    в таблицах заявок и партнёров.
  kind: guard
  applies_to:
  - partners.onboarding_request
  - partners.partner
  trigger: symbol:services/partners/service.py::_check_kpp
  related:
  - R-PARTNERS-REQUEST-01
  - R-PARTNERS-REQUISITES-01
  implemented_by:
  - symbol: services/partners/service.py::_check_kpp
    lines: 38-40
    hash: 52df41829684
  - symbol: services/partners/service.py::submit_request
    lines: 88-88
    hash: 3d6b55420bff
  - symbol: services/partners/service.py::update_requisites
    lines: 223-224
    hash: 1f0390f17f89
  enforced_by_db:
  - constraint: onboarding_requests_kpp_check
    hash: 491f4e384657
  - constraint: partners_kpp_check
    hash: 491f4e384657
  status: draft
- id: R-PARTNERS-REQUEST-03
  title: Подключённый партнёр не может подать новую заявку
  text: >
    Заявка отклоняется с ошибкой «партнёр с таким ИНН уже подключён», если у партнёра с этим ИНН есть
    договор в статусе active или suspended. Договор в статусе draft подачу не блокирует.
  kind: guard
  applies_to:
  - partners.onboarding_request
  trigger: symbol:services/partners/service.py::submit_request
  related:
  - R-PARTNERS-REQUEST-04
  implemented_by:
  - symbol: services/partners/service.py::submit_request
    lines: 89-95
    hash: 3d6b55420bff
  tested_by:
  - tests/test_partners_onboarding.py::test_connected_partner_cannot_apply_again
  status: draft
- id: R-PARTNERS-REQUEST-04
  title: Новая заявка с тем же ИНН закрывает открытые как дубли
  text: >
    При подаче заявки все открытые заявки с тем же ИНН переводятся в статус duplicate (decided_at = текущее
    время) с публикацией partners.request_closed_duplicate на каждую; затем создаётся новая открытая заявка.
    Подписчиков у события нет.
  kind: effect
  applies_to:
  - partners.onboarding_request
  trigger: symbol:services/partners/service.py::submit_request
  effects:
  - table:partners.onboarding_requests
  - event:partners.request_closed_duplicate
  - event:partners.request_submitted
  related:
  - R-PARTNERS-REQUEST-05
  implemented_by:
  - symbol: services/partners/service.py::submit_request
    lines: 97-110
    hash: 3d6b55420bff
  - symbol: services/partners/service.py::close_duplicates
    lines: 57-73
    hash: d9f8153951e8
  tested_by:
  - tests/test_partners_onboarding.py::test_new_request_supersedes_open_one
  - tests/test_partners_onboarding.py::test_close_duplicates_keeps_given_request
  status: draft
- id: R-PARTNERS-REQUEST-05
  title: В БД не больше одной открытой заявки на ИНН
  text: >
    Частичный уникальный индекс запрещает две заявки со статусом open и одинаковым ИНН. Код соблюдает
    его, закрывая открытые заявки как дубли перед вставкой новой.
  kind: invariant
  applies_to:
  - partners.onboarding_request
  trigger: table:partners.onboarding_requests
  related:
  - R-PARTNERS-REQUEST-04
  implemented_by:
  - symbol: services/partners/service.py::close_duplicates
    lines: 59-66
    hash: d9f8153951e8
  enforced_by_db:
  - constraint: ux_onboarding_requests_open_inn
    hash: ba8202cc1556
  tested_by:
  - tests/test_partners_onboarding.py::test_only_one_open_request_per_inn_in_database
  status: draft
- id: R-PARTNERS-REQUEST-06
  title: Решение по заявке принимается один раз
  text: >
    Одобрить или отклонить можно только заявку в статусе open, иначе ошибка «по заявке уже принято решение».
    При решении фиксируются decided_at и decided_by (manager_id). CHECK в БД требует decided_at у любой
    не открытой заявки.
  kind: guard
  applies_to:
  - partners.onboarding_request
  trigger: symbol:services/partners/service.py::_decide
  effects:
  - table:partners.onboarding_requests
  related:
  - R-PARTNERS-REQUEST-07
  - R-PARTNERS-ONBOARD-01
  implemented_by:
  - symbol: services/partners/service.py::_decide
    lines: 114-120
    hash: bdc5226a4c0e
  enforced_by_db:
  - constraint: onboarding_requests_check1
    hash: dcfe8ac70fa3
  tested_by:
  - tests/test_partners_onboarding.py::test_request_decided_only_once
  status: draft
- id: R-PARTNERS-REQUEST-07
  title: Отказ по заявке требует причины
  text: >
    Отклонение заявки без непустой причины запрещено («укажите причину отказа»); причина сохраняется в
    reject_reason, публикуется partners.request_rejected (подписчиков нет). CHECK в БД требует reject_reason
    у отклонённой заявки.
  kind: guard
  applies_to:
  - partners.onboarding_request
  trigger: symbol:services/partners/service.py::reject_request
  effects:
  - event:partners.request_rejected
  related:
  - R-PARTNERS-REQUEST-06
  implemented_by:
  - symbol: services/partners/service.py::reject_request
    lines: 133-138
    hash: 9968fb274b00
  enforced_by_db:
  - constraint: onboarding_requests_check
    hash: 534bbbc7b346
  tested_by:
  - tests/test_partners_onboarding.py::test_request_decided_only_once
  status: draft
- id: R-PARTNERS-REQUEST-08
  title: Заявка без решения истекает через ONBOARDING_REQUEST_TTL_DAYS
  text: >
    Фоновая задача переводит открытые заявки, поданные раньше чем ONBOARDING_REQUEST_TTL_DAYS (30) дней
    назад (от submitted_at), в статус expired и проставляет decided_at. Событие при этом не публикуется.
  kind: timer
  applies_to:
  - partners.onboarding_request
  trigger: symbol:services/partners/jobs.py::expire_requests
  effects:
  - table:partners.onboarding_requests
  roles:
  - system
  implemented_by:
  - symbol: services/partners/jobs.py::expire_requests
    lines: 46-58
    hash: c72a4c1d7b19
  config:
  - services/partners/settings.py::ONBOARDING_REQUEST_TTL_DAYS
  tested_by:
  - tests/test_partners_jobs.py::test_stale_requests_expire
  status: draft
- id: R-PARTNERS-ONBOARD-01
  title: Одобрение заявки заводит партнёра и черновик договора
  text: >
    Подписчик на partners.request_approved заводит партнёра по ИНН заявки (или дополняет существующего
    непустыми полями заявки) и, если у партнёра нет текущего договора (draft/active/suspended), создаёт
    черновик со ставкой DEFAULT_COMMISSION_PCT и сроком CONTRACT_TERM_DAYS от сегодняшней даты. Менеджером
    нового партнёра становится одобривший заявку; у существующего партнёра менеджер не меняется. Публикуется
    partners.partner_onboarded.
  kind: effect
  applies_to:
  - partners.partner
  - partners.contract
  trigger: event:partners.request_approved
  effects:
  - table:partners.partners
  - table:partners.contracts
  - event:partners.partner_onboarded
  roles:
  - system
  related:
  - R-PARTNERS-REQUEST-06
  - R-PARTNERS-ONBOARD-02
  - R-PARTNERS-CONTRACT-01
  implemented_by:
  - symbol: services/partners/consumers.py::on_request_approved
    lines: 10-11
    hash: b1b9ef93d249
  - symbol: services/partners/service.py::approve_request
    lines: 123-127
    hash: b6196f97450d
  - symbol: services/partners/service.py::onboard
    lines: 147-182
    hash: 613cd2c894ca
  enforced_by_db:
  - constraint: partners_inn_key
    hash: 608dc5b53607
  config:
  - services/partners/settings.py::DEFAULT_COMMISSION_PCT
  - services/partners/settings.py::CONTRACT_TERM_DAYS
  - services/partners/service.py::CURRENT_CONTRACT
  tested_by:
  - tests/test_partners_onboarding.py::test_approved_request_creates_partner_with_draft_contract
  status: draft
- id: R-PARTNERS-ONBOARD-02
  title: Заявка связывается с партнёром после онбординга
  text: >
    Подписчик на partners.partner_onboarded записывает partner_id в заявку на подключение. Связь заявки
    с партнёром устанавливается только этим асинхронным шагом.
  kind: effect
  applies_to:
  - partners.onboarding_request
  trigger: event:partners.partner_onboarded
