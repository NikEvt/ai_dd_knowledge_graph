    lines: 219-232
    hash: 1f0390f17f89
  - symbol: services/partners/api.py::update_requisites
    lines: 114-117
    hash: 3c669105fe52
  enforced_by_db:
  - constraint: partners_contact_email_check
    hash: 4b3f1294a88c
  - constraint: partners_legal_name_check
    hash: 9ad69359d67d
  config:
  - services/partners/service.py::EDITABLE_FIELDS
  status: draft
- id: R-PARTNERS-REQUISITES-02
  title: Нельзя очистить обязательные реквизиты при действующем договоре
  text: >
    Если у партнёра есть текущий договор не в статусе draft (active/suspended), очистка любого из REQUIRED_PARTNER_FIELDS
    (inn, kpp, legal_name) запрещена: «нельзя удалить обязательные реквизиты партнёра с действующим договором».
    При черновике договора очищать можно.
  kind: guard
  applies_to:
  - partners.partner
  trigger: symbol:services/partners/service.py::update_requisites
  related:
  - R-PARTNERS-CONTRACT-02
  implemented_by:
  - symbol: services/partners/service.py::update_requisites
    lines: 225-229
    hash: 1f0390f17f89
  config:
  - services/partners/settings.py::REQUIRED_PARTNER_FIELDS
  tested_by:
  - tests/test_partners_contracts.py::test_required_requisites_cannot_be_cleared_on_active_contract
  status: draft
- id: R-PARTNERS-CONTRACT-01
  title: У партнёра не больше одного текущего договора
  text: >
    Текущими считаются договоры в статусах draft, active, suspended (CURRENT_CONTRACT). Частичный уникальный
    индекс в БД запрещает второй такой договор у партнёра; код перед созданием проверяет наличие текущего
    договора.
  kind: invariant
  applies_to:
  - partners.contract
  trigger: table:partners.contracts
  related:
  - R-PARTNERS-ONBOARD-01
  - R-PARTNERS-CONTRACT-09
  implemented_by:
  - symbol: services/partners/service.py::current_contract
    lines: 210-213
    hash: b6246af1888f
  enforced_by_db:
  - constraint: ux_contracts_partner_current
    hash: 92c64fca9370
  - constraint: contracts_status_check
    hash: b22e6ae2ec9a
  config:
  - services/partners/service.py::CURRENT_CONTRACT
  status: draft
- id: R-PARTNERS-CONTRACT-02
  title: Договор активируется только из черновика при заполненных реквизитах и в сроке
  text: >
    Активировать можно только договор в статусе draft; у партнёра должны быть заполнены ИНН, КПП и наименование
    (REQUIRED_PARTNER_FIELDS, в ошибке — названия из REQUISITE_TITLES); дата окончания договора не должна
    быть в прошлом. Триггер БД при переходе draft→active повторно проверяет реквизиты партнёра. Публикуется
    partners.contract_activated (подписчиков нет).
  kind: guard
  applies_to:
  - partners.contract
  trigger: symbol:services/partners/service.py::activate_contract
  effects:
  - table:partners.contracts
  - event:partners.contract_activated
  related:
  - R-PARTNERS-REQUISITES-02
  implemented_by:
  - symbol: services/partners/service.py::activate_contract
    lines: 239-256
    hash: 015f1dcdf14d
  - symbol: services/partners/service.py::missing_requisites
    lines: 43-44
    hash: 9295b957998f
  enforced_by_db:
  - constraint: trg_contract_requisites
    hash: dbc1b3bc018c
  - constraint: check_partner_requisites
    hash: d57cbbd089d3
  config:
