  - services/partners/settings.py::REQUISITE_TITLES
  tested_by:
  - tests/test_partners_contracts.py::test_contract_not_activated_without_requisites
  status: draft
- id: R-PARTNERS-CONTRACT-03
  title: Ставка комиссии от 0 до MAX_COMMISSION_PCT, только на текущем договоре
  text: >
    Менеджер меняет ставку комиссии только на договоре в статусе draft/active/suspended («договор закрыт»
    иначе); ставка должна быть в пределах 0..MAX_COMMISSION_PCT (30%). В БД — CHECK 0..100. Публикуется
    partners.contract_rate_changed (подписчиков нет), изменение пишется в историю триггером.
  kind: guard
  applies_to:
  - partners.contract
  trigger: symbol:services/partners/service.py::change_commission_rate
  effects:
  - event:partners.contract_rate_changed
  related:
  - R-PARTNERS-CONTRACT-07
  - R-PARTNERS-COMMISSION-02
  implemented_by:
