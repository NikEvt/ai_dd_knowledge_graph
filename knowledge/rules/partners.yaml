  - services/partners/service.py::CURRENT_CONTRACT
  tested_by:
  - tests/test_partners_contracts.py::test_commission_rate_bounds
  status: draft
- id: R-PARTNERS-CONTRACT-04
  title: Кредитный лимит от 0 до MAX_CREDIT_LIMIT; без кредита лимит обнуляется
  text: >
    Кредитные условия меняются только на текущем договоре; отрицательный лимит и лимит выше MAX_CREDIT_LIMIT
    (500 000, «без согласования») запрещены. При запрете кредита лимит принудительно ставится 0 (CHECK
    в БД требует credit_limit = 0 без credit_allowed). Лимит не сверяется с текущей задолженностью; событие
    не публикуется, изменение попадает в историю триггером.
  kind: guard
  applies_to:
  - partners.contract
  trigger: symbol:services/partners/service.py::set_credit_terms
  effects:
  - table:partners.contracts
  related:
  - R-PARTNERS-CREDIT-02
  - R-PARTNERS-CONTRACT-07
  implemented_by:
  - symbol: services/partners/service.py::set_credit_terms
    lines: 284-294
    hash: b5979098bf95
  enforced_by_db:
  - constraint: contracts_check1
    hash: a0dfcae0cf88
  - constraint: contracts_credit_limit_check
    hash: 745020bae012
  config:
  - services/partners/settings.py::MAX_CREDIT_LIMIT
  - services/partners/service.py::CURRENT_CONTRACT
  tested_by:
  - tests/test_partners_api.py::test_contract_terms_through_api
  status: draft
- id: R-PARTNERS-CONTRACT-05
  title: Договор с истёкшим сроком переводится в expired
  text: >
    Фоновая задача переводит договоры active/suspended с valid_to раньше сегодняшней даты в статус expired,
    сбрасывает причину приостановки и отменяет сделки в ожидании предоплаты; открытые и неоплаченные кредитные
    сделки не трогаются. Публикуется partners.contract_expired (подписчиков нет). Черновики с истёкшим
    сроком не истекают.
  kind: timer
  applies_to:
  - partners.contract
  trigger: symbol:services/partners/jobs.py::expire_contracts
  effects:
  - table:partners.contracts
  - table:partners.deals
  - event:partners.contract_expired
  roles:
  - system
  related:
  - R-PARTNERS-ONBOARD-01
  implemented_by:
  - symbol: services/partners/jobs.py::expire_contracts
    lines: 33-43
    hash: 476c3433c893
  - symbol: services/partners/service.py::expire_contract
    lines: 541-549
    hash: fde5da890a83
  enforced_by_db:
  - constraint: contracts_check
    hash: 14836ddca622
  config:
