    hash: 69e8a44edc27
  - symbol: services/partners/service.py::link_request
    lines: 185-187
    hash: 8551b6374237
  status: draft
- id: R-PARTNERS-ONBOARD-03
  title: Номер договора формируется по ИНН, id партнёра и порядковому номеру
  text: >
    Номер договора имеет вид «АГ-<последние 4 цифры ИНН>/<id партнёра>-<номер>», где номер — количество
    договоров партнёра + 1. Номер уникален в БД.
  kind: calculation
  applies_to:
  - partners.contract
  trigger: symbol:services/partners/service.py::_next_contract_number
  roles:
  - system
  related:
  - R-PARTNERS-ONBOARD-01
  - R-PARTNERS-CONTRACT-09
  implemented_by:
  - symbol: services/partners/service.py::_next_contract_number
    lines: 142-144
    hash: 270204d401fe
  enforced_by_db:
  - constraint: contracts_number_key
    hash: 22af0225753f
  status: draft
- id: R-PARTNERS-ACCESS-01
  title: Партнёром и его договорами управляет только закреплённый менеджер
  text: >
    Правка реквизитов, активация, ставка, кредитные условия, расторжение, перезаключение договора и действия
    со сделками (открытие, предоплата, закрытие, отмена) доступны только менеджеру, за которым закреплён
    партнёр (partner.manager_id); иначе AccessDenied «партнёр закреплён за другим менеджером». Регистрация
    оплаты сделки в кредит и чтение договора, истории, комиссий и ведомостей проверки менеджера не имеют.
  kind: permission
  applies_to:
  - partners.partner
  - partners.contract
  - partners.deal
  trigger: symbol:services/partners/service.py::_partner_for_manager
  related:
  - R-PARTNERS-DEAL-06
  implemented_by:
  - symbol: services/partners/service.py::_partner_for_manager
    lines: 193-199
    hash: f7106f8d1f5b
  - symbol: services/partners/service.py::_contract_for_manager
    lines: 202-207
    hash: 81092f217bbf
  - symbol: services/partners/service.py::_deal_for_manager
    lines: 387-392
    hash: 216a5f826a23
  tested_by:
  - tests/test_partners_contracts.py::test_contract_managed_only_by_partner_manager
  status: draft
- id: R-PARTNERS-REQUISITES-01
  title: Менеджер правит только разрешённые реквизиты партнёра
  text: >
    Через правку реквизитов можно изменить только kpp, legal_name, contact_name, contact_email, contact_phone
    (EDITABLE_FIELDS); ИНН и прочие поля — ошибка «нельзя изменить поля: …». Ответ API возвращает список
    незаполненных обязательных реквизитов.
  kind: guard
  applies_to:
  - partners.partner
  trigger: symbol:services/partners/service.py::update_requisites
  effects:
  - table:partners.partners
  related:
  - R-PARTNERS-REQUISITES-02
  - R-PARTNERS-ACCESS-01
  implemented_by:
