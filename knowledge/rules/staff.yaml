    lines: 564-571
    hash: c32e3c599350
  tested_by:
  - tests/test_staff_employees.py::test_dismissal_closes_card_and_releases_everything
  status: draft
- id: R-STAFF-TRANSFER-01
  title: Сотрудник одновременно закреплён только за одной площадкой
  text: >
    `transfer_employee` закрепляет сотрудника за площадкой. Если он уже работал на другой, старое закрепление
    закрывается (ended_at) и открывается новое. Уволенного закрепить нельзя, повторно закрепить за той
    же площадкой тоже нельзя (DomainError). Событие staff.employee_transferred публикуется, только если
    было предыдущее закрепление. Индекс assignments_current_uq допускает одно открытое закрепление на
    сотрудника.
  kind: invariant
  applies_to:
  - table:staff.assignments
  trigger: symbol:services/staff/service.py::transfer_employee
  effects:
  - 'writes: table:staff.assignments'
  - event:staff.employee_transferred
  related:
  - R-STAFF-TRANSFER-02
  - R-STAFF-SITE-RESP-03
  implemented_by:
  - symbol: services/staff/service.py::transfer_employee
    lines: 201-221
    hash: d0cf8e4e4f6c
  - symbol: services/staff/service.py::_close_assignment
    lines: 183-194
    hash: cf883d87d633
  enforced_by_db:
  - constraint: assignments_current_uq
