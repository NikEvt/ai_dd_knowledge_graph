- id: R-STAFF-DISMISS-02
  title: Уволенного снимают со всех будущих смен и отзывают все его допуски
  text: >
    Подписчик staff.employee_dismissed снимает сотрудника со всех запланированных смен, которые ещё не
    начались (причина dismissed), и отзывает все действующие допуски с той же причиной. Начавшиеся смены
    не затрагиваются. Каждое снятие публикует staff.shift_member_removed, что запускает проверку укомплектованности.
  kind: effect
  applies_to:
