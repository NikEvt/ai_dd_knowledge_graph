- id: R-STAFF-CLEARANCE-04
  title: Отдел кадров вручную отзывает только действующий допуск
  text: >
    `revoke_clearance` (только отдел кадров) отзывает допуск со статусом active. Для уже недействующего
    выдаётся DomainError «допуск уже не действует». Отзыв ставит status revoked, revoked_at и причину,
    затем публикует staff.clearance_revoked. CHECK clearances_revoked_check требует revoked_at у отозванного
    допуска. Для этой операции нет HTTP-маршрута и тестов.
  kind: guard
