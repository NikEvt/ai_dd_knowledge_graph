- id: R-STAFF-CLEARANCE-05
  title: Фоновая задача переводит допуски с наступившим сроком в expired
  text: >
    `expire_clearances(now)` переводит все активные допуски с expires_at <= now в статус expired и для
    каждого публикует staff.clearance_expired. Расписание запуска в модуле не задано. До запуска задачи
    истёкший допуск формально считается действующим, в том числе при назначении на смену.
  kind: timer
  applies_to:
