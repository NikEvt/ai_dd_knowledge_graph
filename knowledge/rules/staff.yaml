  text: >
    `grant_clearance` (только отдел кадров) требует, чтобы сотрудник не был уволен и имел заполненные
    REQUIRED_EMPLOYEE_FIELDS, а вид допуска существовал. Если у сотрудника уже есть активный допуск этого
    вида, выдаётся DomainError «уже есть действующий допуск». БД дублирует запрет частичным индексом clearances_active_uq.
  kind: guard
