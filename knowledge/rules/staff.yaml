- id: R-STAFF-CLEARANCE-06
  title: Потеря допуска снимает сотрудника с будущих смен, требующих этого допуска
  text: >
    Подписчик staff.clearance_revoked и staff.clearance_expired снимает сотрудника со всех запланированных
    и ещё не начавшихся смен, у которых required_clearance совпадает с видом потерянного допуска (причина
    clearance_lost). Остальные смены, в том числе уже начавшиеся, не затрагиваются. Снятие может вызвать
    пометку недоукомплектованности и уведомление ответственному.
  kind: effect
  applies_to:
  - table:staff.shift_members
  trigger: event:staff.clearance_revoked
