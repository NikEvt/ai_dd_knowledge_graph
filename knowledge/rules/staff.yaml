- id: R-STAFF-BRIEFING-01
  title: Инструктаж проводит ответственный площадки другому сотруднику этой площадки
  text: >
    `hold_briefing` проводит только ответственный площадки, и только для другого сотрудника (CHECK briefings_instructor_check
    дублирует запрет на инструктаж самому себе), закреплённого за этой площадкой. Временем инструктажа
    становится текущий момент. Уникальный ключ briefings_once_key запрещает дубль (сотрудник, тема, время).
  kind: guard
