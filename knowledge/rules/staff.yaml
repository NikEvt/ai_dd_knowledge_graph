  title: Срок допуска — valid_days его вида от момента выдачи
  text: >
    expires_at = момент выдачи + clearance_kinds.valid_days. CHECK clearance_kinds_valid_days_check ограничивает
    valid_days от 1 до 1095, CHECK clearances_period_check требует expires_at > granted_at. После выдачи
    публикуется staff.clearance_granted, на которое никто не подписан.
