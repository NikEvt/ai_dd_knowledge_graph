# Правила модуля staff: извлечены LLM (tools/knowledge/bootstrap_rules.sh) из кода и среза графа.
# Статус verified ставит только человек. Хэши обновляет tools/knowledge/drift.py --write.
rules:
- id: R-STAFF-HR-01
  title: Кадровые операции выполняет только действующий сотрудник отдела кадров
  text: >
    Приём, изменение карточки, увольнение, закрепление сотрудника за площадкой, назначение ответственного,
    создание площадки, изменение максимума смены, выдача и ручной отзыв допуска проверяют автора через
    `_require_hr`. Автор должен существовать, не быть уволенным и иметь должность из HR_ROLES (["hr"]).
    Иначе AccessDenied «кадровые операции выполняет только отдел кадров», через API это HTTP 403.
  kind: permission
  applies_to:
  - employee.role=hr
  trigger: symbol:services/staff/service.py::_require_hr
  related:
  - R-STAFF-SITE-RESP-01
  implemented_by:
  - symbol: services/staff/service.py::_require_hr
    lines: 51-55
    hash: def094d25666
  - symbol: services/staff/service.py::hire_employee
    lines: 108-108
    hash: 4686d2f1a764
  - symbol: services/staff/service.py::dismiss_employee
    lines: 141-141
    hash: 452dfb5d0ed9
  - symbol: services/staff/service.py::grant_clearance
    lines: 497-497
    hash: 2a3805e47403
  config:
  - services/staff/settings.py::HR_ROLES
  tested_by:
  - tests/test_staff_employees.py::test_only_hr_hires
  - tests/test_staff_events.py::test_api_errors_map_to_statuses
  status: draft
- id: R-STAFF-SITE-RESP-01
  title: Сменами и инструктажами площадки управляет только её ответственный
  text: >
    Создать, отменить смену, поставить или снять сотрудника со смены и провести инструктаж может только
    сотрудник, указанный как ответственный площадки (`sites.responsible_id`). Иначе AccessDenied «сменами
    площадки управляет только ответственный за площадку». У площадки без ответственного эти операции недоступны
    никому. Должность и активность ответственного при этом заново не проверяются.
  kind: permission
  applies_to:
  - table:staff.sites
  trigger: symbol:services/staff/service.py::_require_responsible
  related:
  - R-STAFF-SITE-RESP-02
  - R-STAFF-SITE-RESP-03
  implemented_by:
  - symbol: services/staff/service.py::_require_responsible
    lines: 58-62
    hash: 25cd53de7590
  - symbol: services/staff/service.py::create_shift
    lines: 252-252
    hash: 0eb7faa19eee
  - symbol: services/staff/service.py::assign_to_shift
    lines: 328-328
    hash: b93fbb9e3c37
  - symbol: services/staff/service.py::remove_from_shift
    lines: 377-377
    hash: b9aaafece233
  - symbol: services/staff/service.py::cancel_shift
    lines: 392-392
    hash: 75bd07ba1938
  - symbol: services/staff/service.py::hold_briefing
    lines: 469-469
    hash: d9f1cd595a56
  tested_by:
  - tests/test_staff_shifts.py::test_only_site_responsible_plans_shifts
  - tests/test_staff_events.py::test_transferred_responsible_leaves_site_without_one
  status: draft
- id: R-STAFF-SITE-RESP-02
  title: Ответственным за площадку назначается руководитель, работающий на этой площадке
  text: >
    Отдел кадров назначает ответственного (`appoint_responsible`). Сотрудник должен иметь должность из
    RESPONSIBLE_ROLES (["manager"]) и быть закреплён за этой площадкой. Иначе DomainError. Если позже
    должность ответственного сменят, он останется ответственным: код это не перепроверяет.
  kind: guard
  applies_to:
  - table:staff.sites
  trigger: symbol:services/staff/service.py::appoint_responsible
  effects:
  - 'writes: table:staff.sites'
  related:
  - R-STAFF-HR-01
  - R-STAFF-SITE-RESP-01
  implemented_by:
  - symbol: services/staff/service.py::appoint_responsible
    lines: 229-233
    hash: 5ddb44a1d24d
  config:
  - services/staff/settings.py::RESPONSIBLE_ROLES
  tested_by:
  - tests/test_staff_events.py::test_transferred_responsible_leaves_site_without_one
  status: draft
- id: R-STAFF-SITE-RESP-03
  title: Перевод или увольнение ответственного оставляет площадку без ответственного
  text: >
    Когда закрывается текущее закрепление сотрудника (при переводе или увольнении), `_close_assignment`
    обнуляет `sites.responsible_id`, если сотрудник был ответственным старой площадки. Пока отдел кадров
    не назначит нового ответственного, сменами этой площадки никто управлять не может.
  kind: effect
  applies_to:
  - table:staff.sites
  trigger: symbol:services/staff/service.py::_close_assignment
  effects:
  - 'writes: table:staff.sites'
  - 'writes: table:staff.assignments'
  related:
  - R-STAFF-SITE-RESP-04
  - R-STAFF-TRANSFER-01
  - R-STAFF-DISMISS-01
  implemented_by:
  - symbol: services/staff/service.py::_close_assignment
    lines: 183-194
    hash: cf883d87d633
  - symbol: services/staff/service.py::transfer_employee
    lines: 207-207
    hash: d0cf8e4e4f6c
  - symbol: services/staff/service.py::dismiss_employee
    lines: 147-148
    hash: 452dfb5d0ed9
  tested_by:
  - tests/test_staff_events.py::test_transferred_responsible_leaves_site_without_one
  status: draft
- id: R-STAFF-SITE-RESP-04
  title: При переводе ответственного создаётся уведомление «нет ответственного» без адресата
  text: >
    Подписчик staff.employee_transferred при was_responsible=true создаёт на старой площадке уведомление
    вида no_responsible. Адресатом берётся текущий responsible_id площадки, а он уже обнулён, поэтому
    `recipient_id` = NULL. Уведомление привязано к площадке, а не к смене (shift_id NULL), поэтому защиты
    от дублей нет ни в коде, ни в alerts_unread_uq. При увольнении ответственного такое уведомление не
    создаётся.
  kind: effect
  applies_to:
  - table:staff.alerts
  trigger: event:staff.employee_transferred
  effects:
  - 'writes: table:staff.alerts'
  roles:
  - system
  related:
  - R-STAFF-SITE-RESP-03
  - R-STAFF-ALERT-01
  implemented_by:
  - symbol: services/staff/consumers.py::on_employee_transferred
    lines: 34-40
    hash: acf284f0bdfe
  - symbol: services/staff/service.py::raise_alert
    lines: 599-616
    hash: d75f48810276
  enforced_by_db:
  - constraint: alerts_kind_check
    hash: 57ba92a0098e
  tested_by:
  - tests/test_staff_events.py::test_transferred_responsible_leaves_site_without_one
  status: draft
- id: R-STAFF-CARD-01
  title: Должность сотрудника выбирается из закрытого списка
  text: >
    При приёме и изменении карточки должность проверяется по ROLES (librarian, cashier, guard, manager,
    hr), иначе DomainError «неизвестная должность». Тот же список литералом повторён в CHECK employees_role_check,
    и при изменении настройки его нужно менять в двух местах.
  kind: invariant
  applies_to:
  - table:staff.employees
  trigger: symbol:services/staff/service.py::_validate_card
  related:
  - R-STAFF-CARD-02
  - R-STAFF-CARD-03
  implemented_by:
  - symbol: services/staff/service.py::_validate_card
    lines: 81-83
    hash: db3e8250a7fb
  enforced_by_db:
  - constraint: employees_role_check
    hash: f4f1ff4e5954
  config:
  - services/staff/settings.py::ROLES
  tested_by:
  - tests/test_staff_employees.py::test_card_is_validated_on_hire
  status: draft
- id: R-STAFF-CARD-02
  title: СНИЛС проверяется по контрольному числу в коде и по формату в БД
  text: >
    Если СНИЛС указан, код проверяет его контрольное число (`snils_valid`, взвешенная сумма по модулю
    101), иначе DomainError. Формат «XXX-XXX-XXX YY» проверяет только CHECK employees_snils_format. `snils_valid`
    сначала удаляет дефисы и пробелы, поэтому СНИЛС без разделителей проходит проверку в коде и отклоняется
    БД (IntegrityError).
  kind: invariant
  applies_to:
  - table:staff.employees
  trigger: symbol:services/staff/service.py::_validate_card
  related:
  - R-STAFF-CARD-05
  implemented_by:
  - symbol: services/staff/service.py::snils_valid
    lines: 69-77
    hash: 8097e3de31c7
  - symbol: services/staff/service.py::_validate_card
    lines: 84-86
    hash: db3e8250a7fb
  enforced_by_db:
  - constraint: employees_snils_format
    hash: b3db7f3a80bc
  tested_by:
  - tests/test_staff_employees.py::test_card_is_validated_on_hire
  status: draft
- id: R-STAFF-CARD-03
  title: Сотрудник должен быть не моложе 18 лет
  text: >
    При приёме и изменении карточки с указанной датой рождения возраст на текущую дату должен быть не
    меньше MIN_EMPLOYEE_AGE (18), иначе DomainError. Независимо от этого CHECK employees_birth_date_check
    требует дату рождения позже 1900-01-01.
  kind: guard
  applies_to:
  - table:staff.employees
  trigger: symbol:services/staff/service.py::_validate_card
  related:
  - R-STAFF-CARD-01
  implemented_by:
  - symbol: services/staff/service.py::_validate_card
    lines: 87-92
    hash: db3e8250a7fb
  enforced_by_db:
  - constraint: employees_birth_date_check
    hash: bbacefb7ed75
  config:
  - services/staff/settings.py::MIN_EMPLOYEE_AGE
  tested_by:
  - tests/test_staff_employees.py::test_card_is_validated_on_hire
  status: draft
- id: R-STAFF-CARD-04
  title: Формат паспорта проверяется только в БД
  text: >
    Паспорт должен соответствовать формату «NNNN NNNNNN» (CHECK employees_passport_format). Код формат
    не проверяет. Неверное значение отклоняется при flush с IntegrityError, через API это HTTP 409.
  kind: invariant
  applies_to:
  - table:staff.employees
  trigger: table:staff.employees
  related:
  - R-STAFF-CARD-05
  implemented_by:
  - symbol: services/staff/service.py::hire_employee
    lines: 117-120
    hash: 4686d2f1a764
  enforced_by_db:
  - constraint: employees_passport_format
    hash: 4719d2c5012f
  tested_by:
  - tests/test_staff_employees.py::test_card_is_validated_on_hire
  status: draft
- id: R-STAFF-CARD-05
  title: Паспорт уникален среди работающих, СНИЛС уникален навсегда
  text: >
    Частичный уникальный индекс employees_passport_active_uq запрещает двух неуволенных сотрудников с
    одним паспортом. После увольнения паспорт можно использовать снова. СНИЛС уникален по всей таблице
    (employees_snils_key), включая уволенных, поэтому повторно принять уволенного сотрудника отдельной
    карточкой с тем же СНИЛС нельзя. В коде этих проверок нет: ошибку выдаёт БД.
  kind: invariant
  applies_to:
  - table:staff.employees
  trigger: table:staff.employees
  related:
  - R-STAFF-CARD-02
  - R-STAFF-CARD-04
  - R-STAFF-DISMISS-01
  implemented_by:
  - symbol: services/staff/service.py::hire_employee
    lines: 117-120
    hash: 4686d2f1a764
  enforced_by_db:
  - constraint: employees_passport_active_uq
    hash: 4c2a221355cc
  - constraint: employees_snils_key
    hash: 9d8a3c98fae9
  tested_by:
  - tests/test_staff_employees.py::test_passport_reused_only_after_dismissal
  status: draft
- id: R-STAFF-HIRE-01
  title: Неполную карточку принимают, но такой сотрудник не допускается к сменам и допускам
  text: >
    `hire_employee` требует только должность. ФИО, паспорт, СНИЛС и дата рождения могут быть пустыми.
    Карточка сохраняется, и публикуется staff.employee_hired, на которое никто не подписан. Незаполненные
    поля из REQUIRED_EMPLOYEE_FIELDS возвращает `missing_fields`, API показывает их в missing_fields.
    Приём не закрепляет сотрудника за площадкой, это отдельная операция.
  kind: config
  applies_to:
  - table:staff.employees
  trigger: symbol:services/staff/service.py::hire_employee
  effects:
  - 'writes: table:staff.employees'
  - event:staff.employee_hired
  related:
  - R-STAFF-MEMBER-01
  - R-STAFF-CLEARANCE-01
  implemented_by:
  - symbol: services/staff/service.py::hire_employee
    lines: 108-121
    hash: 4686d2f1a764
  - symbol: services/staff/service.py::missing_fields
    lines: 65-66
    hash: d7db6b7ee1f1
  config:
  - services/staff/settings.py::REQUIRED_EMPLOYEE_FIELDS
  tested_by:
  - tests/test_staff_employees.py::test_incomplete_card_is_saved_but_lists_missing_fields
  - tests/test_staff_events.py::test_api_hire_and_plan_shift
  status: draft
- id: R-STAFF-CARD-06
  title: В карточке меняются только поля из белого списка, карточка уволенного закрыта
  text: >
    `update_employee` меняет только поля из EDITABLE_FIELDS (full_name, passport, snils, birth_date, role),
    на остальные отвечает DomainError «поля нельзя изменить». Карточку уволенного сотрудника изменить
    нельзя. Новые значения проходят ту же проверку, что и при приёме.
  kind: guard
  applies_to:
  - table:staff.employees
  trigger: symbol:services/staff/service.py::update_employee
  effects:
  - 'writes: table:staff.employees'
  related:
  - R-STAFF-RECHECK-01
  implemented_by:
  - symbol: services/staff/service.py::update_employee
    lines: 127-136
    hash: 912223ebf5f2
  config:
  - services/staff/service.py::EDITABLE_FIELDS
  tested_by:
  - tests/test_staff_employees.py::test_dismissal_closes_card_and_releases_everything
  status: draft
- id: R-STAFF-RECHECK-01
  title: Изменение отслеживаемых полей карточки неявно публикует staff.employee_updated
  text: >
    Слушатель ORM `before_flush` проверяет каждую изменённую карточку Employee в сессии. Если значение
    какого-либо поля из TRACKED_FIELDS действительно изменилось, он обновляет updated_at и публикует staff.employee_updated
    со списком изменённых полей. Запись того же значения изменением не считается. Слушатель срабатывает
    при любом flush, не только в `update_employee`. TRACKED_FIELDS дублирует EDITABLE_FIELDS из service.py.
  kind: effect
  applies_to:
  - table:staff.employees
  trigger: symbol:services/staff/listeners.py::_employee_changes
  effects:
  - event:staff.employee_updated
  - 'writes: table:staff.employees'
  roles:
  - system
  related:
  - R-STAFF-RECHECK-02
  - R-STAFF-CARD-06
  implemented_by:
  - symbol: services/staff/listeners.py::_employee_changes
    lines: 14-22
    hash: 8e14afa8598a
  config:
  - services/staff/listeners.py::TRACKED_FIELDS
  tested_by:
  - tests/test_staff_employees.py::test_tracked_change_publishes_employee_updated
  - tests/test_staff_employees.py::test_same_value_is_not_a_change
  status: draft
- id: R-STAFF-RECHECK-02
  title: Изменение карточки отзывает допуски, требующие перепроверки этих полей
  text: >
    Подписчик staff.employee_updated отзывает действующие допуски сотрудника, если recheck_fields их вида
    пересекаются с изменёнными полями. Причина отзыва — recheck. Отзыв публикует staff.clearance_revoked,
    и дальше по цепочке сотрудник снимается со смен, требующих этого допуска, а ответственный может получить
    уведомление о недоукомплектованности.
  kind: effect
  applies_to:
  - table:staff.clearances
  trigger: event:staff.employee_updated
  effects:
  - 'writes: table:staff.clearances'
  - event:staff.clearance_revoked
  roles:
  - system
  related:
  - R-STAFF-RECHECK-01
  - R-STAFF-CLEARANCE-06
  - R-STAFF-CLEARANCE-02
  implemented_by:
  - symbol: services/staff/consumers.py::on_employee_updated
    lines: 11-12
    hash: 0e2dd129a38a
  - symbol: services/staff/service.py::revoke_for_recheck
    lines: 576-590
    hash: ea52bb90d168
  - symbol: services/staff/service.py::_revoke
    lines: 537-549
    hash: 57545fc6c0f9
  tested_by:
  - tests/test_staff_employees.py::test_card_change_revokes_clearances_needing_recheck
  - tests/test_staff_employees.py::test_same_value_is_not_a_change
  - tests/test_staff_events.py::test_passport_change_chain_reaches_responsible
  status: draft
- id: R-STAFF-DISMISS-01
  title: Увольнение закрывает карточку и закрепление за площадкой
  text: >
    `dismiss_employee` проставляет dismissed_at, закрывает текущее закрепление за площадкой (сняв сотрудника
    с роли ответственного, если он им был) и публикует staff.employee_dismissed. Повторное увольнение
    даёт DomainError «сотрудник уже уволен». CHECK employees_dismissal_check требует dismissed_at >= hired_at.
  kind: effect
