- id: R-STAFF-CLEARANCE-02
  title: Для допуска с инструктажем нужен инструктаж по теме не старше 30 дней
  text: >
    Если у вида допуска задан briefing_topic, нужен инструктаж сотрудника по этой теме, проведённый не
    раньше чем BRIEFING_VALID_DAYS (30) дней назад. Площадка инструктажа значения не имеет. Найденный
    инструктаж записывается в briefing_id допуска. При повторной выдаче после отзыва «на перепроверку»
    действует то же требование.
  kind: guard
  applies_to:
  - table:staff.clearances
  trigger: symbol:services/staff/service.py::grant_clearance
