- id: R-STAFF-SHIFT-CLOSE-01
  title: Фоновая задача закрывает завершившиеся смены
  text: >
    `close_finished_shifts(now)` переводит смены со статусом planned и ends_at <= now в статус done. Записи
    о назначенных сотрудниках не меняются. Расписание запуска в модуле не задано. После закрытия такие
    смены не мешают уменьшить максимум площадки и не учитываются в проверке отдыха между сменами.
  kind: timer
