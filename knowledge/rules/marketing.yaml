- id: R-MARKETING-LAUNCH-01
  title: Условия запуска кампании и публикация marketing.campaign_launched
  text: >
    start запускает кампанию только при выполнении всех условий: статус draft или scheduled, аудитория
    не в архиве, по аудитории не идёт другая кампания, выдержана пауза MIN_DAYS_BETWEEN_CAMPAIGNS и есть
    хотя бы один не отписавшийся участник. Тогда кампания переходит в preparing, получает launched_at
    и публикует marketing.campaign_launched. Через start идут и ручной запуск (launch_campaign), и запуск
    по расписанию.
