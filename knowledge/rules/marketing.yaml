- id: R-MARKETING-UNSUBSCRIBE-03
  title: Отписка от площадки не влияет на рассылки других площадок
  text: >
    Отписка с venue_id действует только на кампании и аудитории этой площадки: при подготовке писем и
    при добавлении в аудиторию учитываются отписки от сети и от площадки кампании или аудитории. Отписка
    от сети (venue_id = NULL) действует везде.
  kind: invariant
