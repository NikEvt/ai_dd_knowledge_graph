- id: R-MARKETING-UNSUBSCRIBE-01
  title: Отписка от площадки или сети идемпотентна и требует известной причины
  text: >
    unsubscribe принимает причину из UNSUBSCRIBE_REASONS (reader, bounce, complaint, operator) и нормализует
    адрес. Если адрес уже отписан от всей сети или от этой площадки, возвращается существующая отписка
    без нового события. Иначе создаётся запись (venue_id = NULL — от всей сети) и публикуется marketing.unsubscribed.
    Отписка от площадки не мешает последующей отписке от сети. Список причин продублирован в CHECK БД,
    уникальность держат частичные индексы для сети и для площадки.
  kind: guard
  trigger: symbol:services/marketing/service.py::unsubscribe
  effects:
  - 'writes: table:marketing.unsubscriptions'
  - event:marketing.unsubscribed
  roles:
  - system
