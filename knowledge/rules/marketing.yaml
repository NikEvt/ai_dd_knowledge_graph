# Правила модуля marketing: извлечены LLM (tools/knowledge/bootstrap_rules.sh) из кода и среза графа.
# Статус verified ставит только человек. Хэши обновляет tools/knowledge/drift.py --write.
rules:
- id: R-MARKETING-ACCESS-01
  title: Рассылками площадки управляет только её менеджер или менеджер сети
  text: >
    Любое действие с аудиториями, шаблонами, кампаниями и письмами (создание, архив, добавление адресов,
    планирование, отмена, запуск, отчёт, просмотр писем, тестовое письмо) требует записи в marketing.managers:
    менеджер этой площадки (venue_id = площадка) или менеджер сети (venue_id IS NULL), который допущен
    ко всем площадкам. Иначе AccessDenied «менеджер не ведёт рассылки этой площадки» (HTTP 403). Менеджера
    рассылок нет в общей модели ролей: права задаются только таблицей marketing.managers.
  kind: permission
  trigger: symbol:services/marketing/service.py::_require_manager
  effects:
  - 'reads: table:marketing.managers'
  related:
  - R-MARKETING-ACCESS-02
  implemented_by:
  - symbol: services/marketing/service.py::_require_manager
    lines: 50-58
    hash: f17d73b29679
  - symbol: services/marketing/service.py::_campaign_for
    lines: 261-266
    hash: d7087f582580
  tested_by:
  - tests/test_marketing_audiences.py::test_audience_is_created_by_venue_manager
  - tests/test_marketing_audiences.py::test_manager_of_other_venue_is_denied
  - tests/test_marketing_api.py::test_access_and_missing_campaign
  status: draft
- id: R-MARKETING-ACCESS-02
  title: Шаблоны сети задаёт только менеджер сети
  text: >
    Шаблон без площадки (venue_id = NULL, шаблон сети по умолчанию) может создать или изменить только
    менеджер сети (строка marketing.managers без venue_id); менеджер площадки получает AccessDenied «шаблоны
    сети задаёт только менеджер сети». Проверка в _require_manager при вызове из set_template.
  kind: permission
  trigger: symbol:services/marketing/service.py::set_template
  effects:
  - 'writes: table:marketing.campaign_templates'
  related:
  - R-MARKETING-ACCESS-01
  - R-MARKETING-TEMPLATE-04
  implemented_by:
  - symbol: services/marketing/service.py::_require_manager
    lines: 55-57
    hash: f17d73b29679
  - symbol: services/marketing/service.py::set_template
    lines: 165-165
    hash: 0a68c3b0da86
  tested_by:
  - tests/test_marketing_templates.py::test_network_templates_only_by_network_manager
  status: draft
- id: R-MARKETING-ACCESS-03
  title: Отписка и регистрация возврата письма доступны без проверки менеджера
  text: >
    Эндпоинты POST /marketing/unsubscribe и POST /marketing/messages/{id}/bounce не принимают manager_id
    и не проверяют права. Отписка через API всегда записывается с причиной reader (причину передать нельзя),
    venue_id необязателен — без него адрес отписывается от всей сети.
  kind: permission
  trigger: symbol:services/marketing/api.py::unsubscribe
  effects:
  - symbol:services/marketing/service.py::unsubscribe
  - symbol:services/marketing/service.py::register_bounce
  roles:
  - client
  related:
  - R-MARKETING-UNSUBSCRIBE-01
  - R-MARKETING-BOUNCE-01
  implemented_by:
  - symbol: services/marketing/api.py::unsubscribe
    lines: 190-191
    hash: 5714f7841c40
  - symbol: services/marketing/api.py::bounce
    lines: 185-186
    hash: 3daa88fb5784
  tested_by:
  - tests/test_marketing_api.py::test_unsubscribe_and_bounce_endpoints
  status: draft
- id: R-MARKETING-ACCESS-04
  title: Менеджер закрепляется за площадкой или сетью не более одного раза
  text: >
    Один manager_id может быть только одной строкой менеджера сети (managers_network_uq, venue_id IS NULL)
    и только одной строкой на каждую площадку (managers_venue_uq). add_manager сам ничего не проверяет
    и в API не выставлен; дубль отсекает только БД.
  kind: invariant
  trigger: symbol:services/marketing/service.py::add_manager
  effects:
  - 'writes: table:marketing.managers'
  related:
  - R-MARKETING-ACCESS-01
  implemented_by:
  - symbol: services/marketing/service.py::add_manager
    lines: 41-47
    hash: 0edbfa2dd52a
  enforced_by_db:
  - constraint: managers_network_uq
    hash: f053e7fae553
  - constraint: managers_venue_uq
    hash: dde915c0a26c
  status: draft
- id: R-MARKETING-AUDIENCE-01
  title: Название аудитории непустое и уникально в пределах площадки
  text: >
    При создании аудитории название обрезается по краям пробелов; пустое — DomainError «у аудитории должно
    быть название», уже занятое на этой площадке (точное совпадение с учётом регистра) — DomainError «на
    площадке уже есть аудитория …». БД дублирует обе проверки (CHECK на trim(name) и UNIQUE (venue_id,
    name)).
  kind: guard
  trigger: symbol:services/marketing/service.py::create_audience
  effects:
  - 'writes: table:marketing.audiences'
  implemented_by:
  - symbol: services/marketing/service.py::create_audience
    lines: 66-73
    hash: f9d687635ca6
  enforced_by_db:
  - constraint: audiences_name_check
    hash: 1e9c14ebb67a
  - constraint: audiences_venue_name_uq
    hash: e402efb2ce5d
  tested_by:
  - tests/test_marketing_audiences.py::test_audience_name_is_unique_within_venue
  - tests/test_marketing_audiences.py::test_audience_is_created_by_venue_manager
  status: draft
- id: R-MARKETING-AUDIENCE-02
  title: Нельзя архивировать аудиторию с запланированной или идущей кампанией
  text: >
    archive_audience запрещает архив, если по аудитории есть кампании в статусах scheduled, preparing
    или sending (DomainError «по аудитории есть незавершённые кампании»). Черновики (draft) архиву не
    мешают и остаются, но запустить их после архива нельзя. После отмены запланированной кампании архив
    разрешён.
  kind: guard
  trigger: symbol:services/marketing/service.py::archive_audience
  effects:
  - 'writes: table:marketing.audiences'
  related:
  - R-MARKETING-AUDIENCE-03
  - R-MARKETING-CAMPAIGN-03
  implemented_by:
  - symbol: services/marketing/service.py::archive_audience
    lines: 90-97
    hash: 67bb0bdf8333
  config:
  - services/marketing/service.py::RUNNING
  tested_by:
  - tests/test_marketing_audiences.py::test_archived_audience_cannot_have_pending_campaigns
  - tests/test_marketing_api.py::test_schedule_cancel_and_report
  status: draft
- id: R-MARKETING-AUDIENCE-03
  title: Архивная аудитория закрыта для новых адресов, кампаний и запусков
  text: >
    Если аудитория в архиве, add_member, create_campaign и start (ручной запуск и запуск по расписанию)
    отклоняют действие с DomainError «аудитория в архиве». Ограничение только в коде, в БД его нет.
  kind: guard
  trigger: symbol:services/marketing/service.py::archive_audience
  effects:
  - symbol:services/marketing/service.py::add_member
  - symbol:services/marketing/service.py::create_campaign
  - symbol:services/marketing/service.py::start
  related:
  - R-MARKETING-AUDIENCE-02
  implemented_by:
  - symbol: services/marketing/service.py::add_member
    lines: 124-125
    hash: ebfa07459ae9
  - symbol: services/marketing/service.py::create_campaign
    lines: 237-238
    hash: 94f68b3e8911
  - symbol: services/marketing/service.py::start
    lines: 299-300
    hash: 71783b1f3770
  tested_by:
  - tests/test_marketing_audiences.py::test_archived_audience_cannot_have_pending_campaigns
  status: draft
- id: R-MARKETING-MEMBER-01
  title: Сегмент читателя ограничен списком из настройки AUDIENCE_GROUP
  text: >
    При добавлении адреса сегмент должен быть ключом AUDIENCE_GROUP (paid, debt, social, vip, corporate),
    иначе DomainError «неизвестный сегмент читателя». Тот же список захардкожен в CHECK audience_members_segment_check:
    при добавлении сегмента в настройку нужна миграция.
  kind: guard
  trigger: symbol:services/marketing/service.py::add_member
  effects:
  - 'writes: table:marketing.audience_members'
  related:
  - R-MARKETING-TEMPLATE-01
  implemented_by:
  - symbol: services/marketing/service.py::add_member
    lines: 126-127
    hash: ebfa07459ae9
  enforced_by_db:
  - constraint: audience_members_segment_check
    hash: 8e12c7ec84fd
  config:
  - services/marketing/settings.py::AUDIENCE_GROUP
  tested_by:
  - tests/test_marketing_audiences.py::test_unknown_segment_and_bad_email_rejected
  status: draft
- id: R-MARKETING-MEMBER-02
  title: В аудитории не больше MAX_AUDIENCE_SIZE адресов
  text: >
    add_member отклоняет новый адрес, если в аудитории уже MAX_AUDIENCE_SIZE (5000) записей. В счёт входят
    и отписавшиеся (opted_out) участники, которые писем уже не получают. В БД лимита нет.
  kind: config
  trigger: symbol:services/marketing/service.py::add_member
  effects:
  - table:marketing.audience_members
  implemented_by:
  - symbol: services/marketing/service.py::add_member
    lines: 129-131
    hash: ebfa07459ae9
  config:
  - services/marketing/settings.py::MAX_AUDIENCE_SIZE
  status: draft
- id: R-MARKETING-MEMBER-03
  title: Адрес встречается в аудитории один раз
  text: >
    После нормализации адрес не может повторяться внутри аудитории: код отвечает DomainError «адрес уже
    есть в аудитории», БД держит уникальный индекс (audience_id, email). Один адрес может быть в разных
    аудиториях.
  kind: invariant
  trigger: symbol:services/marketing/service.py::add_member
  effects:
  - 'writes: table:marketing.audience_members'
  related:
  - R-MARKETING-EMAIL-01
  implemented_by:
  - symbol: services/marketing/service.py::add_member
    lines: 132-138
    hash: ebfa07459ae9
  enforced_by_db:
  - constraint: audience_members_email_uq
    hash: 8d8f75f18bec
  tested_by:
  - tests/test_marketing_audiences.py::test_member_email_is_normalized_and_unique
  status: draft
- id: R-MARKETING-MEMBER-04
  title: Отписанный адрес нельзя добавить в аудиторию
  text: >
    add_member отклоняет адрес, если для него есть отписка от всей сети или от площадки аудитории (DomainError
    «адрес отписан от рассылок площадки»). Отписка от другой площадки добавлению не мешает.
  kind: guard
  trigger: symbol:services/marketing/service.py::add_member
  effects:
  - 'reads: table:marketing.unsubscriptions'
  related:
  - R-MARKETING-UNSUBSCRIBE-01
  - R-MARKETING-UNSUBSCRIBE-03
  implemented_by:
  - symbol: services/marketing/service.py::add_member
    lines: 139-140
    hash: ebfa07459ae9
  - symbol: services/marketing/service.py::is_unsubscribed
    lines: 101-110
    hash: b5c9e99fcaac
  tested_by:
  - tests/test_marketing_audiences.py::test_unsubscribed_address_cannot_be_added
  status: draft
- id: R-MARKETING-EMAIL-01
  title: Адреса хранятся в нижнем регистре без пробелов и с «@» не в начале
  text: >
    normalize_email обрезает пробелы, переводит адрес в нижний регистр и отклоняет адрес без «@» после
    первого символа. БД дублирует нормализацию триггерами audience_members_normalize_email и unsubscriptions_normalize_email
    (функция normalize_email), формат — CHECK audience_members_email_check. У marketing.sent_messages
    триггера нормализации нет.
  kind: invariant
  trigger: symbol:services/marketing/service.py::normalize_email
  effects:
  - table:marketing.audience_members
  - table:marketing.unsubscriptions
  related:
  - R-MARKETING-MEMBER-03
  implemented_by:
  - symbol: services/marketing/service.py::normalize_email
    lines: 27-31
    hash: 10df570b6af7
  - symbol: services/marketing/service.py::add_member
    lines: 128-128
    hash: ebfa07459ae9
  - symbol: services/marketing/service.py::unsubscribe
    lines: 532-532
    hash: 64fc88110942
  enforced_by_db:
  - constraint: audience_members_normalize_email
    hash: e4dea3286e00
  - constraint: unsubscriptions_normalize_email
    hash: 10ff9b67fbeb
  - constraint: normalize_email
    hash: 38c4644677ce
  - constraint: audience_members_email_check
    hash: 30d3c9a90b84
  tested_by:
  - tests/test_marketing_audiences.py::test_member_email_is_normalized_and_unique
  - tests/test_marketing_audiences.py::test_member_email_normalized_by_database_too
  - tests/test_marketing_audiences.py::test_unknown_segment_and_bad_email_rejected
  status: draft
- id: R-MARKETING-TEMPLATE-01
  title: Платные сегменты (paid, debt, corporate) получают общий шаблон группы paid
  text: >
    Шаблоны заводятся на группу аудитории, а не на сегмент: AUDIENCE_GROUP отображает corporate, debt
    и paid в группу paid, social — в social, vip — в vip. Поэтому шаблон группы paid получают все платные
    сегменты.
  kind: config
  trigger: symbol:services/marketing/service.py::find_template
  effects:
  - 'reads: table:marketing.campaign_templates'
  related:
  - R-MARKETING-TEMPLATE-02
  - R-MARKETING-MEMBER-01
  implemented_by:
  - symbol: services/marketing/service.py::find_template
    lines: 194-195
    hash: 50ad69afbed3
  config:
  - services/marketing/settings.py::AUDIENCE_GROUP
  tested_by:
  - tests/test_marketing_templates.py::test_paying_segments_share_template
  status: draft
- id: R-MARKETING-TEMPLATE-02
  title: 'Порядок поиска шаблона: площадка, сеть, затем запасная группа paid'
  text: >
    Для сегмента читателя и типа кампании find_template ищет шаблон в таком порядке: шаблон площадки для
    группы читателя, шаблон сети для этой группы, затем шаблон площадки и шаблон сети для FALLBACK_GROUP
    (paid). Если сегмент неизвестен, берётся сразу группа paid. Если ничего не нашлось, возвращается None:
    при подготовке рассылки письмо пропускается, для тестового письма возникает ошибка.
  kind: calculation
  trigger: symbol:services/marketing/service.py::find_template
  effects:
  - 'reads: table:marketing.campaign_templates'
  roles:
  - system
  related:
  - R-MARKETING-TEMPLATE-01
  - R-MARKETING-PREPARE-02
  - R-MARKETING-TEST-01
  implemented_by:
  - symbol: services/marketing/service.py::find_template
    lines: 194-210
    hash: 50ad69afbed3
  config:
  - services/marketing/settings.py::FALLBACK_GROUP
  - services/marketing/settings.py::AUDIENCE_GROUP
  tested_by:
  - tests/test_marketing_templates.py::test_find_template_falls_back_to_network_then_paid_group
  - tests/test_marketing_templates.py::test_paying_segments_share_template
  status: draft
- id: R-MARKETING-TEMPLATE-03
  title: 'Проверки шаблона: группа, тип кампании, непустой текст, длина'
  text: >
    set_template принимает только группу из значений AUDIENCE_GROUP (paid, social, vip; сегмент, например
    debt, отклоняется), тип из CAMPAIGN_TYPES (newsletter, event, promo), текст не из одних пробелов и
    не длиннее MAX_TEMPLATE_LENGTH (10000). В БД есть CHECK на группу (список захардкожен) и на length(body)
    > 0 (пробельный текст БД пропустит). Тип кампании и длину шаблона БД не проверяет.
  kind: guard
  trigger: symbol:services/marketing/service.py::set_template
  effects:
  - 'writes: table:marketing.campaign_templates'
  related:
  - R-MARKETING-TEMPLATE-04
  implemented_by:
  - symbol: services/marketing/service.py::set_template
    lines: 166-173
    hash: 0a68c3b0da86
  enforced_by_db:
  - constraint: campaign_templates_audience_group_check
    hash: 55b515d0e98a
  - constraint: campaign_templates_body_check
    hash: 121c249d50f3
  config:
  - services/marketing/settings.py::AUDIENCE_GROUP
  - services/marketing/settings.py::CAMPAIGN_TYPES
  - services/marketing/settings.py::MAX_TEMPLATE_LENGTH
  tested_by:
  - tests/test_marketing_templates.py::test_template_validation
  - tests/test_marketing_api.py::test_access_and_missing_campaign
  status: draft
- id: R-MARKETING-TEMPLATE-04
  title: Один шаблон на площадку (или сеть), группу и тип; повторная запись обновляет его
  text: >
    set_template работает как upsert: если шаблон для (площадка или сеть, группа, тип) уже есть, меняются
    его body и updated_at, иначе создаётся новый. В БД уникальность держат UNIQUE (venue_id, audience_group,
    type) и частичный индекс campaign_templates_default_uq для шаблонов сети, потому что NULL в UNIQUE
    не сравниваются.
  kind: invariant
  trigger: symbol:services/marketing/service.py::set_template
  effects:
  - 'writes: table:marketing.campaign_templates'
  related:
  - R-MARKETING-TEMPLATE-03
  implemented_by:
  - symbol: services/marketing/service.py::set_template
    lines: 175-186
    hash: 0a68c3b0da86
  enforced_by_db:
  - constraint: campaign_templates_venue_group_type_uq
    hash: e00b4745da71
  - constraint: campaign_templates_default_uq
    hash: 1719ee09f3fc
  tested_by:
  - tests/test_marketing_templates.py::test_set_template_updates_existing
  status: draft
- id: R-MARKETING-TEMPLATE-05
  title: Текст письма подставляет $full_name, $email и $subject
  text: >
    Текст письма получается из шаблона через string.Template.safe_substitute с переменными full_name,
    email и subject (тема кампании). Неизвестные плейсхолдеры остаются в тексте как есть, ошибки нет.
    Так готовятся и письма кампании, и тестовые письма.
  kind: calculation
  trigger: symbol:services/marketing/service.py::prepare_messages
  effects:
  - 'writes: table:marketing.sent_messages'
  roles:
  - system
  related:
  - R-MARKETING-PREPARE-02
  - R-MARKETING-TEST-01
  implemented_by:
  - symbol: services/marketing/service.py::render
    lines: 34-35
    hash: 09172c49c5c7
  - symbol: services/marketing/service.py::prepare_messages
    lines: 369-372
    hash: aa480556f473
  - symbol: services/marketing/service.py::send_test_message
    lines: 481-481
    hash: 1ea055166b98
  tested_by:
  - tests/test_marketing_campaigns.py::test_launch_prepares_sends_and_summarizes
  - tests/test_marketing_api.py::test_test_message_then_campaign_messages
  status: draft
- id: R-MARKETING-CAMPAIGN-01
  title: Кампания создаётся с известным типом и темой, в статусе draft или scheduled
  text: >
    create_campaign требует тип из CAMPAIGN_TYPES и непустую тему (после обрезки пробелов). Если задано
    scheduled_at, оно проверяется по окну планирования и кампания получает статус scheduled, иначе draft.
    Площадка кампании берётся из аудитории. Наличие шаблона при создании не проверяется, а тип кампании
    в БД не ограничен.
  kind: guard
  trigger: symbol:services/marketing/service.py::create_campaign
  effects:
  - 'writes: table:marketing.campaigns'
  related:
  - R-MARKETING-CAMPAIGN-02
  - R-MARKETING-AUDIENCE-03
  implemented_by:
  - symbol: services/marketing/service.py::create_campaign
    lines: 239-256
    hash: 94f68b3e8911
  enforced_by_db:
  - constraint: campaigns_check
    hash: cdfee1cbdb46
  config:
  - services/marketing/settings.py::CAMPAIGN_TYPES
  tested_by:
  - tests/test_marketing_campaigns.py::test_launch_prepares_sends_and_summarizes
  status: draft
- id: R-MARKETING-CAMPAIGN-02
  title: Кампанию планируют только в будущее и не дальше MAX_SCHEDULE_AHEAD_DAYS
  text: >
    При создании с датой и при переносе время запуска должно быть позже текущего («нельзя запланировать
    кампанию на прошедшее время») и не дальше MAX_SCHEDULE_AHEAD_DAYS (90) дней от текущего момента. В
    БД CHECK campaigns_check требует scheduled_at у кампании в статусе scheduled; само окно планирования
    БД не проверяет.
  kind: guard
  trigger: symbol:services/marketing/service.py::schedule_campaign
  effects:
