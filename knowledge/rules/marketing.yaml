- id: R-MARKETING-BOUNCE-02
  title: После BOUNCE_LIMIT возвратов адрес отписывается от всех рассылок сети
  text: >
    handle_bounce (подписчик marketing.message_bounced) считает все нетестовые письма адреса в статусе
    bounced по всем кампаниям и площадкам без ограничения по времени. Когда их становится BOUNCE_LIMIT
    (3) или больше, адрес отписывается от всей сети (venue_id = NULL) с причиной bounce. Это публикует
    marketing.unsubscribed и исключает адрес из аудиторий.
  kind: effect
  trigger: event:marketing.message_bounced
  effects:
  - 'writes: table:marketing.unsubscriptions'
  - event:marketing.unsubscribed
  roles:
  - system
