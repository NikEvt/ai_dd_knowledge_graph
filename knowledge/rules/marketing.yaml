    (preparing → sending, публикует marketing.campaign_prepared) → deliver_messages (sending → sent, публикует
    marketing.campaign_finished) → summarize_campaign. Каждый шаг берёт кампанию с блокировкой FOR UPDATE
    и молча завершается, если статус уже не тот. Других подписчиков в других сервисах у событий нет.
