- id: R-MARKETING-UNSUBSCRIBE-02
  title: Отписка исключает адрес из аудиторий и снимает ещё не ушедшие письма
  text: >
    exclude_address (подписчик marketing.unsubscribed) ставит opted_out = true во всех аудиториях площадки
    отписки, а при отписке от сети — во всех аудиториях. Письма адреса в статусе queued в кампаниях, которые
    сейчас идут (preparing, sending), переводятся в skipped с причиной unsubscribed. Уже отправленные
    письма не меняются. Способа вернуть opted_out = false в коде нет.
  kind: effect
  trigger: event:marketing.unsubscribed
  effects:
  - 'writes: table:marketing.audience_members'
  - 'writes: table:marketing.sent_messages'
  roles:
