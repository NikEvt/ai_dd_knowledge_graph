# Правила модуля subscriptions: извлечены LLM (tools/knowledge/bootstrap_rules.sh) из кода и среза графа.
# Статус verified ставит только человек. Хэши обновляет tools/knowledge/drift.py --write.
rules:
- id: R-SUBSCRIPTIONS-PLAN-01
  title: Тариф создаётся только известного вида, с положительной ценой и уникальным кодом
  text: >
    create_plan отклоняет вид тарифа вне PLAN_KINDS (regular, social, corporate), стоимость в месяц <=
    0 и код, который уже есть. Те же условия дублирует БД: ck_plans_kind, ck_plans_fee, uq_plans_code.
    Лимит книг max_books (1–50) проверяет только CHECK ck_plans_max_books, в коде его проверки нет.
  kind: invariant
  applies_to:
  - table:subscriptions.plans
  trigger: symbol:services/subscriptions/service.py::create_plan
  effects:
  - 'writes: table:subscriptions.plans'
  roles:
  - admin
  related:
  - R-SUBSCRIPTIONS-PLAN-02
  implemented_by:
  - symbol: services/subscriptions/service.py::create_plan
    lines: 56-61
    hash: 766e6087eec8
  enforced_by_db:
  - constraint: ck_plans_kind
    hash: 3872ec4459f7
  - constraint: ck_plans_fee
    hash: 335fee1b56ef
  - constraint: ck_plans_max_books
    hash: 5287a850fd25
  - constraint: uq_plans_code
    hash: aa26c8e239e6
  config:
  - services/subscriptions/service.py::PLAN_KINDS
  status: draft
- id: R-SUBSCRIPTIONS-PLAN-02
  title: Архивный тариф не продаётся и не показывается, но действующие абонементы на нём продлеваются
  text: >
    archive_plan ставит у тарифа флаг archived. list_plans (GET /plans) показывает только тарифы без архивного
    флага, а create_subscription отклоняет оформление на архивный тариф («тариф больше не продаётся»).
    Выставление счетов за продление (issue_renewal_invoices) флаг archived не проверяет, поэтому уже действующие
    абонементы на архивном тарифе продолжают продлеваться по его цене.
  kind: guard
  applies_to:
  - plan.archived=true
  trigger: symbol:services/subscriptions/service.py::create_subscription
  effects:
  - 'writes: table:subscriptions.plans'
  roles:
  - admin
  - client
  related:
  - R-SUBSCRIPTIONS-RENEWAL-01
  implemented_by:
  - symbol: services/subscriptions/service.py::archive_plan
    lines: 68-71
    hash: 57a4af6de05a
  - symbol: services/subscriptions/service.py::list_plans
    lines: 81-83
    hash: d83af9da3379
  - symbol: services/subscriptions/service.py::create_subscription
    lines: 135-136
    hash: 2022d30b0a2b
  tested_by:
  - tests/test_subscriptions_holder.py::test_archived_plan_not_sold
  status: draft
- id: R-SUBSCRIPTIONS-CREATE-01
  title: Организация-работодатель указывается только для корпоративного тарифа и для него обязательна
  text: >
    При оформлении абонемента на корпоративный тариф нужен employer_ref («для корпоративного тарифа нужна
    организация-работодатель»). Для обычного и социального тарифа указать организацию нельзя («организация
    указывается только для корпоративного тарифа»).
  kind: guard
  applies_to:
  - plan.kind=corporate
  trigger: symbol:services/subscriptions/service.py::create_subscription
  roles:
  - client
  implemented_by:
  - symbol: services/subscriptions/service.py::create_subscription
    lines: 137-140
    hash: 2022d30b0a2b
  tested_by:
  - tests/test_subscriptions_holder.py::test_corporate_plan_requires_employer
  status: draft
- id: R-SUBSCRIPTIONS-HOLDER-01
  title: Данные держателя проходят проверку формата и возраста
  text: >
    _validate_holder вызывается при оформлении и при изменении данных держателя. Имя не должно быть пустым.
    Паспорт, если он указан, должен быть в формате «1234 567890» (PASSPORT_RE). Дата рождения должна быть
    в прошлом, а возраст держателя — не меньше MIN_HOLDER_AGE (14 лет). Паспорт и дата рождения необязательны,
    кроме социального тарифа.
  kind: guard
  applies_to:
  - table:subscriptions.subscriptions
  trigger: symbol:services/subscriptions/service.py::_validate_holder
  roles:
  - client
  related:
  - R-SUBSCRIPTIONS-HOLDER-02
  - R-SUBSCRIPTIONS-HOLDER-04
  implemented_by:
  - symbol: services/subscriptions/service.py::_validate_holder
    lines: 106-114
    hash: 20eae0f36240
  config:
  - services/subscriptions/service.py::PASSPORT_RE
  - services/subscriptions/settings.py::MIN_HOLDER_AGE
  status: draft
- id: R-SUBSCRIPTIONS-SOCIAL-01
  title: Для социального тарифа обязательны паспорт и дата рождения
  text: >
    Абонемент на социальный тариф нельзя оформить или изменить без паспорта и даты рождения держателя
    (_validate_holder: «для социального тарифа нужны паспорт и дата рождения»).
  kind: guard
  applies_to:
  - plan.kind=social
  trigger: symbol:services/subscriptions/service.py::_validate_holder
  roles:
  - client
  related:
  - R-SUBSCRIPTIONS-SOCIAL-02
  implemented_by:
  - symbol: services/subscriptions/service.py::_validate_holder
    lines: 115-116
    hash: 20eae0f36240
  tested_by:
  - tests/test_subscriptions_holder.py::test_social_plan_needs_eligible_holder
  status: draft
- id: R-SUBSCRIPTIONS-SOCIAL-02
  title: Социальный тариф доступен держателям не старше 23 лет или от 60 лет
  text: >
    При оформлении социального абонемента возраст держателя на сегодня должен быть <= SOCIAL_MAX_STUDENT_AGE
    (23) или >= SOCIAL_MIN_SENIOR_AGE (60). Иначе create_subscription отклоняет оформление («социальный
    тариф доступен студентам и пенсионерам»). Статус студента или пенсионера код не проверяет, только
    возраст.
  kind: guard
  applies_to:
  - plan.kind=social
  trigger: symbol:services/subscriptions/service.py::create_subscription
  roles:
  - client
  related:
  - R-SUBSCRIPTIONS-SOCIAL-01
  - R-SUBSCRIPTIONS-HOLDER-03
  implemented_by:
  - symbol: services/subscriptions/service.py::_social_eligible
    lines: 119-121
    hash: 29b9af8f0b19
  - symbol: services/subscriptions/service.py::create_subscription
    lines: 144-145
    hash: 2022d30b0a2b
  config:
  - services/subscriptions/settings.py::SOCIAL_MAX_STUDENT_AGE
  - services/subscriptions/settings.py::SOCIAL_MIN_SENIOR_AGE
  tested_by:
  - tests/test_subscriptions_holder.py::test_social_plan_needs_eligible_holder
  status: draft
- id: R-SUBSCRIPTIONS-CREATE-02
  title: У клиента не может быть двух действующих абонементов на один тариф
  text: >
    create_subscription отклоняет оформление, если у клиента уже есть абонемент на этот тариф в статусе
    active или grace (LIVE) — его предлагают продлить. БД дублирует запрет частичным уникальным индексом
    uq_subscriptions_one_active на (client_ref, plan_id) WHERE status IN ('active','grace'). Абонементы
    в статусе pending на тот же тариф этот запрет не ограничивает.
  kind: invariant
  applies_to:
  - table:subscriptions.subscriptions
  trigger: symbol:services/subscriptions/service.py::create_subscription
  roles:
  - client
  related:
  - R-SUBSCRIPTIONS-CREATE-03
  - R-SUBSCRIPTIONS-DEDUP-01
  implemented_by:
  - symbol: services/subscriptions/service.py::create_subscription
    lines: 147-155
    hash: 2022d30b0a2b
  enforced_by_db:
  - constraint: uq_subscriptions_one_active
    hash: 9b44bce7687c
  config:
  - services/subscriptions/service.py::LIVE
  tested_by:
  - tests/test_subscriptions_activation.py::test_second_subscription_on_live_plan_rejected
  - tests/test_subscriptions_activation.py::test_database_keeps_one_live_subscription_per_plan
  status: draft
- id: R-SUBSCRIPTIONS-CREATE-03
  title: Клиент может держать не больше трёх неоплаченных абонементов
  text: >
    create_subscription считает абонементы клиента в статусе pending по всем тарифам. Если их уже MAX_PENDING_PER_CLIENT
    (3) или больше, новый абонемент не оформляется («у клиента слишком много неоплаченных абонементов»).
    Ограничение есть только в коде, в БД его нет.
  kind: guard
  applies_to:
  - subscription.status=pending
  trigger: symbol:services/subscriptions/service.py::create_subscription
  roles:
  - client
  related:
  - R-SUBSCRIPTIONS-PENDING-01
  implemented_by:
  - symbol: services/subscriptions/service.py::create_subscription
    lines: 156-160
    hash: 2022d30b0a2b
  config:
  - services/subscriptions/settings.py::MAX_PENDING_PER_CLIENT
  status: draft
- id: R-SUBSCRIPTIONS-CREATE-04
  title: Новый абонемент создаётся неоплаченным, и на него сразу выставляется счёт за первый месяц
  text: >
    create_subscription создаёт абонемент в статусе pending и сразу выставляет счёт за месяц, начиная
    с сегодняшней даты (issue_invoice). Затем публикуется subscriptions.created, по которому данные держателя
    отправляются на сверку. POST /subscriptions возвращает id абонемента и id открытого счёта.
  kind: effect
  applies_to:
  - table:subscriptions.subscriptions
  trigger: symbol:services/subscriptions/service.py::create_subscription
  effects:
  - 'writes: table:subscriptions.subscriptions'
  - 'writes: table:subscriptions.invoices'
  - event:subscriptions.created
  - event:subscriptions.invoice_issued
  roles:
  - client
  related:
  - R-SUBSCRIPTIONS-INVOICE-01
  - R-SUBSCRIPTIONS-HOLDER-02
  implemented_by:
  - symbol: services/subscriptions/service.py::create_subscription
    lines: 162-178
    hash: 2022d30b0a2b
  - symbol: services/subscriptions/api.py::create
    lines: 80-83
    hash: 8076b36f8b79
  tested_by:
  - tests/test_subscriptions_api.py::test_subscribe_and_pay_over_api
  status: draft
- id: R-SUBSCRIPTIONS-HOLDER-02
  title: Сверка держателя отклоняет абонемент без паспорта или даты рождения при любом тарифе
  text: >
    При subscriptions.created и subscriptions.holder_updated recheck_holder проверяет абонемент с holder_check=pending,
    если он не закрыт. Без паспорта или даты рождения абонемент получает holder_check=rejected даже на
    обычном и корпоративном тарифе, хотя при оформлении эти поля там необязательны. Если данные полные
    и подходят под тариф, ставится verified. При отклонении публикуется subscriptions.holder_rejected.
    Отклонённая сверка не блокирует ни оплату, ни активацию абонемента.
  kind: effect
  applies_to:
  - subscription.holder_check=pending
  trigger: event:subscriptions.created
  effects:
  - 'writes: table:subscriptions.subscriptions'
  - event:subscriptions.holder_rejected
  roles:
  - system
  related:
  - R-SUBSCRIPTIONS-HOLDER-01
  - R-SUBSCRIPTIONS-HOLDER-03
  - R-SUBSCRIPTIONS-NOTICE-01
  implemented_by:
  - symbol: services/subscriptions/consumers.py::on_created
    lines: 10-11
    hash: c4012f281bcf
  - symbol: services/subscriptions/consumers.py::on_holder_updated
    lines: 15-16
    hash: 02d841ffb2f5
  - symbol: services/subscriptions/service.py::recheck_holder
    lines: 218-232
    hash: 96e223fd16d1
  enforced_by_db:
  - constraint: ck_subscriptions_holder_check
    hash: 921707cd50e5
  tested_by:
  - tests/test_subscriptions_holder.py::test_holder_without_passport_is_rejected
  - tests/test_subscriptions_holder.py::test_complete_holder_is_verified
  status: draft
- id: R-SUBSCRIPTIONS-HOLDER-03
  title: При сверке социального абонемента возраст держателя проверяется заново на текущую дату
  text: >
    recheck_holder проверяет право на социальный тариф (_social_eligible) по возрасту на сегодня. Например,
    держатель, которому исполнилось 24 года, при изменении данных получает holder_check=rejected и уведомление.
    Сверка запускается только при оформлении и при изменении данных держателя. Периодической перепроверки
    возраста нет, и сам абонемент при отклонении не закрывается.
  kind: guard
  applies_to:
  - plan.kind=social
  trigger: event:subscriptions.holder_updated
  effects:
  - event:subscriptions.holder_rejected
  roles:
  - system
  related:
  - R-SUBSCRIPTIONS-SOCIAL-02
  - R-SUBSCRIPTIONS-HOLDER-02
  implemented_by:
  - symbol: services/subscriptions/service.py::recheck_holder
    lines: 226-232
    hash: 96e223fd16d1
  config:
  - services/subscriptions/settings.py::SOCIAL_MAX_STUDENT_AGE
  - services/subscriptions/settings.py::SOCIAL_MIN_SENIOR_AGE
  tested_by:
  - tests/test_subscriptions_holder.py::test_student_social_plan_rejected_on_recheck_after_birthday
  status: draft
- id: R-SUBSCRIPTIONS-HOLDER-04
  title: Данные держателя меняет только владелец незакрытого абонемента
  text: >
    update_holder (PUT /subscriptions/{id}/holder) отклоняет изменение с AccessDenied, если client_ref
    не совпадает с владельцем абонемента. У закрытого абонемента (expired, closed_duplicate) данные держателя
    не меняются. client_ref передаётся в теле запроса, аутентификации и проверки роли в API нет.
  kind: permission
  applies_to:
  - table:subscriptions.subscriptions
  trigger: symbol:services/subscriptions/service.py::update_holder
  roles:
  - client
  related:
  - R-SUBSCRIPTIONS-HOLDER-05
  - R-SUBSCRIPTIONS-API-01
  implemented_by:
  - symbol: services/subscriptions/service.py::update_holder
    lines: 192-195
    hash: a5f3481dec6f
  config:
  - services/subscriptions/service.py::CLOSED
  tested_by:
  - tests/test_subscriptions_holder.py::test_holder_updated_only_by_owner
  - tests/test_subscriptions_holder.py::test_closed_subscription_holder_is_frozen
  status: draft
- id: R-SUBSCRIPTIONS-HOLDER-05
  title: Изменение данных держателя отправляет абонемент на повторную сверку
  text: >
    update_holder сравнивает новые значения holder_name, passport и birth_date с текущими. Если ничего
    не изменилось, ничего не происходит. Иначе поля обновляются, holder_check сбрасывается в pending и
    публикуется subscriptions.holder_updated, а подписчик запускает recheck_holder. Поле, переданное как
    null, остаётся прежним, поэтому очистить паспорт или дату рождения нельзя.
  kind: effect
  applies_to:
  - table:subscriptions.subscriptions
  trigger: symbol:services/subscriptions/service.py::update_holder
  effects:
  - 'writes: table:subscriptions.subscriptions'
  - event:subscriptions.holder_updated
  roles:
  - client
  related:
  - R-SUBSCRIPTIONS-HOLDER-02
  implemented_by:
  - symbol: services/subscriptions/service.py::update_holder
    lines: 198-212
    hash: a5f3481dec6f
  config:
  - services/subscriptions/service.py::HOLDER_FIELDS
  tested_by:
  - tests/test_subscriptions_holder.py::test_holder_update_sends_subscription_to_recheck
  - tests/test_subscriptions_holder.py::test_unchanged_holder_data_is_not_rechecked
  status: draft
- id: R-SUBSCRIPTIONS-INVOICE-01
  title: По абонементу может быть только один открытый счёт
  text: >
    issue_invoice отклоняет выставление счёта, если у абонемента уже есть счёт в статусе open («по абонементу
    уже есть неоплаченный счёт»). БД дублирует запрет частичным уникальным индексом uq_invoices_one_open
    (subscription_id WHERE status='open'). Кроме того, uq_invoices_period запрещает два счёта на один
    и тот же период одного абонемента.
  kind: invariant
  applies_to:
  - table:subscriptions.invoices
  trigger: symbol:services/subscriptions/service.py::issue_invoice
  roles:
  - system
  related:
  - R-SUBSCRIPTIONS-INVOICE-02
  - R-SUBSCRIPTIONS-RENEWAL-01
  implemented_by:
  - symbol: services/subscriptions/service.py::issue_invoice
    lines: 246-247
    hash: b0b9e7c2e382
  enforced_by_db:
  - constraint: uq_invoices_one_open
    hash: e312df3dc41a
  - constraint: uq_invoices_period
    hash: bea8d774aa76
  - constraint: ck_invoices_status
    hash: 4615b7b720bc
  status: draft
- id: R-SUBSCRIPTIONS-INVOICE-02
  title: Счёт выставляется за календарный месяц по текущей цене тарифа
  text: >
    Счёт покрывает период с period_start по тот же день следующего месяца минус один день включительно
    (period_for/add_months; если в следующем месяце такого дня нет, берётся последний день месяца). Сумма
    равна monthly_fee тарифа на момент выставления. После выставления публикуется subscriptions.invoice_issued.
    CHECK-ограничения ck_invoices_amount и ck_invoices_period требуют положительную сумму и period_end
    > period_start.
  kind: calculation
  applies_to:
  - table:subscriptions.invoices
  trigger: symbol:services/subscriptions/service.py::issue_invoice
  effects:
  - 'writes: table:subscriptions.invoices'
  - event:subscriptions.invoice_issued
  roles:
  - system
  related:
  - R-SUBSCRIPTIONS-INVOICE-01
  - R-SUBSCRIPTIONS-NOTICE-01
  implemented_by:
  - symbol: services/subscriptions/service.py::period_for
    lines: 32-34
    hash: bd2b036b7b23
  - symbol: services/subscriptions/service.py::add_months
    lines: 25-29
    hash: 9b173ed42906
  - symbol: services/subscriptions/service.py::issue_invoice
    lines: 248-268
    hash: b0b9e7c2e382
  enforced_by_db:
  - constraint: ck_invoices_amount
    hash: 5ddec6c010bb
  - constraint: ck_invoices_period
    hash: 856dd99cdc3e
  status: draft
- id: R-SUBSCRIPTIONS-PAYMENT-01
  title: Платёж принимается только по открытому счёту, в пределах остатка и с положительной суммой
  text: >
    record_payment (POST /invoices/{id}/payments) блокирует счёт (FOR UPDATE) и отклоняет платёж, если
    счёт не в статусе open, если сумма <= 0 или если сумма больше остатка (amount - paid_total). Те же
    проверки дублирует БД: триггер trg_payments_guard (функция payments_guard) запрещает платёж по неоткрытому
    счёту и сверх остатка, ck_payments_amount требует положительную сумму, ck_invoices_paid_total — paid_total
    в пределах суммы счёта.
  kind: guard
  applies_to:
  - table:subscriptions.payments
  trigger: symbol:services/subscriptions/service.py::record_payment
  roles:
  - client
  - system
  related:
  - R-SUBSCRIPTIONS-PAYMENT-02
  - R-SUBSCRIPTIONS-PAYMENT-03
  implemented_by:
  - symbol: services/subscriptions/service.py::record_payment
    lines: 275-283
    hash: b716fc648364
  enforced_by_db:
  - constraint: trg_payments_guard
    hash: 847b8796ba41
  - constraint: payments_guard
    hash: 078aed2ca20e
  - constraint: ck_payments_amount
    hash: 5ddec6c010bb
  - constraint: ck_invoices_paid_total
    hash: 01709a0342e4
  tested_by:
  - tests/test_subscriptions_activation.py::test_overpayment_rejected
  - tests/test_subscriptions_activation.py::test_paid_invoice_does_not_take_payments
  - tests/test_subscriptions_activation.py::test_database_rejects_payment_above_balance
  status: draft
- id: R-SUBSCRIPTIONS-PAYMENT-02
  title: Внешний платёж с одним и тем же external_ref учитывается один раз
  text: >
    Если у платежа есть external_ref, record_payment отклоняет его при наличии платежа с тем же идентификатором
    («платёж … уже учтён»). БД дублирует запрет частичным уникальным индексом uq_payments_external_ref.
    Платежи без external_ref не дедуплицируются.
  kind: invariant
  applies_to:
  - table:subscriptions.payments
  trigger: symbol:services/subscriptions/service.py::record_payment
  roles:
  - system
  related:
  - R-SUBSCRIPTIONS-PAYMENT-01
  implemented_by:
  - symbol: services/subscriptions/service.py::record_payment
    lines: 284-287
    hash: b716fc648364
  enforced_by_db:
  - constraint: uq_payments_external_ref
    hash: 6987f9eea93c
  tested_by:
  - tests/test_subscriptions_activation.py::test_same_external_payment_counted_once
  status: draft
- id: R-SUBSCRIPTIONS-PAYMENT-03
  title: Оплаченную сумму счёта считает триггер БД, полная оплата закрывает счёт
  text: >
