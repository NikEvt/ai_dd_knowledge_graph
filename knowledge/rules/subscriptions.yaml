- id: R-SUBSCRIPTIONS-DEDUP-01
  title: При активации закрываются другие открытые абонементы клиента того же направления
  text: >
    close_duplicates при активации ставит статус closed_duplicate и closed_at всем другим абонементам
    клиента в статусах pending, active или grace из того же направления и публикует subscriptions.closed_duplicate.
    Направления два: социальное и платное, причём обычный и корпоративный тарифы считаются одним направлением.
    Поэтому оплата нового платного тарифа закрывает действующий платный абонемент на другом тарифе без
    возврата за оставшийся оплаченный срок. Социальный и платный абонементы действуют одновременно, абонементы
    других клиентов не затрагиваются.
  kind: effect
  applies_to:
  - subscription.status=pending
  trigger: event:subscriptions.payment_completed
  effects:
  - 'writes: table:subscriptions.subscriptions'
  - event:subscriptions.closed_duplicate
  roles:
  - system
