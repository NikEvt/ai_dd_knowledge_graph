    apply_payment ничего не меняет и выдаёт ошибку. Абонемент в статусе pending становится active: activated_at
    — текущее время, paid_until — конец периода счёта. Публикуется subscriptions.activated. Перед активацией
    закрываются дубли того же направления. Результат сверки держателя (holder_check) на активацию не влияет.
  kind: effect
  applies_to:
