- id: R-SUBSCRIPTIONS-GRACE-02
  title: Через 30 дней после paid_until неоплаченный абонемент закрывается (срок задан литералом)
  text: >
    expire_overdue переводит абонементы в статусе active или grace с paid_until + 30 дней < сегодня в
    статус expired, ставит closed_at и публикует subscriptions.expired (reason=unpaid). Срок 30 дней здесь
    задан литералом, а не настройкой GRACE_DAYS. Если GRACE_DAYS изменить, фактический срок закрытия разойдётся
    с датой grace_until в уведомлении. Проверка на закрытие идёт до перевода в grace, поэтому «забытый»
    абонемент в статусе active с давно истёкшим paid_until закрывается сразу, минуя grace.
  kind: timer
  applies_to:
  - subscription.status=active
  - subscription.status=grace
