- id: R-SUBSCRIPTIONS-RENEWAL-02
  title: Оплата продления продлевает paid_until и возвращает абонемент из grace в active
  text: >
    При полной оплате счёта по абонементу в статусе active или grace apply_payment ставит статус active
    и paid_until = max(paid_until, конец периода счёта), затем публикует subscriptions.renewed. Период
    продления отсчитывается от прежнего paid_until, а не от даты оплаты, поэтому дни в grace входят в
    оплаченный месяц.
