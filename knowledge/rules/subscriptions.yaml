  - tests/test_subscriptions_activation.py::test_social_and_paid_plans_live_together
  - tests/test_subscriptions_activation.py::test_other_clients_are_not_duplicates
  status: draft
- id: R-SUBSCRIPTIONS-DEDUP-02
  title: У закрытого дубля аннулируются открытые счета, частичная оплата подлежит возврату
  text: >
    Подписчик subscriptions.closed_duplicate вызывает void_open_invoices: все открытые счета абонемента
    переводятся в void. Если по счёту уже есть частичная оплата (paid_total > 0), публикуется subscriptions.refund_required
    на эту сумму. Затем держателю создаётся уведомление о закрытии со ссылкой на сохранённый абонемент.
