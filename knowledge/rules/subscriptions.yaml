- id: R-SUBSCRIPTIONS-STATUS-01
  title: Закрытый абонемент нельзя открыть снова (триггер БД)
  text: >
    Триггер trg_subscriptions_terminal_guard (функция subscriptions_terminal_guard) запрещает менять статус
    абонемента из expired или closed_duplicate на любой другой. CHECK ck_subscriptions_closed требует,
