    прибавляет его сумму к invoices.paid_total. record_payment перечитывает paid_total, и если счёт оплачен
    полностью (paid_total >= amount), ставит ему статус paid и публикует subscriptions.payment_completed.
    Частичная оплата оставляет счёт открытым, и абонемент не меняется.
