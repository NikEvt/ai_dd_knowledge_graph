- id: R-SUBSCRIPTIONS-REMIND-01
  title: Напоминание перед концом льготного периода не реализовано
  text: >
    В настройках есть GRACE_REMINDER_DAYS = 5 (напомнить об оплате за 5 дней до конца льготного периода),
    а в таблице абонементов — колонка reminded_for. Ни одна задача и ни одна функция модуля их не использует:
    держатель получает только уведомление о начале grace и о закрытии.
  kind: config
  applies_to:
  - subscription.status=grace
  trigger: symbol:services/subscriptions/jobs.py::expire_overdue
  roles:
  - system
  related:
  - R-SUBSCRIPTIONS-GRACE-01
  - R-SUBSCRIPTIONS-NOTICE-01
  status: draft
- id: R-SUBSCRIPTIONS-API-01
  title: API абонементов не проверяет роль и личность вызывающего
  text: >
    Маршруты модуля (GET /plans, POST /subscriptions, GET /subscriptions/{id}, GET /clients/{client_ref}/subscriptions,
    PUT /subscriptions/{id}/holder, POST /invoices/{id}/payments) зависят только от сессии БД (libs/web.py::session).
    Проверки ролей нет: любой вызывающий может просмотреть абонементы любого клиента и провести платёж
    по любому счёту. Владельца проверяет только update_holder — по client_ref из тела запроса.
  kind: permission
  applies_to:
