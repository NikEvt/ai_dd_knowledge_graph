- id: R-SCHED-VENUE-CHANGE-01
  title: Смена площадки отменяет запись и выдаёт новую ссылку
  text: >
    На application.venue_changed модуль сбрасывает записи (reason=venue_changed: письмо об отмене, освобождение
    книг, гашение ссылок). Если заявка на этапе awaiting_issue, выпускается новая ссылка purpose=issue.
    Проверяющий оператор новой площадки назначается в applications.change_venue.
  kind: effect
