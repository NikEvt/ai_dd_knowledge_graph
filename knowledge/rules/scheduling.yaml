- id: R-SCHED-CANCEL-01
  title: Отмена записи — письмо об отмене и событие в чате
  text: >
    Любая отмена (клиентом, оператором, удалением окна, неявкой, сбросом) идёт через _cancel. Статус записи
    становится no_show при причине no_show, иначе cancelled. Публикуется booking.cancelled с причиной:
    notifications отправляет письмо типа cancel, chat пишет «Запись на … отменена (reason)».
