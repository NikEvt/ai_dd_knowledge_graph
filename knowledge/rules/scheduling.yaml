  - symbol:services/billing/consumers.py::on_loan_overdue
  - symbol:services/chat/consumers.py::_handler
  roles:
  - system
  related:
  - R-SCHED-ISSUE-02
  - R-SCHED-FINE-01
  implemented_by:
