# Правила модуля scheduling: извлечены LLM (tools/knowledge/bootstrap_rules.sh) из кода и среза графа.
# Статус verified ставит только человек. Хэши обновляет tools/knowledge/drift.py --write.
rules:
- id: R-SCHED-SITE-CHECKER-01
  title: Проверяющий оператор работает только со своей площадкой
  text: >
    Создать окно, уменьшить в нём число мест, убрать окно и отметить неявку может только проверяющий оператор
    площадки окна (venue.site_checker_id). Иначе — AccessDenied «проверяющий оператор работает только
    со своей площадкой». Проверка общая, в _require_site_checker.
  kind: permission
  applies_to:
  - table:scheduling.slots
  trigger: symbol:services/scheduling/service.py::_require_site_checker
  roles:
  - site_checker
  related:
  - R-SCHED-SLOT-01
  - R-SCHED-SLOT-04
  - R-SCHED-SLOT-05
  - R-SCHED-NO-SHOW-01
  implemented_by:
  - symbol: services/scheduling/service.py::_require_site_checker
    lines: 17-20
    hash: 627195aa6f4e
  - symbol: services/scheduling/service.py::create_slot
    lines: '32'
    hash: 1f95c51ca4d1
  - symbol: services/scheduling/service.py::reduce_capacity
    lines: '56'
    hash: b4f9930f0a3c
  - symbol: services/scheduling/service.py::remove_slot
    lines: '70'
    hash: 4fd12aa7b697
  - symbol: services/scheduling/service.py::mark_no_show
    lines: '218'
    hash: 7d0ed8f66900
  satisfies:
  - requirement: REQ-ROLE-09
    hash: b4d0725655b8
  - requirement: REQ-SLOT-01
    hash: a9a4afb94218
  status: draft
- id: R-SCHED-SLOT-01
  title: Нельзя создать окно на прошедшее время
  text: >
    При создании окна время начала должно быть строго позже текущего (clock.now()), иначе DomainError
    «нельзя создать окно на прошедшее время».
  kind: guard
  applies_to:
  - table:scheduling.slots
  trigger: symbol:services/scheduling/service.py::create_slot
  roles:
  - site_checker
  related:
  - R-SCHED-SITE-CHECKER-01
  implemented_by:
  - symbol: services/scheduling/service.py::create_slot
    lines: 33-34
    hash: 1f95c51ca4d1
  tested_by:
  - tests/test_scheduling.py::test_slot_in_past_forbidden
  satisfies:
  - requirement: REQ-SLOT-02
    hash: 269831511de5
  status: draft
- id: R-SCHED-SLOT-02
  title: По умолчанию в окне столько мест, сколько максимум площадки
  text: >
    Если при создании окна число мест не передано, берётся max_capacity площадки из реплики scheduling.venue_limits.
    Если лимит для площадки не задан — DomainError «для площадки не задан максимум мест». Окна создаются
    по паре площадка+сфера, без признака цели (выдача/сдача).
  kind: calculation
  applies_to:
  - table:scheduling.slots
  - table:scheduling.venue_limits
  trigger: symbol:services/scheduling/service.py::create_slot
  effects:
  - 'writes: table:scheduling.slots'
  roles:
  - site_checker
  related:
  - R-SCHED-SLOT-03
  - R-SCHED-VENUE-LIMIT-01
  implemented_by:
  - symbol: services/scheduling/service.py::create_slot
    lines: 35-41
    hash: 1f95c51ca4d1
  enforced_by_db:
  - constraint: trg_slot_capacity_limit
    hash: 9474bb1e6464
  tested_by:
  - tests/test_scheduling.py::test_checker_can_only_reduce_capacity
  satisfies:
  - requirement: REQ-SLOT-03
    hash: b74ef714474a
  status: draft
- id: R-SCHED-SLOT-03
  title: Число мест в окне не больше максимума площадки (контроль в БД)
  text: >
    Триггер trg_slot_capacity_limit (функция check_slot_capacity) на INSERT и UPDATE OF capacity таблицы
    scheduling.slots отклоняет запись, если для площадки нет строки в venue_limits («no capacity limit
    for venue») или capacity больше max_capacity («slot capacity exceeds venue maximum»). В коде create_slot
    явно переданное число мест с максимумом не сверяется, так что ограничение держит только БД. CHECK
    slots_capacity_check требует capacity > 0.
  kind: invariant
  applies_to:
  - table:scheduling.slots
  trigger: table:scheduling.slots
  roles:
  - site_checker
  related:
  - R-SCHED-SLOT-02
  - R-SCHED-VENUE-LIMIT-01
  implemented_by:
  - symbol: services/scheduling/service.py::create_slot
    lines: 40-42
    hash: 1f95c51ca4d1
  enforced_by_db:
  - constraint: trg_slot_capacity_limit
    hash: 9474bb1e6464
  - constraint: check_slot_capacity
    hash: 5e5e1eec500d
  - constraint: slots_capacity_check
    hash: f197e4338295
  tested_by:
  - tests/test_scheduling.py::test_slot_capacity_cannot_exceed_venue_maximum
  satisfies:
  - requirement: REQ-SLOT-03
    hash: b74ef714474a
  status: draft
- id: R-SCHED-SLOT-04
  title: Проверяющий оператор может только уменьшить число мест в окне
  text: >
    reduce_capacity принимает только значение строго меньше текущего capacity окна («проверяющий оператор
    может только уменьшить число мест») и не меньше числа действующих записей в окне («в окне уже записано
    больше клиентов»). Действующие записи — bookings со статусом active.
  kind: guard
  applies_to:
  - table:scheduling.slots
  trigger: symbol:services/scheduling/service.py::reduce_capacity
  effects:
  - 'writes: table:scheduling.slots'
  roles:
  - site_checker
  related:
  - R-SCHED-SITE-CHECKER-01
  - R-SCHED-SLOT-03
  implemented_by:
  - symbol: services/scheduling/service.py::reduce_capacity
    lines: 57-61
    hash: b4f9930f0a3c
  - symbol: services/scheduling/service.py::_active_bookings
    lines: 46-49
    hash: aa8e00301e30
  enforced_by_db:
  - constraint: trg_slot_capacity_limit
    hash: 9474bb1e6464
  - constraint: slots_capacity_check
    hash: f197e4338295
  tested_by:
  - tests/test_scheduling.py::test_checker_can_only_reduce_capacity
  satisfies:
  - requirement: REQ-SLOT-03
    hash: b74ef714474a
  status: draft
- id: R-SCHED-SLOT-05
  title: Удаление окна отменяет записи на него
  text: >
    Окно удаляется мягко (slots.removed = true). Сначала все действующие записи на окно отменяются с причиной
    slot_removed, на каждую публикуется booking.cancelled. Из-за этого клиент и представитель получают
    письмо об отмене, в чат заявки пишется событие. Закреплённые книги и ссылка на запись остаются.
  kind: effect
  applies_to:
  - table:scheduling.slots
  - table:scheduling.bookings
  trigger: symbol:services/scheduling/service.py::remove_slot
  effects:
  - 'writes: table:scheduling.slots'
  - event:booking.cancelled
  roles:
  - site_checker
  related:
  - R-SCHED-CANCEL-01
  - R-SCHED-SITE-CHECKER-01
  implemented_by:
  - symbol: services/scheduling/service.py::remove_slot
    lines: 71-76
    hash: 4fd12aa7b697
  - symbol: services/scheduling/service.py::_cancel
    lines: 178-190
    hash: 6120ee8baf20
  satisfies:
  - requirement: REQ-SLOT-04
    hash: 4e9d5f940703
  status: draft
- id: R-SCHED-VENUE-LIMIT-01
  title: Максимум мест площадки реплицируется из админки событием
  text: >
    Подписчик venue.settings_changed (публикует admin.set_venue_max_capacity) создаёт или обновляет строку
    scheduling.venue_limits с новым max_capacity. Уже созданные окна не пересчитываются: триггер срабатывает
    только на INSERT или изменение capacity, поэтому после снижения максимума окна со старым, большим
    числом мест остаются. CHECK требует max_capacity > 0.
  kind: effect
  applies_to:
  - table:scheduling.venue_limits
  trigger: event:venue.settings_changed
  effects:
  - 'writes: table:scheduling.venue_limits'
  roles:
  - admin
  related:
  - R-SCHED-SLOT-02
  - R-SCHED-SLOT-03
  implemented_by:
  - symbol: services/scheduling/consumers.py::on_venue_settings_changed
    lines: 35-40
    hash: 37def55ecd07
  enforced_by_db:
  - constraint: venue_limits_max_capacity_check
    hash: 3a9484826b99
  satisfies:
  - requirement: REQ-SLOT-03
    hash: b74ef714474a
  status: draft
- id: R-SCHED-LINK-01
  title: Ссылка на запись за книгами выдаётся при готовности к записи
  text: >
    На событие application.ready_for_booking (публикует mark_ready_for_booking при переходе в «Ожидает
    выдачи»: после проверки для debt/social, после полной оплаты для paid) модуль выпускает ссылку с purpose=issue.
  kind: effect
  applies_to:
  - table:scheduling.booking_links
  trigger: event:application.ready_for_booking
  effects:
  - 'writes: table:scheduling.booking_links'
  roles:
