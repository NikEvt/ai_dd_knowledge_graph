- id: R-SCHED-CANCEL-02
  title: Клиент и представитель не отменяют визит менее чем за два дня
  text: >
    Отменить можно только действующую запись («запись не действует»). Если отменяет сторона клиента (CLIENT_SIDE
    = client, representative) и до начала окна меньше CLIENT_RESCHEDULE_MIN_DAYS суток (считается разница
    во времени, а не календарные даты) — DomainError «менее чем за два дня перенести или отменить визит
    может только оператор». Для остальных значений by ограничения нет.
  kind: guard
  applies_to:
  - table:scheduling.bookings
  trigger: symbol:services/scheduling/api.py::cancel
  roles:
  - client
  - representative
  - operator
  related:
  - R-SCHED-RESCHEDULE-01
  - R-SCHED-BOOK-03
  implemented_by:
  - symbol: services/scheduling/service.py::cancel_booking
    lines: 195-203
    hash: 3cd89e5dcd70
  - symbol: services/scheduling/api.py::cancel
    lines: 41-42
    hash: 46d6ab9688c5
  config:
  - libs/settings.py::CLIENT_RESCHEDULE_MIN_DAYS
  - services/scheduling/service.py::CLIENT_SIDE
  tested_by:
  - tests/test_scheduling.py::test_client_cannot_cancel_less_than_two_days_before
  deviates_from:
  - requirement: REQ-BOOK-04
    note: >
      Схема: менее чем за два дня отменить или перенести визит может только оператор. Код: роль определяется
      параметром by из запроса DELETE /bookings/{booking_id}?by=..., без проверки, кто вызывает. Любой,
      передав by=operator, обходит ограничение, и личность оператора не сверяется. Текст ошибки «за два
      дня» зашит в строку и не зависит от настройки.
  status: draft
- id: R-SCHED-RESCHEDULE-01
  title: Перенос — это отмена и новая запись
  text: >
    reschedule отменяет текущую запись через cancel_booking (с проверкой двух дней для стороны клиента)
    и записывает на новое окно по действующей ссылке заявки, с тем же booked_by. Уходят два письма: об
    отмене и о новой записи. Отдельного события переноса нет.
  kind: effect
  applies_to:
