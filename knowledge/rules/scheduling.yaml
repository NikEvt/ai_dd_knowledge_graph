- id: R-SCHED-ISSUE-01
  title: Выдача книг — только по записи, на этапе «Ожидает выдачи», в выбранную дату
  text: >
    issue_books требует действующую запись с purpose=issue («нет действующей записи за книгами»). Выдаёт
    проверяющий оператор площадки заявки («книги выдаёт проверяющий оператор площадки заявки»). Заявка
    должна быть на этапе awaiting_issue («выдача возможна только на этапе «Ожидает выдачи»»), а дата окна
    — совпадать с текущей датой («выдача только в выбранную дату»).
