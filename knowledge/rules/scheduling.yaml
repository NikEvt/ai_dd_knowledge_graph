- id: R-SCHED-RETURN-01
  title: Возврат и утерю отмечает проверяющий оператор площадки заявки по каждой книге
  text: >
    Возврат и утеря отмечаются по отдельной выдаче. Это может только проверяющий оператор площадки заявки
    («книги принимает проверяющий оператор площадки заявки») и только для выдачи в статусе out («книга
    уже возвращена или списана»). Возврат ставит status=returned, returned_at и флаг damaged; утеря ставит
    status=lost.
