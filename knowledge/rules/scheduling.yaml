  satisfies:
  - requirement: REQ-SLOT-05
    hash: 32a37899f44d
  status: draft
- id: R-SCHED-BOOK-01
  title: Запись только в своё, будущее и не заполненное окно
  text: >
    book отклоняет удалённое окно (NotFound), окно другой площадки или сферы («окно не на площадке или
    не в сфере заявки»), окно в прошлом («нельзя записаться на прошедшее время») и окно, где действующих
    записей уже не меньше capacity («в окне нет свободных мест»).
  kind: guard
  applies_to:
  - table:scheduling.bookings
  trigger: symbol:services/scheduling/service.py::book
  roles:
  - client
  - representative
  - operator
  related:
  - R-SCHED-FREE-SLOTS-01
  - R-SCHED-BOOK-02
  implemented_by:
  - symbol: services/scheduling/service.py::book
    lines: 130-137
    hash: e0cce5e125eb
  tested_by:
  - tests/test_scheduling.py::test_booking_only_on_own_venue_and_sphere
  satisfies:
  - requirement: REQ-BOOK-03
    hash: 87cb26754bb3
  caveats:
  - >
    Число свободных мест проверяется подсчётом в коде без блокировки. При параллельных записях окно можно
    переполнить: в БД нет ограничения на число записей в окне.
  status: draft
- id: R-SCHED-BOOK-02
  title: У заявки не больше одной действующей записи
  text: >
    Частичный уникальный индекс uq_bookings_one_active не даёт создать вторую запись со статусом active
    на ту же заявку. В коде book такой проверки нет: повторная запись упадёт на ошибке целостности БД,
    а не на DomainError. Перенос сначала отменяет старую запись.
  kind: invariant
  applies_to:
  - table:scheduling.bookings
  trigger: symbol:services/scheduling/service.py::book
  roles:
  - client
  - representative
  - operator
  related:
  - R-SCHED-RESCHEDULE-01
  implemented_by:
  - symbol: services/scheduling/service.py::book
    lines: 139-151
    hash: e0cce5e125eb
  enforced_by_db:
  - constraint: uq_bookings_one_active
    hash: 2956cac5345f
  - constraint: bookings_status_check
    hash: 9e9bc99257e7
  - constraint: bookings_purpose_check
    hash: 9c2bb924dd5d
  status: draft
- id: R-SCHED-BOOK-03
  title: Цель записи берётся из ссылки, кто записал — из запроса
  text: >
    У записи purpose берётся из ссылки (issue или return), booked_by — из тела запроса (по умолчанию client).
    CHECK bookings_booked_by_check допускает только client, representative, operator.
  kind: invariant
  applies_to:
  - table:scheduling.bookings
  trigger: symbol:services/scheduling/api.py::book
  effects:
  - 'writes: table:scheduling.bookings'
  roles:
  - client
  - representative
  related:
  - R-SCHED-CANCEL-02
  implemented_by:
  - symbol: services/scheduling/service.py::book
    lines: 139-147
    hash: e0cce5e125eb
  - symbol: services/scheduling/api.py::book
    lines: 35-37
    hash: 462831f5d7ab
  enforced_by_db:
  - constraint: bookings_booked_by_check
    hash: 0d38bf98b5fc
  deviates_from:
  - requirement: REQ-BOOK-02
    note: >
      Схема: оператор записывает в системе, клиент и представитель — по ссылке. Код: публичный эндпоинт
      POST /links/{token}/bookings принимает booked_by=operator от кого угодно с токеном.
  status: draft
- id: R-SCHED-HOLD-01
  title: Книги закрепляются за заявкой при записи за книгами
  text: >
    При записи с purpose=issue каждая книга заявки (brief.book_ids) записывается в scheduling.holds через
    merge, поэтому повторная запись не создаёт дублей (PK application_id+book_id). Запись на сдачу (return)
    книги не закрепляет.
  kind: effect
  applies_to:
  - table:scheduling.holds
  trigger: symbol:services/scheduling/service.py::book
  effects:
  - 'writes: table:scheduling.holds'
  roles:
  - client
  - representative
  - operator
  related:
  - R-SCHED-HOLD-02
  - R-SCHED-RESET-01
  implemented_by:
  - symbol: services/scheduling/service.py::book
    lines: 148-150
    hash: e0cce5e125eb
  satisfies:
  - requirement: REQ-SPHERE-03
    hash: a0a4d629eb78
  status: draft
- id: R-SCHED-HOLD-02
  title: Отмена, перенос и неявка не освобождают книги
  text: >
    _cancel меняет только статус записи и публикует событие, scheduling.holds не трогает. Книги освобождаются
    только в reset_bookings (смена площадки, архив, дубль) и при выдаче.
  kind: invariant
  applies_to:
  - table:scheduling.holds
  trigger: symbol:services/scheduling/service.py::_cancel
  roles:
  - client
  - representative
  - operator
  - site_checker
  related:
  - R-SCHED-HOLD-01
  - R-SCHED-ISSUE-03
  implemented_by:
  - symbol: services/scheduling/service.py::_cancel
    lines: 178-190
    hash: 6120ee8baf20
  satisfies:
  - requirement: REQ-SPHERE-03
    hash: a0a4d629eb78
  status: draft
- id: R-SCHED-BOOK-EVENT-01
  title: Запись на визит — письмо клиенту и представителю, событие в чате
  text: >
    После записи публикуется booking.created (application_id, booking_id, venue_id, starts_at, purpose).
    Подписчик notifications отправляет письмо типа booking получателям заявки по шаблону площадки и группы
    вида заявки. Обработчик chat пишет в чат «Запись на {starts_at}».
  kind: effect
  applies_to:
  - table:scheduling.bookings
  trigger: symbol:services/scheduling/service.py::book
  effects:
  - event:booking.created
  - symbol:services/notifications/consumers.py::on_booking_created
  - symbol:services/chat/consumers.py::_handler
  roles:
  - client
  - representative
  - operator
  related:
  - R-SCHED-CANCEL-01
  implemented_by:
  - symbol: services/scheduling/service.py::book
    lines: 152-162
    hash: e0cce5e125eb
  - symbol: services/notifications/consumers.py::on_booking_created
    lines: 10-17
    hash: b765a21d3fc7
  - symbol: services/chat/consumers.py::_handler
    lines: 23-27
    hash: f46c9b143853
  tested_by:
