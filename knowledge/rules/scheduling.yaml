      Срок просрочки зашит литералом timedelta(days=30), а не берётся из LOAN_PERIOD_DAYS или loans.due_at.
      Если настройку изменить, due_at и момент начисления штрафа разойдутся. Схема: «месяц с выдачи»,
      а не фиксированные 30 дней. Книга, возвращённая с опозданием до запуска задачи, штраф не получает.
  status: draft
