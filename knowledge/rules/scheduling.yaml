- id: R-SCHED-NO-SHOW-01
  title: Неявка отменяет запись, клиент может записаться снова
  text: >
    Проверяющий оператор площадки окна отмечает неявку по действующей записи: статус no_show, публикуется
    booking.cancelled с reason=no_show (письмо об отмене, событие в чате). Ссылка и закреплённые книги
    остаются, этап заявки не меняется, клиент может записаться снова.
  kind: effect
