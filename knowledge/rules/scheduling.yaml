  title: Срок возврата — LOAN_PERIOD_DAYS от момента выдачи
  text: >
    На каждую книгу заявки создаётся выдача (loan) со статусом out, issued_at = now и due_at = now + LOAN_PERIOD_DAYS
    (30) дней.
