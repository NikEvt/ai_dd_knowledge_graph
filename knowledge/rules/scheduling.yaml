- id: R-SCHED-OVERDUE-01
  title: Фоновая задача отмечает просрочку через 30 дней с выдачи и создаёт штраф
  text: >
    flag_overdue выбирает выдачи со статусом out без флага overdue_flagged, у которых issued_at < now
    - 30 дней. Каждой ставится overdue_flagged=true (один раз) и публикуется loan.overdue: billing создаёт
    штраф overdue, chat пишет «Срыв срока возврата книги {book_id}». Срок задан литералом 30, а не настройкой
    LOAN_PERIOD_DAYS, и считается от issued_at, а не от due_at.
  kind: timer
