  title: После выдачи — запись выполнена, книги откреплены, ссылка на сдачу, этап «Книги у клиента»
  text: >
    После выдачи запись получает статус done, все holds заявки удаляются и выпускается новая ссылка с
    purpose=return (прежняя гаснет). Публикуется books.issued: подписчик applications переводит заявку
