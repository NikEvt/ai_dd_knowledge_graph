    hash: 036fc6e3e9dd
  status: draft
- id: R-SCHED-LINK-02
  title: У заявки только одна действующая ссылка
  text: >
    issue_link гасит все прежние ссылки заявки (active=false) и создаёт новую со случайным токеном (secrets.token_urlsafe(16)).
    БД гарантирует уникальность токена и не больше одной активной ссылки на заявку. purpose ограничен
    значениями issue/return.
  kind: invariant
  applies_to:
  - table:scheduling.booking_links
  trigger: symbol:services/scheduling/service.py::issue_link
  effects:
  - 'writes: table:scheduling.booking_links'
  roles:
  - system
  related:
  - R-SCHED-LINK-01
  - R-SCHED-LINK-03
  implemented_by:
  - symbol: services/scheduling/service.py::issue_link
    lines: 79-86
    hash: f6a14a335442
  enforced_by_db:
  - constraint: uq_booking_links_one_active
    hash: 0d868e7a0638
  - constraint: booking_links_token_key
    hash: a8420b878df4
  - constraint: booking_links_purpose_check
    hash: 9c2bb924dd5d
  status: draft
- id: R-SCHED-LINK-03
  title: Неактивная ссылка не даёт ни смотреть окна, ни записываться
  text: >
    Просмотр свободных окон и запись по токену требуют существующую активную ссылку. Иначе — DomainError
    «ссылка на запись не действует». Ссылка гаснет при архивации, закрытии дублем, смене площадки и выпуске
    новой ссылки.
  kind: guard
  applies_to:
  - table:scheduling.booking_links
  trigger: symbol:services/scheduling/service.py::_link_by_token
  roles:
  - client
  - representative
  - operator
  related:
  - R-SCHED-RESET-01
  - R-SCHED-LINK-02
  implemented_by:
  - symbol: services/scheduling/service.py::_link_by_token
    lines: 95-99
    hash: f72f2a1be4fe
  deviates_from:
  - requirement: REQ-BOOK-07
    note: >
      Схема: по закрытой заявке ссылка не работает. Код: на закрытие заявки (books_out->closed) модуль
      не подписан, ссылка на сдачу (purpose=return) после закрытия остаётся активной.
  status: draft
- id: R-SCHED-FREE-SLOTS-01
  title: По ссылке видны только будущие свободные окна площадки и сферы заявки
  text: >
    free_slots возвращает окна площадки и сферы заявки, кроме удалённых, только с началом позже текущего
    момента и где действующих записей меньше capacity. Список отсортирован по времени.
  kind: guard
  applies_to:
  - table:scheduling.slots
  trigger: symbol:services/scheduling/api.py::slots
  roles:
  - client
  - representative
  related:
  - R-SCHED-BOOK-01
  implemented_by:
  - symbol: services/scheduling/service.py::free_slots
    lines: 102-123
    hash: dce191255caf
  - symbol: services/scheduling/api.py::slots
    lines: 27-31
    hash: bd5b1d3cdea7
  tested_by:
