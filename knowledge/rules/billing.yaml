# Правила модуля billing: извлечены LLM (tools/knowledge/bootstrap_rules.sh) из кода и среза графа.
# Статус verified ставит только человек. Хэши обновляет tools/knowledge/drift.py --write.
rules:
- id: R-BILL-ASSIGN-01
  title: Бухгалтер сам закрепляет заявку за собой и может забрать её у коллеги
  text: >
    take_application создаёт запись в billing.accountant_assignments, а если запись уже есть, перезаписывает
    accountant_id. У заявки всегда не больше одного бухгалтера (PK по application_id), согласие предыдущего
    бухгалтера не нужно.
  kind: permission
  applies_to:
  - application.kind=paid
  - application.kind=social
  trigger: symbol:services/billing/service.py::take_application
  effects:
  - 'writes: table:billing.accountant_assignments'
  roles:
  - accountant
  related:
  - R-BILL-ASSIGN-02
  - R-BILL-ASSIGN-03
  implemented_by:
  - symbol: services/billing/service.py::take_application
    lines: 22-26
    hash: 2bedcf98cb00
  tested_by:
  - tests/test_paid_flow.py::test_invoice_requires_assigned_accountant
  schema_ref: §3 Кто закреплён за заявкой
  discrepancy: >
    Схема: бухгалтер берёт в работу платные заявки, прошедшие проверку. Код не проверяет этап и роль:
    заявку можно взять на любом этапе, в том числе в черновике или после закрытия.
  status: draft
- id: R-BILL-ASSIGN-02
  title: У заявки в долг нет бухгалтера
  text: >
    take_application отклоняет закрепление бухгалтера за заявкой вида debt с ошибкой «у заявки в долг
    нет бухгалтера».
  kind: guard
  applies_to:
  - application.kind=debt
  trigger: symbol:services/billing/service.py::take_application
  roles:
  - accountant
  related:
  - R-BILL-ASSIGN-01
  - R-BILL-FINE-INVOICE-02
  implemented_by:
  - symbol: services/billing/service.py::take_application
    lines: 19-21
    hash: 2bedcf98cb00
  tested_by:
  - tests/test_kinds.py::test_debt_application_skips_invoice
  schema_ref: §3 Кто закреплён за заявкой
  status: draft
- id: R-BILL-ASSIGN-03
  title: Счёт выставляет только бухгалтер, закреплённый за заявкой
  text: >
    Перед выставлением счёта за книги или за штраф _require_accountant проверяет, что за заявкой закреплён
    именно этот бухгалтер. Иначе AccessDenied «заявка закреплена за другим бухгалтером». Если бухгалтер
    не закреплён совсем, ошибка та же.
  kind: permission
  applies_to:
  - application.kind=paid
  - application.kind=social
  trigger: symbol:services/billing/service.py::issue_books_invoice
  roles:
  - accountant
  related:
  - R-BILL-ASSIGN-01
  - R-BILL-INVOICE-01
  - R-BILL-FINE-INVOICE-01
  implemented_by:
  - symbol: services/billing/service.py::_require_accountant
    lines: 29-32
    hash: 8155d096ddc1
  - symbol: services/billing/service.py::issue_books_invoice
    lines: 36-36
    hash: 6b065a90a3fe
  - symbol: services/billing/service.py::issue_fine_invoice
    lines: 184-184
    hash: dc16f34adba2
  tested_by:
  - tests/test_paid_flow.py::test_invoice_requires_assigned_accountant
  schema_ref: §11 Счета и платежи
  status: draft
- id: R-BILL-ASSIGN-04
  title: Закреплённый бухгалтер — участник чата заявки
  text: >
    public.accountant_of возвращает бухгалтера, закреплённого за заявкой. Через него чат (services/chat/service.py::participants)
    включает бухгалтера в участники. Когда заявку забирает другой бухгалтер, в чат попадает новый.
  kind: effect
  trigger: symbol:services/chat/service.py::participants
  effects:
  - 'reads: table:billing.accountant_assignments'
  roles:
  - accountant
  related:
  - R-BILL-ASSIGN-01
  implemented_by:
  - symbol: services/billing/public.py::accountant_of
    lines: 48-50
    hash: d0ed4673ab0b
  schema_ref: §15 Чат заявки
  status: draft
- id: R-BILL-INVOICE-01
  title: Счёт за книги выставляется только по платной заявке
  text: >
    issue_books_invoice отклоняет заявки, вид которых не paid, с ошибкой «счёт за книги выставляется только
    по платной заявке». По социальным заявкам и заявкам в долг счёт за книги не создаётся.
  kind: guard
  applies_to:
  - application.kind=paid
  trigger: symbol:services/billing/service.py::issue_books_invoice
  roles:
  - accountant
  related:
  - R-BILL-INVOICE-02
  implemented_by:
  - symbol: services/billing/service.py::issue_books_invoice
    lines: 37-39
    hash: 6b065a90a3fe
  tested_by:
  - tests/test_kinds.py::test_no_books_invoice_for_social
  schema_ref: §11 Счета и платежи
  status: draft
- id: R-BILL-INVOICE-02
  title: Счёт за книги выставляется только на этапе «Ожидает счёта»
  text: >
    issue_books_invoice требует этап awaiting_invoice. Иначе ошибка «счёт выставляется после прохождения
    проверки». Поэтому по заявке в «Ожидает оплаты» второй счёт не выставить.
  kind: guard
  applies_to:
  - application.kind=paid
  trigger: symbol:services/billing/service.py::issue_books_invoice
  roles:
  - accountant
  related:
  - R-BILL-INVOICE-01
  - R-BILL-INVOICE-06
  implemented_by:
  - symbol: services/billing/service.py::issue_books_invoice
    lines: 40-41
    hash: 6b065a90a3fe
  tested_by:
  - tests/test_paid_flow.py::test_paid_application_full_path
  schema_ref: §11 Счета и платежи
  status: draft
- id: R-BILL-INVOICE-03
  title: Без реквизитов организации площадки счёт не выставить
  text: >
    Счёт за книги и счёт на штраф выставляются, только если у площадки заявки заполнены реквизиты. Иначе
    ошибка «у площадки не заполнены реквизиты организации».
  kind: guard
  trigger: symbol:services/billing/service.py::issue_books_invoice
  roles:
  - accountant
  related:
  - R-BILL-INVOICE-05
  implemented_by:
  - symbol: services/billing/service.py::issue_books_invoice
    lines: 42-44
    hash: 6b065a90a3fe
  - symbol: services/billing/service.py::issue_fine_invoice
    lines: 185-187
    hash: dc16f34adba2
  tested_by:
  - tests/test_paid_flow.py::test_invoice_requires_venue_requisites
  schema_ref: §11 Счета и платежи
  status: draft
- id: R-BILL-INVOICE-04
  title: Сумма счёта за книги = цена по прайсу площадки + надбавка представителя
  text: >
    Сумма считается как books_price × (1 + markup_pct / 100) и округляется до копейки (CENT = 0.01, ROUND_HALF_UP).
    Цену по прайсу площадки даёт applications.books_price, процент надбавки представителя — applications.markup_pct.
    После выставления сумма зафиксирована: код, меняющий сумму счёта, отсутствует.
  kind: calculation
  applies_to:
  - application.kind=paid
  trigger: symbol:services/billing/service.py::issue_books_invoice
  effects:
  - 'writes: table:billing.invoices'
  roles:
  - accountant
  related:
  - R-BILL-INVOICE-05
  implemented_by:
  - symbol: services/billing/service.py::issue_books_invoice
    lines: 46-48
    hash: 6b065a90a3fe
  enforced_by_db:
  - constraint: invoices_amount_check
    hash: 5ddec6c010bb
  config:
  - services/billing/service.py::CENT
  tested_by:
  - tests/test_paid_flow.py::test_paid_application_full_path
  schema_ref: §10 Надбавка представителя
  status: draft
- id: R-BILL-INVOICE-05
  title: Счёт сохраняет площадку и снимок её реквизитов
  text: >
    При выставлении счёта (за книги или штраф) в нём сохраняются venue_id и копия реквизитов площадки
    на этот момент (jsonb). Если реквизиты площадки потом изменятся, выставленный счёт останется прежним.
    При выставлении issued_at и payment_clock_started_at равны текущему времени.
  kind: invariant
  trigger: symbol:services/billing/service.py::issue_books_invoice
  effects:
  - 'writes: table:billing.invoices'
  roles:
  - accountant
  related:
  - R-BILL-INVOICE-03
  - R-BILL-ARCHIVE-01
  implemented_by:
  - symbol: services/billing/service.py::issue_books_invoice
    lines: 49-60
    hash: 6b065a90a3fe
  - symbol: services/billing/service.py::issue_fine_invoice
    lines: 188-200
    hash: dc16f34adba2
  schema_ref: §7 Площадки и цены
  status: draft
- id: R-BILL-INVOICE-06
  title: У заявки не больше одного действующего счёта за книги
  text: >
    Частичный уникальный индекс uq_invoices_one_active_books разрешает только один счёт kind='books' со
    status='active' на заявку. Число счетов на штрафы не ограничено. В коде отдельной проверки нет: её
    косвенно заменяет требование этапа awaiting_invoice.
  kind: invariant
  applies_to:
  - application.kind=paid
  trigger: table:billing.invoices
  roles:
  - system
  related:
  - R-BILL-INVOICE-02
  implemented_by:
  - symbol: services/billing/public.py::active_books_invoice
    lines: 31-45
    hash: ec804ecd1ad5
  enforced_by_db:
  - constraint: uq_invoices_one_active_books
    hash: 2eaaafd4ba47
  tested_by:
  - tests/test_venue_change.py::test_venue_change_before_payment_reissues_invoice
  schema_ref: §11 Счета и платежи
  status: draft
- id: R-BILL-INVOICE-07
  title: Вид счёта — books или fine; счёт на штраф ссылается на штраф
  text: >
    CHECK invoices_kind_check разрешает только виды books и fine, invoices_status_check — только статусы
    active и cancelled. invoices_check требует, чтобы fine_id был заполнен тогда и только тогда, когда
    kind='fine'. Сумма счёта строго больше нуля (invoices_amount_check), поэтому штраф нулевого размера
    выставить счётом нельзя.
  kind: invariant
  trigger: table:billing.invoices
  roles:
  - system
  related:
  - R-BILL-FINE-03
  enforced_by_db:
  - constraint: invoices_kind_check
    hash: 794604a879e0
  - constraint: invoices_status_check
    hash: f76357101dff
  - constraint: invoices_check
    hash: cf426f874f56
  - constraint: invoices_amount_check
    hash: 5ddec6c010bb
  status: draft
- id: R-BILL-INVOICE-08
  title: Выставление счёта за книги переводит заявку в «Ожидает оплаты»
  text: >
    issue_books_invoice публикует invoice.issued. Подписчик applications on_invoice_issued для счёта вида
    books переводит заявку из awaiting_invoice в awaiting_payment от имени бухгалтера. Счёт на штраф этап
    не меняет.
  kind: effect
  applies_to:
  - application.kind=paid
  trigger: event:invoice.issued
  effects:
  - transition:awaiting_invoice->awaiting_payment
  - symbol:services/applications/consumers.py::on_invoice_issued
  roles:
  - accountant
  related:
  - R-BILL-INVOICE-04
  implemented_by:
  - symbol: services/billing/service.py::issue_books_invoice
    lines: 62-71
    hash: 6b065a90a3fe
  - symbol: services/applications/consumers.py::on_invoice_issued
    lines: 13-18
    hash: 5003cef36636
  - transition: awaiting_invoice->awaiting_payment
    hash: eed6b5e042e5
  tested_by:
  - tests/test_paid_flow.py::test_paid_application_full_path
  schema_ref: §4 Порядок прохождения заявки
  status: verified
  verified_at: '2026-10-23'
  verified_fingerprint: 26cde9335c11
- id: R-BILL-CANCEL-01
  title: Счёт с привязанным платежом аннулировать нельзя
  text: >
    cancel_invoice отклоняет аннулирование, если по счёту есть действующие платежи (не отвязанные и не
    возвращённые): «к счёту привязан платёж: сначала отвязать или вернуть». То же условие дублирует триггер
    trg_invoices_cancel_guard (функция forbid_cancel_paid_invoice) при переходе статуса active→cancelled.
  kind: guard
  trigger: symbol:services/billing/service.py::cancel_invoice
  roles:
  - accountant
  - system
  related:
  - R-BILL-PAYMENT-02
  - R-BILL-CANCEL-02
  implemented_by:
  - symbol: services/billing/service.py::cancel_invoice
    lines: 81-82
    hash: 09e5ee3f95bc
  enforced_by_db:
  - constraint: trg_invoices_cancel_guard
    hash: d908f6f95833
  - constraint: forbid_cancel_paid_invoice
    hash: 92060728b12b
  schema_ref: §11 Счета и платежи
  status: verified
  verified_at: '2026-10-23'
  verified_fingerprint: 968cd366fc35
- id: R-BILL-CANCEL-02
  title: Аннулирование уже аннулированного счёта ничего не делает
  text: >
    Если счёт не active, cancel_invoice молча возвращает его: событие не публикуется, причина не перезаписывается.
    При аннулировании действующего счёта сохраняются status='cancelled' и cancel_reason.
  kind: invariant
  trigger: symbol:services/billing/service.py::cancel_invoice
  effects:
  - 'writes: table:billing.invoices'
  roles:
  - system
  related:
  - R-BILL-CANCEL-01
  implemented_by:
  - symbol: services/billing/service.py::cancel_invoice
    lines: 79-84
    hash: 09e5ee3f95bc
  schema_ref: §11 Счета и платежи
  discrepancy: >
    Схема: аннулирует счёт бухгалтер, закреплённый за заявкой. Код cancel_invoice не проверяет роль и
    закрепление, причину не требует. HTTP-маршрута для него нет: вызывается только подписчиками.
  status: draft
- id: R-BILL-CANCEL-03
  title: Аннулирование счёта за книги возвращает заявку в «Ожидает счёта»
  text: >
    cancel_invoice публикует invoice.cancelled. Подписчик applications on_invoice_cancelled для счёта
    вида books переводит заявку из awaiting_payment в awaiting_invoice (actor system), и бухгалтер выставляет
    новый счёт. Аннулирование счёта на штраф этап не меняет.
  kind: effect
  applies_to:
  - application.kind=paid
  trigger: event:invoice.cancelled
  effects:
  - transition:awaiting_payment->awaiting_invoice
  - symbol:services/applications/consumers.py::on_invoice_cancelled
  roles:
  - system
  related:
  - R-BILL-VENUE-CHANGE-01
  - R-BILL-UNARCHIVE-01
  implemented_by:
  - symbol: services/billing/service.py::cancel_invoice
    lines: 85-94
    hash: 09e5ee3f95bc
  - symbol: services/applications/consumers.py::on_invoice_cancelled
    lines: 22-27
    hash: 6eb5887db165
  - transition: awaiting_payment->awaiting_invoice
    hash: 91fd7d7e8505
  tested_by:
  - tests/test_venue_change.py::test_venue_change_before_payment_reissues_invoice
  schema_ref: §4 Порядок прохождения заявки
  status: draft
- id: R-BILL-VENUE-CHANGE-01
  title: Смена площадки аннулирует неоплаченный счёт за книги
  text: >
    На событие application.venue_changed подписчик billing on_venue_changed аннулирует действующий счёт
    за книги с причиной venue_changed, если оплаченная по нему сумма равна нулю. Дальше через invoice.cancelled
    заявка возвращается в «Ожидает счёта», и бухгалтер выставляет новый счёт по прайсу и реквизитам новой
    площадки.
  kind: effect
  applies_to:
  - application.kind=paid
  trigger: event:application.venue_changed
  effects:
  - 'invalidates: table:billing.invoices'
  - event:invoice.cancelled
  - transition:awaiting_payment->awaiting_invoice
  roles:
  - operator
  related:
  - R-BILL-CANCEL-03
  - R-BILL-CANCEL-01
  implemented_by:
  - symbol: services/billing/consumers.py::on_venue_changed
    lines: 13-16
    hash: 5c9e004dfa4d
  enforced_by_db:
  - constraint: trg_invoices_cancel_guard
    hash: d908f6f95833
  tested_by:
  - tests/test_venue_change.py::test_venue_change_before_payment_reissues_invoice
  schema_ref: §7 Площадки и цены
  discrepancy: >
    Схема: после оплаты площадку меняют только через возврат платежа. Код: счёт с частичной оплатой подписчик
    не аннулирует и ошибку не поднимает. Если смена площадки прошла (запрет в applications рассчитан на
    полную оплату), счёт остаётся на реквизитах и цене старой площадки. Счета на штрафы при смене площадки
    не трогаются.
  status: draft
- id: R-BILL-DUPLICATE-01
  title: Закрытие заявки как дубля аннулирует все её неоплаченные счета
  text: >
    На событие application.closed_duplicate подписчик on_closed_duplicate проходит по всем действующим
    счетам заявки — за книги и на штрафы — и аннулирует с причиной duplicate те, по которым оплачено 0.
    Счета с частичной оплатой остаются действующими.
  kind: effect
  trigger: event:application.closed_duplicate
  effects:
  - 'invalidates: table:billing.invoices'
  - event:invoice.cancelled
  roles:
  - system
  related:
  - R-BILL-CANCEL-01
  - R-BILL-PAYMENT-04
  implemented_by:
  - symbol: services/billing/consumers.py::on_closed_duplicate
    lines: 20-23
    hash: 4b35aa862a56
  - symbol: services/billing/service.py::active_invoices
    lines: 230-237
    hash: 28364fcb32b8
  enforced_by_db:
  - constraint: trg_invoices_cancel_guard
    hash: d908f6f95833
  schema_ref: §6 Клиент и проверка данных
  discrepancy: >
    Схема: счёт заявки-дубля аннулируется. Код: частично оплаченный счёт заявки-дубля остаётся действующим,
    возврат по нему автоматически не инициируется.
  status: draft
- id: R-BILL-UNARCHIVE-01
  title: При возврате из архива счёт аннулируется, только если сумма изменилась
  text: >
    На application.unarchived подписчик on_unarchived смотрит на действующий счёт за книги. Если в событии
    amount_changed=true, счёт аннулируется с причиной amount_changed. Иначе счёт остаётся прежним, а payment_clock_started_at
    сбрасывается на текущее время: месяц на оплату считается заново с возврата из архива.
  kind: effect
  applies_to:
  - application.kind=paid
  trigger: event:application.unarchived
  effects:
  - 'invalidates: table:billing.invoices'
  - 'writes: table:billing.invoices'
  roles:
  - operator
  related:
  - R-BILL-ARCHIVE-01
  - R-BILL-PROCESS-03
  implemented_by:
  - symbol: services/billing/consumers.py::on_unarchived
    lines: 27-35
    hash: c7b68d994acf
  enforced_by_db:
  - constraint: trg_invoices_cancel_guard
    hash: d908f6f95833
  schema_ref: §5 Архив и попытки
  discrepancy: >
    Решение «сумма изменилась» принимает публикатор (флаг amount_changed), billing сумму не пересчитывает.
    Если amount_changed=true, а по счёту есть частичная оплата, cancel_invoice поднимет DomainError внутри
    обработчика события.
  status: draft
- id: R-BILL-ARCHIVE-01
  title: Неоплаченная платная заявка уходит в архив через PAYMENT_ARCHIVE_DAYS от начала отсчёта оплаты
  text: >
    Фоновая задача applications archive_stale берёт через active_books_invoice счёт заявки в awaiting_payment.
    Если счёт оплачен не полностью и payment_clock_started_at старше PAYMENT_ARCHIVE_DAYS (30 дней), заявка
    уходит в архив с отметкой unpaid. Отсчёт идёт от выставления счёта или от возврата из архива. Срок
    задан настройкой, а не литералом.
  kind: timer
  applies_to:
  - application.kind=paid
  trigger: symbol:services/applications/jobs.py::archive_stale
  effects:
  - transition:awaiting_payment->archived
  roles:
