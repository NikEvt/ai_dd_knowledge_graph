- id: R-CHAT-EVENTS-08
  title: Срыв срока возврата книги пишется в чат
  text: >
    Фоновая задача scheduling flag_overdue отмечает выданные книги (status=out), у которых с issued_at
    прошло больше 30 дней, и публикует loan.overdue. Чат записывает «Срыв срока возврата книги {book_id}».
    Срок 30 дней задан литералом timedelta(days=30) в jobs.py, а не настройкой.
  kind: timer
