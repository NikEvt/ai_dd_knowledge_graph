- id: R-CHAT-EVENTS-07
  title: Часть событий заявки в чат не попадает
  text: >
    Топиков payment.fully_paid, payment.refunded, books.issued, loan.damaged, loan.lost, application.review_passed
    и application.ready_for_booking нет в EVENT_TEXT, поэтому в чат они не пишутся. Выдача книг видна
    только через смену этапа. Отвязка платежа (unlink_payment) и назначение проверяющего или бухгалтера
    событий не публикуют и в чате тоже не отражаются.
  kind: effect
  applies_to:
  - table:chat.messages
  trigger: config:services/chat/consumers.py::EVENT_TEXT
  roles:
