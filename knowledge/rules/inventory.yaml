- id: R-INVENTORY-WRITEOFF-04
  title: Один акт списания на экземпляр с номером СП-год-id
  text: >
    write_off идемпотентен: если по экземпляру уже есть акт, возвращается он, и новый не создаётся. Номер
    акта собирается как «СП-<год>-<id экземпляра, 6 цифр>». Причина — lost, damaged или worn_out. После
    списания экземпляр получает written_off, публикуется inventory.copy_written_off. В БД: уникальные
    write_offs_copy_id_key и write_offs_act_no_key, CHECK write_offs_reason_check.
  kind: invariant
  applies_to:
  - table:inventory.write_offs
  trigger: symbol:services/inventory/service.py::write_off
