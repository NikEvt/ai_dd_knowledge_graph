  text: >
    На каждое inventory.ill_penalty_accrued подписчик on_penalty_accrued вызывает review_partner_debt.
    Если партнёр не приостановлен, а сумма неоплаченных пеней (accruing и final) больше ILL_PARTNER_DEBT_LIMIT
    (1000.00), ставится suspended=true и публикуется inventory.partner_suspended. При настройках по умолчанию
    любая утеря (компенсация 1500.00) приостанавливает партнёра.
  kind: effect
  applies_to:
  - table:inventory.partner_libraries
  trigger: event:inventory.ill_penalty_accrued
  effects:
  - table:inventory.partner_libraries
  - event:inventory.partner_suspended
  roles:
  - system
  related:
  - R-INVENTORY-PARTNER-03
  - R-INVENTORY-ILL-02
  implemented_by:
  - symbol: services/inventory/consumers.py::on_penalty_accrued
    lines: 61-63
    hash: b1801faff723
  - symbol: services/inventory/service.py::review_partner_debt
    lines: 534-539
    hash: f1d5ac1ca017
  config:
  - services/inventory/settings.py::ILL_PARTNER_DEBT_LIMIT
  tested_by:
  - tests/test_inventory_ill.py::test_loss_by_partner_charges_and_suspends
  caveats:
  - 'На inventory.partner_suspended нет подписчиков: никого не уведомляют.'
  status: draft
- id: R-INVENTORY-PARTNER-03
  title: Оплата пеней возобновляет выдачи, когда долг опускается до лимита
  text: >
    После оплаты пеней settle_penalty снимает приостановку (suspended=false) и публикует inventory.partner_resumed,
    если партнёр был приостановлен и неоплаченный долг теперь не больше ILL_PARTNER_DEBT_LIMIT.
  kind: effect
  applies_to:
  - table:inventory.partner_libraries
  trigger: symbol:services/inventory/service.py::settle_penalty
  effects:
  - table:inventory.partner_libraries
  - event:inventory.partner_resumed
  related:
  - R-INVENTORY-PARTNER-02
  - R-INVENTORY-PENALTY-07
  implemented_by:
  - symbol: services/inventory/service.py::settle_penalty
    lines: 526-530
    hash: 79c695bffd21
  config:
  - services/inventory/settings.py::ILL_PARTNER_DEBT_LIMIT
  tested_by:
  - tests/test_inventory_ill.py::test_settling_debt_resumes_partner
  caveats:
  - >
    На inventory.partner_resumed нет подписчиков. Приостановка снимается только оплатой, другого пути
    (например, вручную) нет.
  status: draft
- id: R-INVENTORY-WRITEOFF-01
  title: Утеря или порча на полке ведёт к списанию через событие
  text: >
    mark_lost и mark_damaged переводят экземпляр в lost или damaged и публикуют inventory.copy_lost или
    inventory.copy_damaged. Подписчики on_copy_lost и on_copy_damaged оформляют акт списания с причиной
    lost/damaged и автором — хранителем. Экземпляр становится written_off и выпадает из остатка.
  kind: effect
  applies_to:
  - table:inventory.copies
  - table:inventory.write_offs
  trigger: symbol:services/inventory/service.py::mark_lost
  effects:
  - event:inventory.copy_lost
  - event:inventory.copy_damaged
  - event:inventory.copy_written_off
  - table:inventory.write_offs
