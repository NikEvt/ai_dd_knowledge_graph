- id: R-INVENTORY-WRITEOFF-02
  title: Утеря, порча и списание по ветхости — только для экземпляра на полке
  text: >
    Экземпляр должен быть доступен на площадке и без открытого перемещения. Выданный по МБА — «экземпляр
    выдан по МБА, оформите утерю или возврат по выдаче». В другом состоянии, кроме available, — «экземпляр
    уже выбыл из фонда или находится в пути». С открытым перемещением — «по экземпляру оформлено перемещение».
  kind: guard
  applies_to:
  - table:inventory.copies
  trigger: symbol:services/inventory/service.py::_on_shelf
