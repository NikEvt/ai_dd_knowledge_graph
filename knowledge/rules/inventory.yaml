# Правила модуля inventory: извлечены LLM (tools/knowledge/bootstrap_rules.sh) из кода и среза графа.
# Статус verified ставит только человек. Хэши обновляет tools/knowledge/drift.py --write.
rules:
- id: R-INVENTORY-CUSTODIAN-01
  title: Операции с фондом площадки выполняет только её хранитель
  text: >
    Регистрация экземпляра, выдача и продление по МБА, приём возврата, утеря, порча, списание по ветхости
    и исправление места хранения доступны только сотруднику, записанному хранителем фонда нужной площадки
    (inventory.custodians). Иначе AccessDenied «сотрудник не является хранителем фонда этой площадки».
    Для операций с экземпляром проверяется площадка, на которой он числится сейчас.
  kind: permission
  applies_to:
  - table:inventory.copies
  trigger: symbol:services/inventory/service.py::_require_custodian
  related:
  - R-INVENTORY-TRANSFER-06
  - R-INVENTORY-RECONCILE-01
  implemented_by:
  - symbol: services/inventory/service.py::_require_custodian
    lines: 39-41
    hash: 0835dd3ec002
  - symbol: services/inventory/service.py::register_copy
    lines: 78-78
    hash: 52da43a4bafe
  - symbol: services/inventory/service.py::_out_loan
    lines: 324-325
    hash: fb2162a4e738
  - symbol: services/inventory/service.py::_on_shelf
    lines: 381-382
    hash: a8234e0c1689
  - symbol: services/inventory/service.py::issue_ill
    lines: 280-281
    hash: 3d87da916474
  tested_by:
  - tests/test_inventory_copies.py::test_worn_out_write_off_by_custodian_only
  caveats:
  - >
    В общей схеме роли «хранитель фонда» нет: в модели ролей проекта (operator, admin и т.д.) её тоже
    нет. Полномочия держатся только на таблице inventory.custodians, а employee_id приходит в теле запроса
    (custodian_id) и не сверяется с аутентифицированным пользователем.
  status: draft
- id: R-INVENTORY-COPY-01
  title: Инвентарный номер нормализуется и должен иметь вид «ШИФР-00000»
  text: >
    При регистрации экземпляра инвентарный номер обрезается от пробелов и переводится в верхний регистр,
    затем сверяется с шаблоном INVENTORY_NO: 1–4 буквы (кириллица или латиница), дефис, 4–8 цифр. Если
    номер не подходит — DomainError «инвентарный номер должен иметь вид «ШИФР-00000»».
  kind: guard
  applies_to:
  - table:inventory.copies
  trigger: symbol:services/inventory/service.py::register_copy
  related:
  - R-INVENTORY-COPY-02
  implemented_by:
  - symbol: services/inventory/service.py::register_copy
    lines: 79-81
    hash: 52da43a4bafe
  config:
  - services/inventory/service.py::INVENTORY_NO
  tested_by:
  - tests/test_inventory_copies.py::test_inventory_number_is_normalized_and_unique
  caveats:
  - >
    Формат номера проверяет только код. CHECK на inventory.copies.inventory_no нет, поэтому прямая запись
    в БД может сохранить номер в любом формате.
  status: draft
- id: R-INVENTORY-COPY-02
  title: Инвентарный номер уникален во всём фонде
  text: >
    Инвентарный номер не может повторяться ни на одной площадке. Код проверяет номер после нормализации
    и бросает DomainError «инвентарный номер … уже занят». В БД то же самое обеспечивает уникальный ключ
    copies_inventory_no_key.
  kind: invariant
  applies_to:
  - table:inventory.copies
  trigger: symbol:services/inventory/service.py::register_copy
  related:
  - R-INVENTORY-COPY-01
  implemented_by:
  - symbol: services/inventory/service.py::register_copy
    lines: 82-83
    hash: 52da43a4bafe
  enforced_by_db:
  - constraint: copies_inventory_no_key
    hash: 0e39682785bd
  tested_by:
  - tests/test_inventory_copies.py::test_inventory_number_is_normalized_and_unique
  status: draft
- id: R-INVENTORY-COPY-03
  title: Новый экземпляр поступает в фонд доступным и пересчитывает остаток
  text: >
    Зарегистрированный экземпляр получает состояние available на площадке хранителя, acquired_at равен
    текущему моменту. Публикуется inventory.copy_registered, и подписчик on_stock_changed пересчитывает
    остаток издания на площадке.
  kind: effect
  applies_to:
  - table:inventory.copies
  trigger: symbol:services/inventory/service.py::register_copy
  effects:
  - event:inventory.copy_registered
  - table:inventory.stock_levels
  related:
  - R-INVENTORY-STOCK-01
  implemented_by:
  - symbol: services/inventory/service.py::register_copy
    lines: 84-95
    hash: 52da43a4bafe
  - symbol: services/inventory/consumers.py::on_stock_changed
    lines: 18-20
    hash: 5c4b50479016
  tested_by:
  - tests/test_inventory_copies.py::test_registered_copies_counted_in_stock
  caveats:
  - >
    В срезе графа у inventory.copy_registered и других событий остатка не указан публикатор: их публикует
    _stock_event(topic=…), и экстрактор такой вызов не распознаёт.
  status: draft
- id: R-INVENTORY-COPY-04
  title: Состояние экземпляра ограничено фиксированным набором
  text: >
    В БД CHECK copies_state_check разрешает только перечисленные состояния: available, on_loan, in_transit,
    lost, damaged, written_off. Любое другое значение отклоняется на уровне БД.
  kind: invariant
  applies_to:
  - table:inventory.copies
  trigger: table:inventory.copies
  related:
  - R-INVENTORY-WRITEOFF-03
  implemented_by:
  - symbol: services/inventory/service.py::_set_state
    lines: 51-53
    hash: d071fefa1aa8
  enforced_by_db:
  - constraint: copies_state_check
    hash: ab599e7dbbaa
  tested_by:
  - tests/test_inventory_copies.py::test_state_is_constrained
  status: draft
- id: R-INVENTORY-STOCK-01
  title: Остаток издания считается по экземплярам, которые ещё числятся в фонде
  text: >
    recount_stock пересчитывает stock_levels для пары (издание, площадка). В total входят экземпляры в
    состояниях ON_BALANCE (available, on_loan, in_transit), в available — только available. Утерянные,
    испорченные и списанные экземпляры из остатка выпадают. Экземпляр в пути числится на площадке-отправителе,
    пока его не примут.
  kind: calculation
  applies_to:
  - table:inventory.stock_levels
  trigger: symbol:services/inventory/consumers.py::on_stock_changed
  effects:
  - table:inventory.stock_levels
  roles:
  - system
  related:
  - R-INVENTORY-STOCK-02
  implemented_by:
  - symbol: services/inventory/service.py::recount_stock
    lines: 107-125
    hash: fa8a741272ee
  config:
  - services/inventory/models.py::ON_BALANCE
  tested_by:
  - tests/test_inventory_copies.py::test_registered_copies_counted_in_stock
  - tests/test_inventory_copies.py::test_lost_copy_is_written_off_and_leaves_stock
  - tests/test_inventory_transfers.py::test_transfer_moves_copy_and_stock
  - tests/test_inventory_ill.py::test_ill_loan_due_in_thirty_days
  status: draft
- id: R-INVENTORY-STOCK-02
  title: Остаток пересчитывается асинхронно по событиям движения экземпляра
  text: >
    on_stock_changed подписан на inventory.copy_registered, copy_relocated, copy_written_off, transfer_shipped,
    transfer_received, transfer_cancelled, ill_issued и ill_returned. Он пересчитывает остаток для каждой
    площадки из payload.venue_ids: при приёме перемещения и сверке это обе площадки. Остаток в stock_levels
    обновляется только после доставки событий, а не в транзакции операции.
  kind: effect
  applies_to:
  - table:inventory.stock_levels
  trigger: event:inventory.copy_registered
  effects:
  - table:inventory.stock_levels
  roles:
  - system
  related:
  - R-INVENTORY-STOCK-01
  implemented_by:
  - symbol: services/inventory/consumers.py::on_stock_changed
    lines: 10-20
    hash: 5c4b50479016
  - symbol: services/inventory/service.py::_stock_event
    lines: 56-59
    hash: f01d85eb02a4
  tested_by:
  - tests/test_inventory_transfers.py::test_transfer_moves_copy_and_stock
  - tests/test_inventory_transfers.py::test_cancel_in_transit_returns_copy_to_shelf
  caveats:
  - >
    На inventory.copy_lost и inventory.copy_damaged on_stock_changed не подписан: остаток после утери
    или порчи пересчитывается только через последующее copy_written_off. Пока событие списания не обработано,
    total и available включают экземпляр в состоянии lost/damaged по старому значению.
  status: draft
- id: R-INVENTORY-STOCK-03
  title: Остатки в БД неотрицательны, и доступных не больше общего числа
  text: >
    CHECK на inventory.stock_levels требует total >= 0 (stock_levels_total_check), available >= 0 (stock_levels_available_check)
    и available <= total (stock_levels_check).
  kind: invariant
  applies_to:
  - table:inventory.stock_levels
  trigger: table:inventory.stock_levels
  related:
  - R-INVENTORY-STOCK-01
  implemented_by:
  - symbol: services/inventory/service.py::recount_stock
    lines: 116-124
    hash: fa8a741272ee
  enforced_by_db:
  - constraint: stock_levels_total_check
    hash: 473d1bc288f9
  - constraint: stock_levels_available_check
    hash: db6351114082
  - constraint: stock_levels_check
    hash: 591a5b8057b0
  status: draft
- id: R-INVENTORY-RECONCILE-01
  title: Сверка переносит экземпляр на другую площадку без оформления перемещения
  text: >
    reconcile_venue по итогам инвентаризации меняет venue_id экземпляра напрямую. Требуется хранитель
    площадки назначения; если по экземпляру есть открытое перемещение — DomainError «по экземпляру оформлено
    перемещение». Публикуется inventory.copy_relocated с обеими площадками для пересчёта остатков.
  kind: effect
  applies_to:
  - table:inventory.copies
  trigger: symbol:services/inventory/service.py::reconcile_venue
  effects:
  - event:inventory.copy_relocated
  - table:inventory.stock_levels
  related:
  - R-INVENTORY-RECONCILE-02
  - R-INVENTORY-STOCK-02
  implemented_by:
  - symbol: services/inventory/service.py::reconcile_venue
    lines: 135-145
    hash: c256599dc4c3
  enforced_by_db:
  - constraint: trg_copies_transfer_lock
    hash: 5ce28ba8bb8b
  tested_by:
  - tests/test_inventory_transfers.py::test_loaned_copy_cannot_change_venue_even_on_reconciliation
  caveats:
  - >
    Код проверяет только хранителя площадки назначения, площадку-источник не проверяет: хранитель любой
    площадки может «забрать» к себе экземпляр чужой. Состояние экземпляра код не проверяет, его блокирует
    только триггер БД. У функции нет HTTP-маршрута.
  status: draft
- id: R-INVENTORY-RECONCILE-02
  title: Выданный по МБА экземпляр не может сменить площадку (триггер БД)
  text: >
    Триггер trg_copies_transfer_lock (функция forbid_transfer_of_loaned_copy) при изменении venue_id отклоняет
    обновление, если экземпляр в состоянии on_loan или по нему есть выдача МБА в статусе out. Ограничение
    срабатывает даже при сверке, где код его не проверяет.
  kind: invariant
  applies_to:
  - table:inventory.copies
  trigger: table:inventory.copies
  related:
  - R-INVENTORY-RECONCILE-01
  - R-INVENTORY-TRANSFER-02
  implemented_by:
  - symbol: services/inventory/service.py::reconcile_venue
    lines: 141-144
    hash: c256599dc4c3
  enforced_by_db:
  - constraint: trg_copies_transfer_lock
    hash: 5ce28ba8bb8b
  - constraint: forbid_transfer_of_loaned_copy
    hash: cfd8a4d76e08
  tested_by:
  - tests/test_inventory_transfers.py::test_loaned_copy_cannot_change_venue_even_on_reconciliation
  status: draft
- id: R-INVENTORY-TRANSFER-01
  title: Перемещение оформляет хранитель площадки, где лежит экземпляр, и только на другую площадку
  text: >
    request_transfer требует хранителя текущей площадки экземпляра. Площадка назначения должна отличаться
    от текущей, иначе «экземпляр уже находится на этой площадке». В БД это дублируют CHECK transfers_check
    (from_venue_id <> to_venue_id) и триггер trg_transfers_origin: from_venue_id обязан совпадать с текущей
    площадкой экземпляра.
  kind: guard
  applies_to:
  - table:inventory.transfers
  trigger: symbol:services/inventory/service.py::request_transfer
  effects:
  - table:inventory.transfers
  related:
  - R-INVENTORY-TRANSFER-02
  - R-INVENTORY-TRANSFER-03
  implemented_by:
  - symbol: services/inventory/service.py::request_transfer
    lines: 155-158
    hash: eca6a8077fdc
  - symbol: services/inventory/service.py::request_transfer
    lines: 175-185
    hash: eca6a8077fdc
  enforced_by_db:
  - constraint: transfers_check
    hash: f4434b36caeb
  - constraint: trg_transfers_origin
    hash: 6449ca64100b
  - constraint: check_transfer_origin
    hash: 8ccfa600a53e
  tested_by:
  - tests/test_inventory_transfers.py::test_transfer_must_start_where_copy_is
  - tests/test_inventory_transfers.py::test_transfer_moves_copy_and_stock
  status: draft
- id: R-INVENTORY-TRANSFER-02
  title: Перемещать можно только доступный экземпляр
  text: >
    Выданный экземпляр (on_loan) переместить нельзя: «экземпляр выдан, перемещение невозможно до возврата».
    Экземпляр в любом другом состоянии, кроме available, тоже: «перемещать можно только экземпляр, доступный
    на площадке».
  kind: guard
  applies_to:
  - table:inventory.transfers
  trigger: symbol:services/inventory/service.py::request_transfer
  related:
  - R-INVENTORY-RECONCILE-02
  implemented_by:
  - symbol: services/inventory/service.py::request_transfer
    lines: 159-162
    hash: eca6a8077fdc
  tested_by:
  - tests/test_inventory_transfers.py::test_loaned_copy_cannot_be_transferred
  status: draft
- id: R-INVENTORY-TRANSFER-03
  title: По экземпляру не больше одного незавершённого перемещения
  text: >
    Если у экземпляра есть перемещение в статусе requested или in_transit (OPEN_TRANSFER), новое не оформляется:
    «по экземпляру уже есть незавершённое перемещение». В БД это обеспечивает частичный уникальный индекс
    uq_transfers_one_open. После отмены или приёма можно оформить новое.
  kind: invariant
  applies_to:
  - table:inventory.transfers
  trigger: symbol:services/inventory/service.py::request_transfer
  related:
  - R-INVENTORY-TRANSFER-01
  implemented_by:
  - symbol: services/inventory/service.py::request_transfer
    lines: 163-164
    hash: eca6a8077fdc
  - symbol: services/inventory/service.py::_open_transfer
    lines: 62-65
    hash: aaa2ce389d27
  enforced_by_db:
  - constraint: uq_transfers_one_open
    hash: 0af5135c715a
  config:
  - services/inventory/models.py::OPEN_TRANSFER
  tested_by:
  - tests/test_inventory_transfers.py::test_one_open_transfer_per_copy
  - tests/test_inventory_transfers.py::test_cancel_in_transit_returns_copy_to_shelf
  status: draft
- id: R-INVENTORY-TRANSFER-04
  title: На площадке должен остаться минимум экземпляров издания
  text: >
    Перед оформлением перемещения код считает другие доступные экземпляры того же издания на площадке.
    Если их меньше MIN_COPIES_ON_VENUE (1), отказ: «на площадке должен остаться хотя бы один экземпляр
    издания». Выданные и находящиеся в пути экземпляры в этот счёт не входят.
  kind: guard
  applies_to:
  - table:inventory.transfers
  trigger: symbol:services/inventory/service.py::request_transfer
  related:
  - R-INVENTORY-TRANSFER-02
  implemented_by:
  - symbol: services/inventory/service.py::request_transfer
    lines: 165-174
    hash: eca6a8077fdc
  config:
  - services/inventory/settings.py::MIN_COPIES_ON_VENUE
  tested_by:
  - tests/test_inventory_transfers.py::test_last_copy_stays_on_venue
  caveats:
  - >
    Текст ошибки «хотя бы один» зашит в код и не меняется вместе с MIN_COPIES_ON_VENUE. Учитываются только
    уже оформленные перемещения: два одновременных запроса по разным экземплярам могут вместе вывести
    площадку ниже минимума (ограничения в БД нет).
  status: draft
- id: R-INVENTORY-TRANSFER-05
  title: Отправка переводит экземпляр в путь, приём переносит его на новую площадку
  text: >
    ship_transfer выполняет хранитель площадки-отправителя и только для перемещения в статусе requested
    с доступным экземпляром. Экземпляр переходит в in_transit, перемещение — в in_transit с shipped_at,
    публикуется inventory.transfer_shipped. receive_transfer выполняет хранитель площадки назначения и
    только из in_transit: экземпляр получает новую площадку и состояние available, перемещение — статус
    received с closed_at, публикуется inventory.transfer_received с обеими площадками.
  kind: effect
  applies_to:
  - table:inventory.transfers
  - table:inventory.copies
  trigger: symbol:services/inventory/service.py::ship_transfer
  effects:
  - event:inventory.transfer_shipped
  - event:inventory.transfer_received
  - table:inventory.stock_levels
  related:
  - R-INVENTORY-TRANSFER-06
  - R-INVENTORY-TRANSFER-08
  implemented_by:
  - symbol: services/inventory/service.py::ship_transfer
    lines: 197-206
    hash: bb595a80432a
  - symbol: services/inventory/service.py::receive_transfer
    lines: 212-227
    hash: 985977d431d4
  enforced_by_db:
  - constraint: transfers_check1
    hash: 9304f8af03da
  - constraint: transfers_check2
    hash: 03cfe99e18c1
  - constraint: transfers_status_check
    hash: e14e37653582
  tested_by:
  - tests/test_inventory_transfers.py::test_transfer_moves_copy_and_stock
  status: draft
- id: R-INVENTORY-TRANSFER-06
  title: Отменить перемещение может хранитель любой из двух площадок или система
  text: >
    cancel_transfer с custodian_id требует, чтобы сотрудник был хранителем площадки-отправителя или площадки
    назначения, иначе AccessDenied «отменить перемещение может хранитель одной из площадок». custodian_id=None
    означает системную отмену (истёк срок), права тогда не проверяются. Завершённое перемещение отменить
    нельзя: «перемещение уже завершено».
  kind: permission
  applies_to:
  - table:inventory.transfers
  trigger: symbol:services/inventory/service.py::cancel_transfer
  roles:
  - system
  related:
  - R-INVENTORY-TRANSFER-07
  - R-INVENTORY-TRANSFER-08
  implemented_by:
  - symbol: services/inventory/service.py::cancel_transfer
    lines: 236-244
    hash: 91d2d5b3b2e5
  config:
  - services/inventory/models.py::OPEN_TRANSFER
  tested_by:
  - tests/test_inventory_transfers.py::test_cancel_in_transit_returns_copy_to_shelf
  status: draft
- id: R-INVENTORY-TRANSFER-07
  title: Отмена перемещения в пути возвращает экземпляр на полку отправителя
  text: >
    При отмене перемещения в статусе in_transit экземпляр снова становится available и остаётся на площадке-отправителе:
    venue_id не менялся. Перемещение получает статус cancelled, причину (по API — note или «cancelled»)
    и closed_at, публикуется inventory.transfer_cancelled.
  kind: effect
  applies_to:
  - table:inventory.transfers
  - table:inventory.copies
  trigger: symbol:services/inventory/service.py::cancel_transfer
  effects:
  - event:inventory.transfer_cancelled
  - table:inventory.stock_levels
  related:
  - R-INVENTORY-TRANSFER-06
  implemented_by:
  - symbol: services/inventory/service.py::cancel_transfer
    lines: 245-251
    hash: 91d2d5b3b2e5
  - symbol: services/inventory/api.py::cancel_transfer
