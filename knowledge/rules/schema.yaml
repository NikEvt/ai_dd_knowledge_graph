# Правила, найденные при сверке кода с бизнес-схемой (knowledge/sources/erp-library.md).
# Требования, у которых в коде нет реализации, — в knowledge/requirements/ без реализующих правил.
# Статус verified ставит только человек (tools/knowledge/verify_rule.py).
rules:
- id: R-SCHEMA-CLIENT-01
  title: Клиент заводится один раз оператором, данные общие для всех заявок
  text: >
    Нового клиента заводит оператор. Клиент заводится в системе один раз, и его данные общие для всех
    его заявок.
  kind: constraint
  roles:
  - operator
  implemented_by:
  - symbol: services/applications/service.py::create_client
    hash: dc724224c749
  deviates_from:
  - requirement: REQ-CLIENT-01
    note: >
      реализовано частично: create_client не проверяет роль; у applications.clients нет уникальности (паспорт,
      ФИО+дата рождения), поэтому один и тот же клиент может быть заведён дважды — и тогда дедупликация
      по client_id+sphere_id не сработает
  status: draft
- id: R-SCHEMA-APP-01
  title: Оператора заявки переназначить нельзя
  text: >
    Оператор — создатель заявки. Переназначить оператора нельзя: на время отсутствия оператор передаёт
    свою учётную запись коллеге.
  kind: constraint
  roles:
  - operator
  implemented_by:
  - symbol: services/applications/service.py::create_application
    hash: 37162b401c18
  satisfies:
  - requirement: REQ-ROLE-03
    hash: f019a0211205
  caveats:
  - >
    реализовано неявно: operator_id задаётся только при создании и в коде нигде не меняется; в БД защиты
    нет — trg_applications_core_immutable охраняет только sphere_id и representative_id
  status: draft
- id: R-SCHEMA-LINK-01
  title: По ссылке нельзя изменить данные заявки
  text: >
    Через публичную ссылку можно только посмотреть свободные окна, записаться, перенести или отменить
    визит. Данные заявки по ссылке изменить нельзя.
  kind: constraint
  roles:
  - client
  - representative
  implemented_by:
  - symbol: services/scheduling/api.py::slots
    hash: bd5b1d3cdea7
  - symbol: services/scheduling/api.py::book
    hash: 462831f5d7ab
  - symbol: services/scheduling/api.py::cancel
    hash: 46d6ab9688c5
  satisfies:
  - requirement: REQ-BOOK-06
    hash: adf9a9fc3f6d
  status: draft
- id: R-SCHEMA-FINE-01
  title: О просрочке представителю сообщает оператор по почте
  text: >
    Когда система отметила срыв срока возврата, оператор вручную сообщает о просрочке представителю по
    почте вне системы.
  kind: obligation
  roles:
  - operator
  implemented_by:
  - symbol: services/scheduling/jobs.py::flag_overdue
    hash: 60a1ef28c116
  - symbol: services/chat/consumers.py::_handler
    hash: f46c9b143853
  deviates_from:
  - requirement: REQ-FINE-04
    note: >
      реализовано частично: система только пишет в чат «Срыв срока возврата книги»; задачи или напоминания
      оператору нет, факт уведомления не фиксируется
  status: draft
- id: R-SCHEMA-SPHERE-01
  title: Название сферы уникально
  text: >
    Сферы — общий справочник тематических разделов. Две сферы с одинаковым названием завести нельзя (UNIQUE
    в БД).
  kind: constraint
  enforced_by_db:
  - constraint: spheres_name_key
    hash: c13b99ebc1a2
  status: draft
