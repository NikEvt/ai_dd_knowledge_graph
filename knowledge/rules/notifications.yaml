- id: R-NOTIF-LOG-01
  title: Каждое письмо сохраняется в журнале emails
  text: >
    send записывает в notifications.emails заявку, список получателей, тип, ссылку на шаблон, готовый
    текст, статус и created_at (clock.now()). Запись идёт в той же сессии, что и обработка события. Реальной
    доставки (SMTP и т. п.) в модуле нет: status=sent значит «письмо сформировано».
