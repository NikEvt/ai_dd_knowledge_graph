    hash: 4b84ad405815
  status: verified
  verified_at: '2026-10-23'
  verified_fingerprint: 826da9f4dcc9
- id: R-APP-BOOKING-01
  title: Готовность к записи фиксируется и запускает выдачу ссылки на запись
  text: >
    При переходе в awaiting_issue (после проверки debt/social или после полной оплаты paid) заполняется
    booking_reached_at (один раз) и публикуется application.ready_for_booking; scheduling по нему формирует
    публичную ссылку на запись (issue_link).
  kind: effect
  applies_to:
  - table:applications.applications
  trigger: symbol:services/applications/service.py::mark_ready_for_booking
  effects:
  - 'writes: table:applications.applications.booking_reached_at'
  - event:application.ready_for_booking
  - symbol:services/scheduling/consumers.py::on_ready_for_booking
  roles:
  - system
  related:
  - R-APP-REVIEW-05
  - R-APP-PAY-03
  - R-APP-UNARCHIVE-02
  implemented_by:
  - symbol: services/applications/service.py::mark_ready_for_booking
    lines: 158-164
    hash: 325452f7ecb6
  - symbol: services/scheduling/consumers.py::on_ready_for_booking
    lines: 13-13
    hash: 648936515cb6
  tested_by:
  - tests/test_kinds.py::test_debt_application_skips_invoice
  - tests/test_paid_flow.py::test_paid_application_full_path
  satisfies:
  - requirement: REQ-PROC-08
    hash: cfc9688cc2cd
  - requirement: REQ-BOOK-01
    hash: 036fc6e3e9dd
  status: draft
- id: R-APP-CLIENT-01
  title: Данные клиента обновляет проверяющий заявки-источника
  text: >
    Если указана заявка-источник, обновить клиента может только её проверяющий (AccessDenied иначе). Разрешены
    только поля CLIENT_EDITABLE_FIELDS (full_name, passport, birth_date, email), прочие — DomainError
    «неизвестные поля клиента». Без source_application_id проверка прав не выполняется.
  kind: permission
  applies_to:
  - table:applications.clients
  trigger: symbol:services/applications/service.py::update_client
  effects:
  - 'writes: table:applications.clients'
  roles:
  - reviewer
  related:
  - R-APP-CLIENT-02
  implemented_by:
  - symbol: services/applications/service.py::update_client
    lines: 140-153
    hash: e66be2942058
