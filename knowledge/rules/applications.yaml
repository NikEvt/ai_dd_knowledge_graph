  - services/applications/service.py::CLIENT_EDITABLE_FIELDS
  tested_by:
  - tests/test_review.py::test_incomplete_client_goes_to_rework
  deviates_from:
  - requirement: REQ-CLIENT-02
    note: >
      Схема: данные клиента обновляет только проверяющий. Код: при вызове без source_application_id роль
      и закрепление не проверяются — обновить данные может кто угодно.
  status: draft
- id: R-APP-CLIENT-02
  title: Изменение ФИО, паспорта или даты рождения клиента публикует client.updated (слушатель ORM)
  text: >
    Слушатель before_flush при изменении полей TRACKED_FIELDS (full_name, passport, birth_date) неявно
    ставит clients.updated_at и публикует client.updated с полями и source_application_id (из session.info).
    Изменение email событие не порождает.
  kind: effect
  applies_to:
  - table:applications.clients
  trigger: table:applications.clients
  effects:
  - 'writes: table:applications.clients.updated_at'
  - event:client.updated
  roles:
  - system
  related:
  - R-APP-CLIENT-01
  - R-APP-CLIENT-03
  implemented_by:
  - symbol: services/applications/listeners.py::_domain_events
    lines: 23-36
    hash: ae1acbff72cf
  config:
  - services/applications/listeners.py::TRACKED_FIELDS
  satisfies:
  - requirement: REQ-CLIENT-04
    hash: 5e0238e14c61
  status: draft
- id: R-APP-CLIENT-03
  title: Обновление клиента возвращает его заявки из ожидания счёта или оплаты на проверку
  text: >
    По client.updated все заявки клиента на этапах awaiting_invoice и awaiting_payment, кроме заявки-источника,
    переводятся системой в on_review. Заявки на awaiting_issue и дальше не перепроверяются; review_started_at
    при этом не сбрасывается.
  kind: effect
  applies_to:
  - table:applications.applications
  trigger: event:client.updated
  effects:
  - transition:awaiting_invoice->on_review
  - transition:awaiting_payment->on_review
  roles:
  - system
  related:
  - R-APP-CLIENT-02
  - R-APP-ARCHIVE-01
  implemented_by:
  - symbol: services/applications/consumers.py::on_client_updated
    lines: 52-63
    hash: b9e398d012dd
  - transition: awaiting_invoice->on_review
    hash: bb5857d29271
  - transition: awaiting_payment->on_review
    hash: bb5857d29271
  satisfies:
  - requirement: REQ-CLIENT-04
    hash: 5e0238e14c61
  caveats:
  - >
    Схема: перепроверка не должна приводить к потере заявки. Код: review_started_at остаётся от первой
    проверки, поэтому возвращённая на проверку заявка, у которой проверка началась больше REVIEW_ARCHIVE_DAYS
    назад, при ближайшем запуске archive_stale уходит в архив с outcome=no_data.
  status: draft
- id: R-APP-PAY-01
  title: Выставление счёта за книги переводит заявку в ожидание оплаты
  text: >
    По invoice.issued с invoice_kind=books заявка на этапе awaiting_invoice переводится в awaiting_payment
    (actor accountant). Счета на штраф этап не меняют.
  kind: effect
  applies_to:
  - application.kind=paid
  trigger: event:invoice.issued
  effects:
  - transition:awaiting_invoice->awaiting_payment
  roles:
  - accountant
  related:
  - R-APP-PAY-02
  implemented_by:
