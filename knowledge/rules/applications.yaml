# Правила модуля applications: извлечены LLM (tools/knowledge/bootstrap_rules.sh) из кода и среза графа.
# Статус verified ставит только человек. Хэши обновляет tools/knowledge/drift.py --write.
rules:
- id: R-APP-CREATE-01
  title: Вид заявки определяется при создании по флагу «социальная» и признаку долга представителя
  text: >
    При создании заявки вид задаётся один раз: если оператор отметил заявку социальной — social, иначе
    debt, если представителю разрешено работать в долг (debt_allowed), иначе paid. Последующая смена debt_allowed
    у представителя на вид существующих заявок не влияет. Допустимые значения вида ограничены CHECK в
    БД.
  kind: calculation
  applies_to:
  - table:applications.applications
  trigger: symbol:services/applications/service.py::create_application
  effects:
  - 'writes: table:applications.applications.kind'
  roles:
  - operator
  related:
  - R-APP-ADMIN-01
  implemented_by:
  - symbol: services/applications/service.py::create_application
    lines: 90-93
    hash: 37162b401c18
  enforced_by_db:
  - constraint: applications_kind_check
    hash: 320a2d8c57ea
  tested_by:
  - tests/test_kinds.py::test_debt_kind_comes_from_representative
  - tests/test_kinds.py::test_social_application_skips_invoice
  satisfies:
  - requirement: REQ-KIND-01
    hash: 78d949df9291
  status: draft
- id: R-APP-CREATE-02
  title: Сфера заявки должна быть активна на площадке
  text: >
    Создание заявки, смена площадки и смена площадки при возврате из архива требуют, чтобы на площадке
    была запись venue_spheres для сферы заявки с active=true; иначе DomainError «на площадке нет сферы
    заявки».
  kind: guard
  applies_to:
  - table:applications.venue_spheres
  trigger: symbol:services/applications/service.py::_check_sphere_at_venue
  roles:
  - operator
  related:
  - R-APP-ADMIN-04
  - R-APP-VENUE-CHANGE-01
  - R-APP-UNARCHIVE-02
  implemented_by:
  - symbol: services/applications/service.py::_check_sphere_at_venue
    lines: 44-46
    hash: 635bd4429515
  - symbol: services/applications/service.py::create_application
    lines: 87-87
    hash: 37162b401c18
  tested_by:
  - tests/test_venue_change.py::test_new_venue_must_have_sphere
  satisfies:
  - requirement: REQ-SPHERE-01
    hash: 6e42e75b81fa
  - requirement: REQ-VENUE-04
    hash: 70a5508c09d4
  - requirement: REQ-SPHERE-04
    hash: 8d815af2b86c
  status: draft
- id: R-APP-CREATE-03
  title: В заявке есть книги, и все они из сферы заявки и прайса площадки
  text: >
    Список книг не может быть пустым («в заявке нет книг»); каждая книга должна принадлежать сфере заявки
    и иметь цену в прайсе площадки заявки, иначе DomainError. Проверка выполняется при создании, смене
    книг, смене площадки и при возврате из архива с новыми площадкой или книгами.
  kind: guard
  applies_to:
  - table:applications.application_books
  trigger: symbol:services/applications/service.py::_check_books
  roles:
  - operator
  related:
  - R-APP-CREATE-02
  - R-APP-BOOKS-01
  implemented_by:
  - symbol: services/applications/service.py::_check_books
    lines: 50-60
    hash: f962fc9ceecf
  enforced_by_db:
  - constraint: prices_price_check
    hash: 3e5c255b548b
  satisfies:
  - requirement: REQ-SPHERE-02
    hash: b0a3da9cfdb6
  status: draft
- id: R-APP-CREATE-04
  title: При создании заявки закрепляется проверяющий оператор площадки и открывается первая попытка
  text: >
    Новая заявка создаётся в этапе draft; оператор-создатель закрепляется за ней, site_checker_id берётся
    из площадки, создаётся попытка №1 с датой начала. Номер попытки уникален в пределах заявки (UNIQUE
    в БД).
  kind: effect
  applies_to:
  - table:applications.applications
  - table:applications.attempts
  trigger: symbol:services/applications/service.py::create_application
  effects:
  - 'writes: table:applications.attempts'
  - stage:draft
  roles:
  - operator
  related:
  - R-APP-ACCESS-01
  implemented_by:
  - symbol: services/applications/service.py::create_application
    lines: 94-109
    hash: 37162b401c18
  enforced_by_db:
  - constraint: attempts_application_id_no_key
    hash: 908adf94d66d
  - constraint: applications_stage_check
    hash: 115a188cf4f9
  tested_by:
  - tests/test_paid_flow.py::test_paid_application_full_path
  satisfies:
  - requirement: REQ-ROLE-08
    hash: 6df9b9765365
  - requirement: REQ-ARCH-11
    hash: 6bbf175bb2d2
  status: draft
- id: R-APP-ACCESS-01
  title: Оператор работает только со своими заявками
  text: >
    Отправка на проверку, смена площадки, смена книг, ручной архив и возврат из архива доступны только
    оператору, закреплённому за заявкой (operator_id); иначе AccessDenied «заявка закреплена за другим
    оператором».
  kind: permission
  applies_to:
  - table:applications.applications
  trigger: symbol:services/applications/service.py::_require_operator
  roles:
  - operator
  implemented_by:
  - symbol: services/applications/service.py::_require_operator
    lines: 39-40
    hash: 1f8cd1239e6b
  - symbol: services/applications/service.py::submit_for_review
    lines: 115-115
    hash: 83cc4573dfd5
  - symbol: services/applications/service.py::change_venue
    lines: 203-203
    hash: 7b7cfa004862
  - symbol: services/applications/service.py::change_books
    lines: 238-238
    hash: cc5f2da3f7bc
  - symbol: services/applications/service.py::archive
    lines: 255-256
    hash: 0615233675ae
  - symbol: services/applications/service.py::unarchive
    lines: 274-274
    hash: 976b593881f0
  tested_by:
  - tests/test_review.py::test_operator_works_only_with_own_applications
  satisfies:
  - requirement: REQ-ROLE-04
    hash: 6ba1a1adbdce
  status: draft
- id: R-APP-CORE-01
  title: Сферу и представителя заявки сменить нельзя
  text: >
    Триггер БД запрещает UPDATE sphere_id и representative_id заявки (check_violation). В коде сервиса
    нет операций, меняющих эти поля; для другой сферы или представителя создаётся новая заявка.
  kind: invariant
  applies_to:
  - table:applications.applications
  trigger: table:applications.applications
  related:
  - R-APP-UNARCHIVE-02
  enforced_by_db:
  - constraint: trg_applications_core_immutable
    hash: d4952c57c5df
  - constraint: forbid_core_change
    hash: f1c2bcdb1048
  satisfies:
  - requirement: REQ-PROC-04
    hash: dedf488450c9
  status: verified
  verified_at: '2026-10-23'
  verified_fingerprint: 86a7cfa70cf3
- id: R-APP-BOOKS-01
  title: Книги меняют только в черновике или на доработке
  text: >
    Оператор заявки может заменить список книг только на этапах draft и needs_rework; иначе DomainError
    «книги меняют в черновике или на доработке». Новые книги проходят проверку сферы и прайса.
  kind: guard
  applies_to:
  - table:applications.application_books
  trigger: symbol:services/applications/service.py::change_books
  effects:
  - 'writes: table:applications.application_books'
  roles:
  - operator
  related:
  - R-APP-CREATE-03
  - R-APP-UNARCHIVE-02
  implemented_by:
  - symbol: services/applications/service.py::change_books
    lines: 239-242
    hash: cc5f2da3f7bc
  satisfies:
  - requirement: REQ-PROC-07
    hash: 99863a5e95eb
  deviates_from:
  - requirement: REQ-INV-07
    note: >
      Схема (§4): если после выставления счёта до оплаты меняются книги, счёт аннулируется и выставляется
      заново. Код: после проверки книги меняются только через архив и возврат из него (R-APP-UNARCHIVE-02);
      других путей смены книг нет.
  status: draft
- id: R-APP-REVIEW-01
  title: Отправка на проверку фиксирует начало проверки один раз
  text: >
    Оператор заявки переводит её из draft или needs_rework в on_review. Поле review_started_at заполняется
    только при первой отправке и не сбрасывается при возврате с доработки — от него считается срок автоархива
    (сбрасывается только при возврате из архива).
  kind: effect
  applies_to:
  - table:applications.applications
  trigger: symbol:services/applications/service.py::submit_for_review
  effects:
  - transition:draft->on_review
  - transition:needs_rework->on_review
  - 'writes: table:applications.applications.review_started_at'
  roles:
  - operator
  related:
  - R-APP-ARCHIVE-01
  - R-APP-ACCESS-01
  implemented_by:
  - symbol: services/applications/service.py::submit_for_review
    lines: 116-118
    hash: 83cc4573dfd5
  - transition: draft->on_review
    hash: 6080e315f1cc
  - transition: needs_rework->on_review
    hash: 6080e315f1cc
  tested_by:
  - tests/test_review.py::test_incomplete_client_goes_to_rework
  - tests/test_archive.py::test_stuck_review_goes_to_archive_after_month
  satisfies:
  - requirement: REQ-ARCH-01
    hash: e9be12f01b67
  status: draft
- id: R-APP-REVIEW-02
  title: Проверяющего назначают только до прохождения проверки
  text: >
    Назначить или переназначить проверяющего можно, пока заявка в draft, on_review или needs_rework; иначе
    DomainError «проверяющего назначают до прохождения проверки». Проверка роли (руководитель проверяющих)
    в коде отсутствует — указана только в docstring.
  kind: permission
  applies_to:
  - table:applications.applications
  trigger: symbol:services/applications/service.py::assign_reviewer
  effects:
  - 'writes: table:applications.applications.reviewer_id'
  roles:
  - reviewer_lead
  related:
  - R-APP-REVIEW-03
  implemented_by:
  - symbol: services/applications/service.py::assign_reviewer
    lines: 125-127
    hash: f36f8475dc43
  tested_by:
  - tests/test_review.py::test_only_assigned_reviewer_approves
  deviates_from:
  - requirement: REQ-ROLE-05
    note: >
      Схема: назначает и переназначает только руководитель проверяющих. Код: роль вызывающего не проверяется,
      назначить может любой вызывающий.
  status: draft
- id: R-APP-REVIEW-03
  title: Подтверждает или возвращает заявку только назначенный проверяющий
  text: >
    Без назначенного проверяющего заявку подтвердить нельзя (DomainError «на заявку не назначен проверяющий»);
    подтверждение и возврат на доработку выполняет только reviewer_id заявки, иначе AccessDenied «заявку
    проверяет другой проверяющий». Возврат переводит on_review -> needs_rework.
  kind: permission
  applies_to:
  - table:applications.applications
  trigger: symbol:services/applications/service.py::approve
  effects:
  - transition:on_review->needs_rework
  roles:
  - reviewer
  related:
  - R-APP-REVIEW-02
  - R-APP-REVIEW-04
  implemented_by:
  - symbol: services/applications/service.py::approve
    lines: 169-172
    hash: 263c830daa5d
  - symbol: services/applications/service.py::return_for_rework
    lines: 193-195
    hash: 746748d2d78d
  - transition: on_review->needs_rework
    hash: 585ef125d882
  tested_by:
  - tests/test_review.py::test_approve_requires_assigned_reviewer
  - tests/test_review.py::test_only_assigned_reviewer_approves
  - tests/test_review.py::test_incomplete_client_goes_to_rework
  satisfies:
  - requirement: REQ-ROLE-06
    hash: e9280f2a21d8
  - requirement: REQ-PROC-03
    hash: 38f934ed3773
  status: draft
- id: R-APP-REVIEW-04
  title: Заявку нельзя подтвердить без ФИО, паспорта и даты рождения клиента
  text: >
    При подтверждении проверяются обязательные поля клиента из REQUIRED_CLIENT_FIELDS (full_name, passport,
    birth_date); если чего-то нет — DomainError «не хватает данных клиента: …».
  kind: guard
  applies_to:
