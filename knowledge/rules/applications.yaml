    hash: 1c499946b7d8
  status: draft
- id: R-APP-REVIEW-05
  title: Этап после проверки зависит от вида заявки и наличия действующего счёта
  text: >
    После подтверждения платная заявка уходит в awaiting_payment, если по ней есть действующий счёт за
    книги (после возврата из архива или повторной проверки), иначе в awaiting_invoice; заявки в долг и
    социальные сразу уходят в awaiting_issue и становятся готовыми к записи. Публикуется application.review_passed.
  kind: effect
  applies_to:
  - table:applications.applications
  trigger: symbol:services/applications/service.py::approve
  effects:
  - transition:on_review->awaiting_invoice
  - transition:on_review->awaiting_payment
  - transition:on_review->awaiting_issue
  - event:application.review_passed
  roles:
  - reviewer
  related:
  - R-APP-BOOKING-01
  - R-APP-DEDUP-01
  implemented_by:
  - symbol: services/applications/service.py::approve
    lines: 177-185
    hash: 263c830daa5d
  - transition: on_review->awaiting_invoice
    hash: a323ed5d9506
  - transition: on_review->awaiting_payment
    hash: 9a48761d6b51
  - transition: on_review->awaiting_issue
    hash: 0e48e83290df
