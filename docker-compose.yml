services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports: ["${DB_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7
    ports: ["${REDIS_PORT:-56379}:6379"]
