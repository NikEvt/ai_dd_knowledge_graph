# Вопросы для Doc QA: агент отвечает, читая только сгенерированную документацию.
# Ответ засчитывается, если совпадает по смыслу с answer и опирается на нужное правило.
questions:
  - {id: Q01, rules: [GT-APP-01], q: "Как определяется, что заявка «в долг»?", answer: "По признаку представителя debt_allowed, который задаёт администратор; оператор этого не выбирает."}
  - {id: Q02, rules: [GT-APP-02], q: "Можно ли сменить сферу заявки? Где это проверяется?", answer: "Нельзя; запрет обеспечивает триггер БД trg_applications_core_immutable (и представителя тоже)."}
  - {id: Q03, rules: [GT-VEN-02], q: "До какого момента можно сменить площадку социальной заявки?", answer: "Только до формирования ссылки на запись (черновик, проверка, доработка, архив); обеспечивается триггером БД."}
  - {id: Q04, rules: [GT-VEN-01], q: "Можно ли сменить площадку платной заявки после оплаты?", answer: "Нет, только через возврат платежа и новую оплату."}
  - {id: Q05, rules: [GT-VEN-06], q: "Что происходит со счётом, если площадку сменили после выставления, но до оплаты?", answer: "Счёт аннулируется (событие от смены площадки), заявка возвращается к ожиданию счёта, новый счёт — по прайсу и реквизитам новой площадки."}
  - {id: Q06, rules: [GT-VEN-07], q: "Что получат клиент и представитель, если при смене площадки клиент уже был записан?", answer: "Письмо об отмене записи; формируется новая ссылка на запись."}
  - {id: Q07, rules: [GT-REV-04], q: "Какие заявки клиента уходят на повторную проверку, если проверяющий обновил паспорт?", answer: "Другие его заявки, ожидающие счёта или оплаты; заявки на этапе записи и дальше не трогаются."}
  - {id: Q08, rules: [GT-REV-04], q: "Уходит ли заявка на перепроверку при смене email клиента?", answer: "Нет, email не входит в отслеживаемые поля."}
  - {id: Q09, rules: [GT-REV-02], q: "Какие данные клиента обязательны для прохождения проверки?", answer: "ФИО, паспорт, дата рождения."}
  - {id: Q10, rules: [GT-DUP-02, GT-DUP-03], q: "В какой момент закрываются дубли заявок клиента по одной сфере?", answer: "Для платной — при полной оплате, для заявки в долг — при прохождении проверки."}
  - {id: Q11, rules: [GT-DUP-04], q: "Закроется ли социальная заявка, если по той же сфере оплатили платную?", answer: "Нет, социальные и платные/в долг не пересекаются."}
  - {id: Q12, rules: [GT-DUP-05], q: "Что происходит со счётом заявки, закрытой как дубль?", answer: "Неоплаченный счёт аннулируется."}
  - {id: Q13, rules: [GT-ARC-01], q: "Через сколько уходит в архив заявка, застрявшая на проверке?", answer: "Через месяц (REVIEW_ARCHIVE_DAYS=30) с начала проверки, любого вида, исход no_data."}
  - {id: Q14, rules: [GT-ARC-03], q: "Уйдёт ли в архив социальная заявка, если клиент полгода не записывается после получения ссылки?", answer: "Нет."}
  - {id: Q15, rules: [GT-ARC-06], q: "Нужно ли выставлять новый счёт после возврата заявки из архива?", answer: "Только если изменилась сумма; иначе остаётся прежний счёт и месяц на оплату отсчитывается заново."}
  - {id: Q16, rules: [GT-ARC-08], q: "Как оплаченная заявка попадает в архив, если клиент передумал?", answer: "Главный бухгалтер оформляет возврат платежа; заявка уходит в архив с исходом refund."}
  - {id: Q17, rules: [GT-BIL-03], q: "Как считается сумма счёта за книги и меняется ли она при изменении надбавки?", answer: "Цена книг по прайсу площадки плюс надбавка представителя; фиксируется при выставлении и не пересчитывается."}
  - {id: Q18, rules: [GT-BIL-04], q: "Сколько действующих счетов за книги может быть у заявки и где это обеспечено?", answer: "Один; уникальный частичный индекс БД uq_invoices_one_active_books."}
  - {id: Q19, rules: [GT-BIL-02], q: "Можно ли выставить счёт, если у площадки нет реквизитов?", answer: "Нет."}
  - {id: Q20, rules: [GT-BPM-02], q: "Откроется ли выдача по платной заявке при частичной оплате?", answer: "Нет, только при полной оплате (условие fully_paid в процессе)."}
  - {id: Q21, rules: [GT-FIN-03], q: "Как гасится штраф по заявке в долг?", answer: "Вне системы; погашение отмечает оператор, счёт на штраф не выставляется."}
  - {id: Q22, rules: [GT-FIN-01], q: "От чего зависит размер штрафа?", answer: "От представителя и площадки (ставки из админки) и вида штрафа."}
  - {id: Q23, rules: [GT-LOAN-01, GT-LOAN-02], q: "Какой срок пользования книгами и когда отмечается срыв срока?", answer: "30 дней с выдачи; фоновая задача отмечает просрочку через 30 дней с выдачи."}
  - {id: Q24, rules: [GT-SCH-01], q: "Может ли проверяющий оператор поставить в окне больше мест, чем максимум площадки?", answer: "Нет; ограничение проверяет триггер БД по реплике лимита, который задаёт администратор."}
  - {id: Q25, rules: [GT-SCH-05], q: "Может ли клиент отменить визит за день до даты?", answer: "Нет, только не позднее чем за 2 дня; позже — только оператор."}
  - {id: Q26, rules: [GT-SCH-06], q: "Освобождаются ли книги при неявке клиента?", answer: "Нет, остаются закреплёнными; освобождаются при смене площадки, архиве и выдаче."}
  - {id: Q27, rules: [GT-NOT-03], q: "Какие шаблоны писем использует заявка в долг?", answer: "Шаблоны платных заявок."}
  - {id: Q28, rules: [GT-NOT-01], q: "Какие письма уходят при переносе визита?", answer: "Письмо об отмене и письмо о новой записи."}
  - {id: Q29, rules: [GT-CHAT-01], q: "Можно ли отредактировать сообщение в чате заявки?", answer: "Нет; запрет обеспечивает триггер БД."}
  - {id: Q30, rules: [GT-CHAT-03], q: "Видит ли главный бухгалтер чат заявки?", answer: "Нет; видит администратор, главный бухгалтер и руководитель проверяющих — нет."}
